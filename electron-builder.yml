appId: dev.zion.matrix
productName: ZION
directories:
  output: dist
files:
  - src/**/*
  - dist-renderer/**/*
  - package.json
win:
  target:
    - nsis
    - portable
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
electronLanguages:
  - zh-CN
  - en
