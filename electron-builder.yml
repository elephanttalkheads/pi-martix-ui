appId: dev.zion.matrix
productName: ZION
directories:
  output: dist
files:
  - src/**/*
  - dist-renderer/**/*
  - package.json
win:
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}
portable:
  artifactName: ${productName}-Portable-${version}-${arch}.${ext}
electronLanguages:
  - zh-CN
  - en
