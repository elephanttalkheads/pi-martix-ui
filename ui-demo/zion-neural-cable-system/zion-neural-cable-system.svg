<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
  viewBox="0 0 900 660" role="img" aria-labelledby="title desc">
  <title id="title">ZION Neo 脑机接口连接线系统</title>
  <desc id="desc">透明背景的六路 Matrix 字符神经束设计样本。每一路径、端头、机械节点与字符信号层均可独立编辑。</desc>
  <metadata>
    {
      "coordinateSpace": "component-swatch-not-sidebar",
      "runtime": "replace every path[data-runtime-d] from DOM anchors",
      "sourceAnchor": [0.3203125, 0.4453125],
      "podAnchorClosed": [0.1758373, 0.5696068],
      "podAnchorOpen": [0.1752392, 0.5696068]
    }
  </metadata>
  <style>
    :root{
      --bg:#010a04;--fg:#3dff8f;--muted:#1da754;--mid:#23c468;
      --accent:#00ff41;--accent-muted:#14b850;--bright:#c2ffd9;
    }
    .route-bed{fill:none;stroke:var(--muted);stroke-opacity:.18;stroke-width:1;stroke-dasharray:1 7;vector-effect:non-scaling-stroke}
    .route-nerve{fill:none;stroke:var(--mid);stroke-opacity:.28;stroke-width:1.25;stroke-dasharray:6 4 1 6;vector-effect:non-scaling-stroke}
    .glyphs{font:11px "Matrix Code","Share Tech Mono",ui-monospace,monospace;letter-spacing:7px;fill:var(--mid);fill-opacity:.48}
    .source-shell,.target-shell{fill:var(--bg);stroke:var(--muted);stroke-width:1;vector-effect:non-scaling-stroke}
    .source-pin,.target-pin{fill:var(--accent-muted)}
    .node{fill:var(--bg);stroke:var(--accent-muted);stroke-width:1;vector-effect:non-scaling-stroke}
    .node-mark{fill:var(--mid)}
    .signal-head{opacity:0}
    .signal-head text{font:11px "Matrix Code","Share Tech Mono",ui-monospace,monospace;fill:var(--bright)}
    .signal-tail{stroke:var(--fg);stroke-opacity:.64;stroke-width:1.5;stroke-dasharray:1 8;vector-effect:non-scaling-stroke}
    .is-active .route-nerve{stroke-opacity:.46}
    .is-active .glyphs{fill-opacity:.68}
    .is-active .signal-head{opacity:1}
    .is-hover .route-nerve{stroke-opacity:.36}
    .is-hover .glyphs{fill-opacity:.58}
  </style>
