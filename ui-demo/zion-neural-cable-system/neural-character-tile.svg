<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 20" role="img" aria-labelledby="title desc">
  <title id="title">Matrix 字符神经束平铺纹理</title>
  <desc id="desc">透明背景的低亮绿色字符、短线与节点，可沿动态路径重复。</desc>
  <style>
    text{font:11px "Matrix Code","Share Tech Mono",monospace;letter-spacing:7px;fill:#23c468;fill-opacity:.42}
    .dash{stroke:#1da754;stroke-width:1;stroke-dasharray:2 8;vector-effect:non-scaling-stroke}
    .ring{fill:#010a04;stroke:#14b850;stroke-width:1;vector-effect:non-scaling-stroke}
  </style>
  <path class="dash" d="M0 10H192"/>
  <text x="4" y="14">ｱ 0 F &lt; 7 + ｾ A 1 *</text>
  <rect class="ring" x="91" y="5" width="8" height="10"/>
</svg>
