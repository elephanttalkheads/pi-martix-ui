<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ZION 脑机接口连接线实验台</title>
  <style>
    :root{
      --bg:oklch(12.935% .02637 156.773);--surface:oklch(19.42% .04047 156.631);
      --fg:oklch(88.266% .21396 152.335);--muted:oklch(64.04% .16466 150.756);
      --border:oklch(30.979% .0689 153.324);--accent:oklch(86.856% .27758 144.466);
      --mid:#23c468;--accent-muted:#14b850;--bright:#c2ffd9;
      --font-display:"Share Tech Mono","Sarasa Term SC",ui-monospace,monospace;
      --font-body:"Sarasa Term SC","Microsoft YaHei",sans-serif;
      --font-mono:"Matrix Code","Share Tech Mono",ui-monospace,monospace;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--font-body)}
    button{font:inherit}
    button:focus-visible,[tabindex]:focus-visible{outline:1px solid var(--accent);outline-offset:2px}
    .lab{height:100%;display:grid;grid-template-rows:56px minmax(0,1fr)}
    .lab-head{display:flex;align-items:center;gap:18px;padding:0 18px;border-bottom:1px solid var(--border);background:var(--surface)}
    .lab-brand{font:500 13px var(--font-display);letter-spacing:.1em;white-space:nowrap;color:var(--fg)}
    .lab-brand span{color:var(--muted);letter-spacing:.06em}
    .lab-note{margin-left:auto;max-width:58ch;color:var(--muted);font:12px/1.5 var(--font-body)}
    .width-set{display:flex;align-items:center;gap:6px}
    .width-set b{font:500 11px var(--font-display);letter-spacing:.08em;color:var(--muted)}
    .width-btn{min-width:48px;min-height:34px;padding:0 9px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font:12px var(--font-mono)}
    .width-btn:hover,.width-btn[aria-pressed="true"]{border-color:var(--muted);color:var(--fg);background:oklch(23% .055 153 / .42)}
    .stage{min-height:0;display:grid;place-items:center;padding:24px;overflow:auto;background-image:linear-gradient(oklch(30% .06 153 / .14) 1px,transparent 1px);background-size:100% 32px}
    .sidebar-shell{position:relative;height:min(790px,calc(100vh - 104px));min-height:650px;width:var(--side-w,232px);background:oklch(15.8% .035 156 / .97);border:1px solid var(--border);overflow:hidden;transition:width .2s ease-out;isolation:isolate}
    .core-wrap{position:relative;z-index:2;height:174px;border-bottom:1px solid var(--border);padding-top:10px}
    .core-visual{position:relative;height:140px}
    .neo-avatar{position:absolute;left:50%;top:50%;width:120px;height:120px;transform:translate(-50%,-50%);pointer-events:none}
    .neo-avatar>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated}
    .neo-talking{opacity:0}
    .source-anchor{position:absolute;left:32.03125%;top:44.53125%;width:18px;height:14px;transform:translate(-50%,-50%);z-index:3;image-rendering:pixelated}
    .core-label{text-align:center;color:var(--muted);font:11px var(--font-mono);letter-spacing:.22em}
    .session-section{position:relative;z-index:2;height:356px;padding:12px 12px 4px;display:flex;flex-direction:column;min-height:0}
    .session-head{height:44px;flex:none;display:flex;align-items:center;gap:8px;margin-bottom:8px}
    .session-head h2{margin:0;flex:1;color:var(--muted);font:500 11px var(--font-display);letter-spacing:.18em}
    .new-btn{height:44px;padding:0 8px;border:1px solid var(--border);background:transparent;color:var(--muted);font:10px var(--font-mono);letter-spacing:.05em}
    .deck{--gap:8px;position:relative;flex:1;min-height:0;display:grid;grid-auto-rows:calc((100% - var(--gap)*2)/3);gap:var(--gap);overflow-y:auto;overscroll-behavior-y:contain;scrollbar-gutter:stable;scroll-snap-type:y mandatory}
    .deck::-webkit-scrollbar{width:6px}.deck::-webkit-scrollbar-track{background:transparent}.deck::-webkit-scrollbar-thumb{background:var(--accent-muted)}
    .session-pod{container-type:size;--pod-art-width:min(108cqw,324cqh);position:relative;min-height:0;overflow:hidden;border:1px solid transparent;background:transparent;scroll-snap-align:start;scroll-snap-stop:always;cursor:pointer;isolation:isolate}
    .session-pod:hover,.session-pod:focus-visible{background:oklch(28% .075 153 / .14);border-color:oklch(68% .18 152 / .42)}
    .pod-visual{position:absolute;inset:0;overflow:hidden;pointer-events:none}
    .pod-frame{position:absolute;left:50%;top:50%;display:block;width:var(--pod-art-width);height:auto;transform:translate(-50%,-50%);image-rendering:pixelated;filter:brightness(.68) saturate(.78)}
    .pod-frame-open{opacity:0}.delete-armed .pod-frame-open{opacity:1}.delete-armed .pod-frame-closed{opacity:0}
    .active .pod-frame{filter:brightness(1) saturate(.98)}
    .pod-nameplate{position:absolute;z-index:4;left:50%;bottom:8px;transform:translateX(-50%);width:clamp(72px,58%,168px);height:20px;display:grid;grid-template-columns:20px minmax(0,1fr) 20px;align-items:center;background:oklch(13% .03 156 / .94);border:1px solid var(--border);font:12px var(--font-mono);color:var(--fg)}
    .pod-index,.pod-state{display:grid;place-items:center;height:100%;color:var(--muted)}
    .pod-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px;text-align:center}
    .pod-action{width:100%;height:100%;border:0;border-left:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer}
    .pod-action:hover{color:var(--fg);background:oklch(28% .075 153 / .18)}
    .projects{position:relative;z-index:2;min-height:0;height:calc(100% - 530px);border-top:1px solid var(--border);padding:12px;color:var(--muted);font:11px/1.8 var(--font-mono)}
    .projects b{display:block;margin-bottom:6px;font-weight:400;letter-spacing:.14em}.projects span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .cable-layer{position:absolute;z-index:1;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
    .cable-bed{fill:none;stroke:var(--muted);stroke-width:1;stroke-opacity:.2;stroke-dasharray:1 7;vector-effect:non-scaling-stroke}
    .cable-nerve{fill:none;stroke:var(--mid);stroke-width:1.25;stroke-opacity:.3;stroke-dasharray:6 4 1 6;vector-effect:non-scaling-stroke}
    .cable-glyphs{font:11px var(--font-mono);letter-spacing:6px;fill:var(--mid);fill-opacity:.42}
    .cable.active .cable-nerve{stroke-opacity:.48}.cable.active .cable-glyphs{fill-opacity:.62}
    .cable.hover .cable-nerve{stroke-opacity:.36}.cable.hover .cable-glyphs{fill-opacity:.58}
    .cable[hidden]{display:none}
    .terminal-shell{fill:var(--bg);stroke:var(--accent-muted);stroke-width:1;vector-effect:non-scaling-stroke}.terminal-pin{fill:var(--fg)}
    .pulse-char{font:11px var(--font-mono);text-anchor:middle;dominant-baseline:middle;fill:var(--fg)}
    .hologram{position:absolute;z-index:12;left:20px;right:20px;min-height:64px;padding:9px 12px;border:1px solid var(--border);background:oklch(14% .035 155 / .93);pointer-events:none;opacity:0;transform:translateY(5px);transition:opacity .14s,transform .14s}
    .hologram.visible{opacity:1;transform:none}.hologram strong,.hologram span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hologram strong{font:12px/1.5 var(--font-display);color:var(--fg)}.hologram span{font:11px/1.6 var(--font-body);color:var(--muted)}
    .status{position:absolute;z-index:5;left:0;right:0;bottom:0;height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;border-top:1px solid var(--border);background:var(--surface);font:10px var(--font-mono);color:var(--muted)}
    @media(max-width:720px){.lab-head{gap:10px;padding:0 10px}.lab-note{display:none}.stage{padding:14px}.sidebar-shell{height:calc(100vh - 84px)}}
    @media(prefers-reduced-motion:reduce){.sidebar-shell,.hologram{transition:none}.pulse-layer{display:none}}
  </style>
</head>
<body>
  <main class="lab" data-od-id="neural-cable-lab">
    <header class="lab-head" data-od-id="lab-header">
      <div class="lab-brand" data-od-id="lab-title">ZION://NEURAL-CABLE <span>动态锚定实验台</span></div>
      <div class="width-set" aria-label="侧栏宽度">
        <b>宽度</b>
        <button class="width-btn" data-width="160" aria-pressed="false">160</button>
        <button class="width-btn" data-width="232" aria-pressed="true">232</button>
        <button class="width-btn" data-width="480" aria-pressed="false">480</button>
      </div>
      <p class="lab-note">滚动会话列表查看 04–06；点击切换当前线路；右侧按钮只测试开仓，线路路径不变。</p>
    </header>
    <section class="stage" data-od-id="lab-stage">
      <aside class="sidebar-shell" data-od-id="responsive-sidebar" aria-label="脑机接口连接线预览侧栏">
        <svg class="cable-layer" aria-hidden="true"></svg>
        <div class="core-wrap" data-od-id="neo-region">
          <div class="core-visual">
            <div class="neo-avatar" data-neo-avatar>
              <img src="./assets/neo-idle.png" alt="" draggable="false" />
              <img class="neo-talking" src="./assets/neo-talking.png" alt="" draggable="false" />
              <img class="source-anchor" src="./neo-neural-jack.svg" alt="" draggable="false" data-source-anchor />
            </div>
          </div>
          <div class="core-label">NEO · NEURAL LINK</div>
        </div>
        <section class="session-section" data-od-id="session-region">
          <div class="session-head"><h2>会话</h2><button class="new-btn" type="button">＋ 新建会话</button></div>
          <div class="deck" data-deck aria-label="六个会话，每次显示三个">
            <div class="session-pod active" data-session="1" tabindex="0"><span class="pod-visual"><img class="pod-frame pod-frame-closed" data-pod-frame="closed" src="./assets/session-pod-horizontal-closed.png" alt=""/><img class="pod-frame pod-frame-open" data-pod-frame="open" src="./assets/session-pod-horizontal-open.png" alt=""/></span><span class="pod-nameplate"><span class="pod-index">01</span><span class="pod-title">主控会话</span><button class="pod-action" aria-label="切换仓门">×</button></span></div>
            <div class="session-pod" data-session="2" tabindex="0"><span class="pod-visual"><img class="pod-frame pod-frame-closed" data-pod-frame="closed" src="./assets/session-pod-horizontal-closed.png" alt=""/><img class="pod-frame pod-frame-open" data-pod-frame="open" src="./assets/session-pod-horizontal-open.png" alt=""/></span><span class="pod-nameplate"><span class="pod-index">02</span><span class="pod-title">渲染器检查</span><button class="pod-action" aria-label="切换仓门">×</button></span></div>
            <div class="session-pod" data-session="3" tabindex="0"><span class="pod-visual"><img class="pod-frame pod-frame-closed" data-pod-frame="closed" src="./assets/session-pod-horizontal-closed.png" alt=""/><img class="pod-frame pod-frame-open" data-pod-frame="open" src="./assets/session-pod-horizontal-open.png" alt=""/></span><span class="pod-nameplate"><span class="pod-index">03</span><span class="pod-title">样式收敛</span><button class="pod-action" aria-label="切换仓门">×</button></span></div>
            <div class="session-pod" data-session="4" tabindex="0"><span class="pod-visual"><img class="pod-frame pod-frame-closed" data-pod-frame="closed" src="./assets/session-pod-horizontal-closed.png" alt=""/><img class="pod-frame pod-frame-open" data-pod-frame="open" src="./assets/session-pod-horizontal-open.png" alt=""/></span><span class="pod-nameplate"><span class="pod-index">04</span><span class="pod-title">工具链追踪</span><button class="pod-action" aria-label="切换仓门">×</button></span></div>
            <div class="session-pod" data-session="5" tabindex="0"><span class="pod-visual"><img class="pod-frame pod-frame-closed" data-pod-frame="closed" src="./assets/session-pod-horizontal-closed.png" alt=""/><img class="pod-frame pod-frame-open" data-pod-frame="open" src="./assets/session-pod-horizontal-open.png" alt=""/></span><span class="pod-nameplate"><span class="pod-index">05</span><span class="pod-title">协议验证</span><button class="pod-action" aria-label="切换仓门">×</button></span></div>
            <div class="session-pod" data-session="6" tabindex="0"><span class="pod-visual"><img class="pod-frame pod-frame-closed" data-pod-frame="closed" src="./assets/session-pod-horizontal-closed.png" alt=""/><img class="pod-frame pod-frame-open" data-pod-frame="open" src="./assets/session-pod-horizontal-open.png" alt=""/></span><span class="pod-nameplate"><span class="pod-index">06</span><span class="pod-title">发布检查</span><button class="pod-action" aria-label="切换仓门">×</button></span></div>
          </div>
        </section>
        <div class="hologram" data-hologram><strong></strong><span></span></div>
        <div class="projects"><b>PROJECT</b><span>› src/renderer</span><span>› components</span><span>› styles.css</span></div>
        <footer class="status"><span>● DOM ANCHORS</span><span data-visible-count>3 LINKS</span></footer>
      </aside>
    </section>
  </main>
  <script>
    const NS='http://www.w3.org/2000/svg';
    const shell=document.querySelector('.sidebar-shell');
    const svg=document.querySelector('.cable-layer');
    const deck=document.querySelector('[data-deck]');
    const pods=[...document.querySelectorAll('.session-pod')];
    const hologram=document.querySelector('[data-hologram]');
    const visibleCount=document.querySelector('[data-visible-count]');
    const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
    const sourceAnchor=[.3203125,.4453125];
    const podAnchors={closed:[.1758373,.5696068],open:[.1752392,.5696068]};
    const glyphSets=['ｱ 0 F < 7 + ｾ A 1 * ｲ 6','01 ｶ 9 02 F ｷ 4 03 B ｸ 8','A F 3 ｹ 7 C < 0 9 ｺ E 2','ｻｼ 4 0 ｽｾ B 7 ｿｱ 1 E','< + * 8 ｱ 2 > + 5 ｲ F','6 > A > ｵ > 1 > D > ｹ'];
    let queued=false,activeId='1',pulseRAF=0,pulseT=0;
    const cableGroups=new Map();
    function el(name,attrs={}){const node=document.createElementNS(NS,name);for(const [key,value] of Object.entries(attrs))node.setAttribute(key,String(value));return node}
    function buildCable(id){
      const g=el('g',{id:`cable-${id.padStart(2,'0')}`,class:'cable',hidden:'true','data-cable-id':id});
      const bed=el('path',{class:'cable-bed'});const nerve=el('path',{class:'cable-nerve'});
      const routeId=`runtime-route-${id}`;bed.id=routeId;
      const text=el('text',{class:'cable-glyphs'});const textPath=el('textPath',{href:`#${routeId}`,'startOffset':`${(Number(id)*3)%9}%`});textPath.textContent=glyphSets[Number(id)-1];text.append(textPath);
      const target=el('g',{class:'target-terminal'});target.append(el('path',{class:'terminal-shell',d:'M0-8h11v3h5v10h-5v3H0z'}),el('path',{class:'terminal-pin',d:'M2-4h7v2h5v2H2zm0 5h12v2H9v2H2z'}));
      const pulse=el('g',{class:'pulse-layer'});for(let i=0;i<18;i++){const t=el('text',{class:'pulse-char','data-tail':i});t.textContent=i===0?'ｱ':glyphSets[Number(id)-1].replaceAll(' ','')[(i+Number(id))%12]||'0';pulse.append(t)}
      g.append(bed,nerve,text,target,pulse);svg.append(g);cableGroups.set(id,{g,bed,nerve,target,pulse});
    }
    for(let i=1;i<=6;i++)buildCable(String(i));
    function localPoint(rect,x,y){const side=shell.getBoundingClientRect();return{x:rect.left-side.left+rect.width*x,y:rect.top-side.top+rect.height*y}}
    function routeD(s,t,lane){
      const busX=Math.max(8,Math.min(14,shell.clientWidth*.04))+lane*6;
      const exitX=Math.max(busX+26,s.x-Math.max(22,shell.clientWidth*.11));
      const bendY=Math.min(t.y-34,s.y+46+lane*3);
      return `M${s.x.toFixed(1)} ${s.y.toFixed(1)}C${(s.x-16).toFixed(1)} ${s.y.toFixed(1)} ${(exitX+18).toFixed(1)} ${(s.y+6).toFixed(1)} ${exitX.toFixed(1)} ${(s.y+18).toFixed(1)}C${(busX+8).toFixed(1)} ${bendY.toFixed(1)} ${busX.toFixed(1)} ${(t.y-38).toFixed(1)} ${busX.toFixed(1)} ${(t.y-22).toFixed(1)}C${busX.toFixed(1)} ${(t.y-8).toFixed(1)} ${(t.x-34).toFixed(1)} ${t.y.toFixed(1)} ${t.x.toFixed(1)} ${t.y.toFixed(1)}`;
    }
    function updatePaths(){
      queued=false;const side=shell.getBoundingClientRect();svg.setAttribute('viewBox',`0 0 ${side.width} ${side.height}`);
      const avatar=document.querySelector('[data-neo-avatar]').getBoundingClientRect();const source=localPoint(avatar,...sourceAnchor);const deckRect=deck.getBoundingClientRect();
      const deckCenter=(deckRect.top+deckRect.bottom)/2;
      const visiblePods=pods.map(pod=>({pod,rect:pod.getBoundingClientRect()})).filter(({rect})=>rect.bottom>deckRect.top+2&&rect.top<deckRect.bottom-2).sort((a,b)=>Math.abs((a.rect.top+a.rect.bottom)/2-deckCenter)-Math.abs((b.rect.top+b.rect.bottom)/2-deckCenter)).slice(0,3).sort((a,b)=>a.rect.top-b.rect.top);
      const laneById=new Map(visiblePods.map(({pod},lane)=>[pod.dataset.session,lane]));
      for(const pod of pods){
        const id=pod.dataset.session;const cable=cableGroups.get(id);const inView=laneById.has(id);
        if(!inView){cable.g.setAttribute('hidden','true');continue}
        cable.g.removeAttribute('hidden');cable.g.classList.toggle('active',id===activeId);
        const open=pod.classList.contains('delete-armed');const img=pod.querySelector(`[data-pod-frame="${open?'open':'closed'}"]`);const target=localPoint(img.getBoundingClientRect(),...podAnchors[open?'open':'closed']);
        const lane=laneById.get(id);const d=routeD(source,target,lane);cable.bed.setAttribute('d',d);cable.nerve.setAttribute('d',d);cable.target.setAttribute('transform',`translate(${target.x} ${target.y})`);cable.g.dataset.targetX=String(target.x);cable.g.dataset.targetY=String(target.y);
      }
      visibleCount.textContent=`${visiblePods.length} LINKS`;
    }
    function schedule(){if(queued)return;queued=true;requestAnimationFrame(updatePaths)}
    function animatePulse(now){
      const dt=Math.min(48,now-pulseT||16);pulseT=now;
      for(const [id,cable] of cableGroups){if(cable.g.hasAttribute('hidden')||id!==activeId)continue;const path=cable.bed;const len=path.getTotalLength();const phase=((now*.00016+Number(id)*.11)%1)*len;
        [...cable.pulse.children].forEach((char,i)=>{const pos=Math.max(0,phase-i*8);const p=path.getPointAtLength(pos);const next=path.getPointAtLength(Math.min(len,pos+1));const nx=-(next.y-p.y),ny=next.x-p.x,nl=Math.hypot(nx,ny)||1;const j=i?Math.sin(now*.006+i*.8)*1.5:0;char.setAttribute('x',String(p.x+nx/nl*j));char.setAttribute('y',String(p.y+ny/nl*j));char.style.opacity=String(i===0?.95:Math.max(0,(1-i/18)*.7));});}
      if(!reduced)pulseRAF=requestAnimationFrame(animatePulse);
    }
    pods.forEach((pod)=>{
      pod.addEventListener('click',(event)=>{if(event.target.closest('.pod-action'))return;activeId=pod.dataset.session;pods.forEach(p=>p.classList.toggle('active',p===pod));schedule()});
      pod.querySelector('.pod-action').addEventListener('click',(event)=>{event.stopPropagation();pod.classList.toggle('delete-armed');schedule()});
      const show=()=>{const r=pod.getBoundingClientRect(),s=shell.getBoundingClientRect();hologram.style.top=`${Math.max(8,r.top-s.top-72)}px`;hologram.querySelector('strong').textContent=`会话 ${pod.dataset.session} · ${pod.querySelector('.pod-title').textContent}`;hologram.querySelector('span').textContent='动态端点跟随实际培育仓图片，而不是会话卡左边缘。';hologram.classList.add('visible')};
      const setHover=(value)=>cableGroups.get(pod.dataset.session).g.classList.toggle('hover',value);
      pod.addEventListener('pointerenter',()=>{show();setHover(true)});pod.addEventListener('focus',()=>{show();setHover(true)});pod.addEventListener('pointerleave',()=>{hologram.classList.remove('visible');setHover(false)});pod.addEventListener('blur',()=>{hologram.classList.remove('visible');setHover(false)});
    });
    document.querySelectorAll('.width-btn').forEach(btn=>btn.addEventListener('click',()=>{const width=btn.dataset.width;shell.style.setProperty('--side-w',`${width}px`);document.querySelectorAll('.width-btn').forEach(b=>b.setAttribute('aria-pressed',String(b===btn)));schedule()}));
    deck.addEventListener('scroll',()=>{hologram.classList.remove('visible');schedule()},{passive:true});window.addEventListener('resize',schedule,{passive:true});
    const ro=new ResizeObserver(schedule);ro.observe(shell);ro.observe(deck);ro.observe(document.querySelector('[data-neo-avatar]'));pods.forEach(p=>{ro.observe(p);p.querySelectorAll('img').forEach(img=>{img.addEventListener('load',schedule);ro.observe(img)})});
    schedule();if(!reduced)pulseRAF=requestAnimationFrame(animatePulse);window.addEventListener('beforeunload',()=>cancelAnimationFrame(pulseRAF));
  </script>
</body>
</html>
