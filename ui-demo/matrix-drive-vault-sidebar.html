<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZION Matrix Drive Vault — Sidebar Demo</title>
  <style>
    :root {
      color-scheme: dark;
      --sidebar-width: 330px;
      --sidebar-height: 870px;
      --neo-size: 96px;
      --root-pad-x: 12px;
      --energy: #3dff8f;
      --energy-hot: #c8ffd4;
      --energy-mid: #23c468;
      --energy-dim: #167842;
      --cyan: #67d7cf;
      --amber: #e97b4c;
      --iron-0: #010503;
      --iron-1: #06110b;
      --iron-2: #0c1c13;
      --iron-3: #183026;
      --text: #b9e5c5;
      --muted: #628d70;
      --black: #000;
      --pixel-font: "Cascadia Mono", "Lucida Console", "Courier New", monospace;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    button { font: inherit; }

    body {
      min-height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at 0 20%, rgba(25, 146, 70, .16), transparent 27rem),
        linear-gradient(90deg, #010503, #020805 45%, #000 100%);
      font-family: var(--pixel-font);
    }

    .sidebar {
      position: relative;
      isolation: isolate;
      width: var(--sidebar-width);
      height: min(var(--sidebar-height), 100vh);
      min-height: 620px;
      display: flex;
      flex-direction: column;
      padding: 6px var(--root-pad-x);
      overflow: hidden;
      color: var(--text);
      background:
        linear-gradient(90deg, rgba(61,255,143,.045), transparent 18px, transparent calc(100% - 18px), rgba(61,255,143,.035)),
        linear-gradient(180deg, rgba(5,22,13,.98), rgba(0,6,3,.99));
      border-right: 1px solid rgba(61,255,143,.28);
      box-shadow: 12px 0 30px rgba(0,0,0,.74), inset -7px 0 rgba(0,0,0,.24);
    }

    .sidebar::before,
    .sidebar::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .sidebar::before {
      z-index: 8;
      opacity: .17;
      background: repeating-linear-gradient(180deg, transparent 0 2px, rgba(180,255,202,.16) 2px 3px);
      mix-blend-mode: screen;
    }

    .sidebar::after {
      z-index: 9;
      box-shadow: inset 0 0 44px #000, inset 0 0 2px rgba(200,255,212,.42);
    }

    .matrix-rain {
      position: absolute;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      opacity: .18;
      filter: blur(.15px);
      pointer-events: none;
    }

    .brand-row,
    .workspace-toolbar,
    .workspace-deck,
    .footer {
      position: relative;
      z-index: 4;
    }

    .brand-row {
      flex: 0 0 104px;
      height: 104px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) var(--neo-size) 28px;
      align-items: center;
      gap: 6px;
      padding: 4px 0 4px 4px;
      margin-bottom: 8px;
      overflow: visible;
      border-bottom: 1px solid rgba(61,255,143,.12);
    }

    .brand-lockup {
      position: relative;
      min-width: 0;
      height: 48px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-left: 7px;
      color: var(--energy);
      text-transform: uppercase;
      text-decoration: none;
    }

    .brand-lockup::before {
      content: "";
      position: absolute;
      left: 0;
      top: 3px;
      width: 3px;
      height: 40px;
      background: linear-gradient(var(--energy-hot), var(--energy), #082f18);
      box-shadow: 4px 0 0 #0b4d27, 0 0 9px rgba(61,255,143,.55);
    }

    .brand-line {
      position: relative;
      width: max-content;
      max-width: 100%;
      color: #08150e;
      font-family: "Lucida Console", var(--pixel-font);
      font-size: 16px;
      font-weight: 900;
      line-height: 18px;
      letter-spacing: 1.7px;
      white-space: nowrap;
      -webkit-text-stroke: 1px var(--energy);
      text-shadow:
        2px 0 0 #0a6f38,
        0 2px 0 #0a6f38,
        2px 2px 0 #00351a,
        4px 4px 0 rgba(0,0,0,.9);
    }

    .brand-line:last-of-type {
      color: #102016;
      -webkit-text-stroke-color: var(--energy-hot);
      letter-spacing: 3px;
    }

    .brand-caption {
      margin-top: 2px;
      color: var(--muted);
      font-size: 6px;
      line-height: 7px;
      letter-spacing: 1.8px;
      white-space: nowrap;
    }

    .neo-frame {
      position: relative;
      width: var(--neo-size);
      height: var(--neo-size);
      align-self: center;
      overflow: visible;
      filter: drop-shadow(0 0 6px rgba(61,255,143,.26));
    }

    .neo-frame::before,
    .neo-frame::after {
      content: "";
      position: absolute;
      pointer-events: none;
    }

    .neo-frame::before {
      inset: 3px;
      border: 1px solid rgba(61,255,143,.32);
      clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
      background: radial-gradient(circle at 58% 42%, rgba(61,255,143,.16), transparent 55%);
    }

    .neo-frame::after {
      right: -2px;
      bottom: 8px;
      width: 26px;
      height: 2px;
      background: var(--energy);
      box-shadow: 0 -4px 0 rgba(61,255,143,.28), 0 0 7px rgba(61,255,143,.8);
    }

    .neo-avatar {
      position: relative;
      z-index: 2;
      width: var(--neo-size);
      height: var(--neo-size);
      display: block;
      object-fit: contain;
      image-rendering: pixelated;
    }

    .icon-button {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      padding: 0;
      color: var(--muted);
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    .icon-button svg { width: 16px; height: 16px; stroke-width: 1.7; }
    .icon-button:hover,
    .icon-button:focus-visible {
      color: var(--energy-hot);
      outline: 1px solid rgba(61,255,143,.48);
      outline-offset: -2px;
      background: rgba(61,255,143,.08);
      box-shadow: inset 2px 2px 0 rgba(61,255,143,.06);
    }

    .workspace-toolbar {
      flex: 0 0 36px;
      height: 36px;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0 0 0 4px;
      margin: 2px -4px 4px 0;
      overflow: hidden;
      border: 1px solid rgba(61,255,143,.13);
      background:
        linear-gradient(90deg, rgba(12,48,27,.72), rgba(2,13,7,.82)),
        repeating-linear-gradient(90deg, transparent 0 7px, rgba(61,255,143,.08) 7px 8px);
      box-shadow: inset 0 2px 0 rgba(200,255,212,.04), 0 2px 0 #000;
    }

    .toolbar-label {
      flex: 0 0 auto;
      color: #78a988;
      font-size: 14px;
      line-height: 20px;
      letter-spacing: .5px;
    }

    .toolbar-spacer { flex: 1 1 auto; }

    .new-session-icon {
      position: relative;
      color: var(--energy);
      background: rgba(61,255,143,.08);
      box-shadow: inset 0 0 0 1px rgba(61,255,143,.28);
    }

    .new-session-icon::after {
      content: "NEW";
      position: absolute;
      right: 2px;
      bottom: 1px;
      color: rgba(200,255,212,.62);
      font-size: 5px;
      line-height: 5px;
      letter-spacing: .5px;
    }

    .workspace-deck {
      min-height: 0;
      flex: 1 1 auto;
      margin: 0 -12px 0 -4px;
      padding-left: 4px;
      overflow: hidden;
    }

    .workspace-scroll {
      position: relative;
      height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 0 2px 16px 4px;
      margin: 0 2px 0 -4px;
      scrollbar-width: thin;
      scrollbar-color: rgba(61,255,143,.33) rgba(0,0,0,.42);
    }

    .workspace-scroll::-webkit-scrollbar { width: 7px; }
    .workspace-scroll::-webkit-scrollbar-track { background: rgba(0,0,0,.42); }
    .workspace-scroll::-webkit-scrollbar-thumb {
      border: 2px solid rgba(0,0,0,.72);
      background: rgba(61,255,143,.38);
      box-shadow: inset 0 0 0 1px rgba(200,255,212,.14);
    }

    .workspace-group {
      position: relative;
      width: calc(100% - 10px);
      margin: 0 0 4px;
    }

    .workspace-cap {
      position: relative;
      width: 100%;
      height: 34px;
      display: grid;
      grid-template-columns: 16px minmax(0, 1fr) auto;
      align-items: center;
      gap: 6px;
      padding: 0 8px;
      overflow: hidden;
      color: #d5ecd9;
      border: 0;
      background:
        linear-gradient(180deg, #4b2419 0 3px, #1b1611 3px 6px, transparent 6px),
        linear-gradient(90deg, #2d1712 0 9px, #132018 9px calc(100% - 9px), #2d1712 calc(100% - 9px)),
        repeating-linear-gradient(90deg, rgba(233,123,76,.18) 0 2px, transparent 2px 9px),
        #09120d;
      box-shadow:
        inset 0 0 0 1px #48281d,
        inset 0 -3px 0 #000,
        inset 5px 0 0 #17120f,
        inset -5px 0 0 #17120f;
      text-align: left;
      cursor: default;
      image-rendering: pixelated;
    }

    .workspace-cap::before {
      content: "";
      position: absolute;
      left: 5px;
      right: 5px;
      top: 5px;
      height: 1px;
      background: linear-gradient(90deg, var(--amber), transparent 20%, transparent 80%, var(--amber));
      opacity: .78;
    }

    .workspace-cap::after {
      content: "";
      position: absolute;
      left: 3px;
      top: 14px;
      width: 2px;
      height: 2px;
      background: #bc704f;
      box-shadow: 0 9px 0 #30160f;
    }

    .folder-icon {
      position: relative;
      z-index: 2;
      width: 16px;
      height: 12px;
      border: 2px solid var(--amber);
      background: #111b14;
      box-shadow: 2px 2px 0 #000;
    }

    .folder-icon::before {
      content: "";
      position: absolute;
      left: -2px;
      top: -5px;
      width: 7px;
      height: 3px;
      border: 2px solid var(--amber);
      border-bottom: 0;
      background: #111b14;
    }

    .workspace-name {
      position: relative;
      z-index: 2;
      min-width: 0;
      overflow: hidden;
      color: #d8e9dc;
      font-size: 13px;
      line-height: 20px;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-shadow: 1px 1px 0 #000;
    }

    .workspace-count {
      position: relative;
      z-index: 2;
      color: #b76a49;
      font-size: 9px;
      letter-spacing: 1px;
    }

    .generated-texture {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      background-image: url("./assets/workspace-session-d/zion-rack-material-atlas.png");
      background-repeat: no-repeat;
      background-size: 100% 300%;
      mix-blend-mode: screen;
      image-rendering: pixelated;
      pointer-events: none;
    }

    .texture-top { background-position: center top; opacity: .9; }
    .texture-bay { background-position: center center; opacity: .72; }
    .texture-drive { inset: 2px 7px; background-position: center bottom; opacity: .76; }

    .hardware-svg {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      overflow: visible;
      shape-rendering: crispEdges;
      pointer-events: none;
    }

    .cap-hardware { filter: drop-shadow(1px 1px 0 #000); }
    .bay-hardware { opacity: .78; }
    .drive-hardware { inset: 2px 7px; width: calc(100% - 14px); height: calc(100% - 4px); opacity: .72; }

    .rack-bay {
      position: relative;
      width: 100%;
      height: 34px;
      overflow: visible;
      background:
        linear-gradient(90deg,
          #020403 0 3px,
          #28534a 3px 5px,
          #0a1b17 5px 10px,
          transparent 10px calc(100% - 10px),
          #0a1b17 calc(100% - 10px) calc(100% - 5px),
          #28534a calc(100% - 5px) calc(100% - 3px),
          #020403 calc(100% - 3px)),
        repeating-linear-gradient(180deg, #07100b 0 2px, #020604 2px 4px);
      box-shadow: inset 0 -1px 0 #000;
    }

    .rack-bay::before,
    .rack-bay::after {
      content: "";
      position: absolute;
      z-index: 1;
      top: 7px;
      width: 2px;
      height: 2px;
      background: var(--cyan);
      opacity: .5;
      box-shadow: 0 16px 0 rgba(103,215,207,.22);
    }

    .rack-bay::before { left: 6px; }
    .rack-bay::after { right: 6px; }

    .session-drive {
      position: absolute;
      z-index: 3;
      inset: 2px 0 0;
      width: 100%;
      height: 32px;
      display: grid;
      grid-template-columns: 16px minmax(0, 1fr) auto;
      align-items: center;
      column-gap: 4px;
      padding: 0 8px;
      overflow: visible;
      color: #84b593;
      border: 0;
      background: transparent;
      text-align: left;
      cursor: pointer;
    }

    .session-drive::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 1px 7px 2px;
      background:
        linear-gradient(90deg,
          #101914 0 18px,
          #07100b 18px 22px,
          #0a1710 22px calc(100% - 27px),
          #061009 calc(100% - 27px) calc(100% - 9px),
          #121c17 calc(100% - 9px)),
        repeating-linear-gradient(180deg, transparent 0 3px, rgba(61,255,143,.035) 3px 4px);
      border: 1px solid #244a35;
      box-shadow:
        inset 0 2px 0 #1a2b22,
        inset 0 -2px 0 #010302,
        2px 2px 0 #000;
      clip-path: polygon(4px 0, calc(100% - 4px) 0, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 0 calc(100% - 4px), 0 4px);
    }

    .session-drive::after {
      content: "";
      position: absolute;
      z-index: 1;
      left: 11px;
      top: 10px;
      width: 8px;
      height: 8px;
      background:
        linear-gradient(90deg, #020403 0 2px, transparent 2px 3px, #020403 3px 5px, transparent 5px 6px, #020403 6px),
        #214a32;
      box-shadow: 0 0 0 1px #061009;
      opacity: .82;
    }

    .session-drive:hover,
    .session-drive:focus-visible {
      color: #b6e8c3;
      outline: none;
    }

    .session-drive:hover::before,
    .session-drive:focus-visible::before {
      border-color: #3b8f5b;
      background-color: #0d2115;
    }

    .session-drive.active {
      color: var(--energy-hot);
      text-shadow: 0 0 4px rgba(61,255,143,.38);
    }

    .session-drive.active::before {
      border-color: var(--energy);
      background:
        linear-gradient(90deg,
          #13291d 0 18px,
          #06140b 18px 22px,
          #0b2114 22px calc(100% - 27px),
          #06160c calc(100% - 27px) calc(100% - 9px),
          #163023 calc(100% - 9px)),
        repeating-linear-gradient(180deg, transparent 0 3px, rgba(200,255,212,.06) 3px 4px);
      box-shadow:
        inset 0 2px 0 #28513a,
        inset 0 -2px 0 #010503,
        inset 0 0 10px rgba(61,255,143,.09),
        2px 2px 0 #000,
        0 0 7px rgba(61,255,143,.22);
    }

    .session-drive.active .texture-drive { opacity: 1; filter: brightness(1.18); }

    /* Legacy uses the previous complete PNG modules. Hybrid uses CSS structure + SVG hardware + generated texture fragments. */
    .sidebar[data-style="legacy"] .generated-texture,
    .sidebar[data-style="legacy"] .hardware-svg { display: none; }

    .sidebar[data-style="legacy"] .workspace-cap {
      background: url("./assets/workspace-session-d/matrix-rack-top.png") center / 100% 100% no-repeat;
      box-shadow: none;
    }

    .sidebar[data-style="legacy"] .workspace-cap::before,
    .sidebar[data-style="legacy"] .workspace-cap::after,
    .sidebar[data-style="legacy"] .rack-bay::before,
    .sidebar[data-style="legacy"] .rack-bay::after { display: none; }

    .sidebar[data-style="legacy"] .rack-bay {
      background: url("./assets/workspace-session-d/matrix-rack-bay.png") center / 100% 100% no-repeat;
      box-shadow: none;
    }

    .sidebar[data-style="legacy"] .session-drive::before {
      inset: 0;
      background: url("./assets/workspace-session-d/matrix-session-drive.png") center / 100% 100% no-repeat;
      border: 0;
      clip-path: none;
      box-shadow: none;
      opacity: .82;
      filter: brightness(.72) saturate(.68);
    }

    .sidebar[data-style="legacy"] .session-drive::after { display: none; }
    .sidebar[data-style="legacy"] .session-drive.active::before {
      opacity: 1;
      filter: brightness(1.08) saturate(1.08) drop-shadow(0 0 4px rgba(61,255,143,.26));
    }

    .slot {
      position: relative;
      z-index: 2;
      width: 16px;
      height: 20px;
    }

    .slot::before {
      content: "";
      position: absolute;
      left: 4px;
      top: 7px;
      width: 5px;
      height: 5px;
      background: #173626;
      box-shadow: 0 0 0 1px #000;
    }

    .active .slot::before {
      background: var(--energy-hot);
      box-shadow: 0 0 0 1px #0b4b26, 0 0 6px var(--energy);
      animation: drive-led 1.2s steps(2, jump-none) infinite;
    }

    .session-title {
      position: relative;
      z-index: 2;
      min-width: 0;
      overflow: hidden;
      font-size: 14px;
      line-height: 20px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .session-time {
      position: relative;
      z-index: 2;
      flex: 0 0 auto;
      margin-left: 2px;
      color: #5f8d70;
      font-size: 12px;
      line-height: 20px;
      white-space: nowrap;
    }

    .receiver {
      position: absolute;
      z-index: 7;
      right: 4px;
      top: 11px;
      width: 7px;
      height: 10px;
      border: 1px solid #204b33;
      background: #010503;
      box-shadow: inset 2px 0 0 #0c2617;
      pointer-events: none;
    }

    .active .receiver {
      border-color: var(--energy);
      box-shadow: inset 2px 0 0 #174f2b, 0 0 7px rgba(61,255,143,.75);
    }

    .cable-layer {
      position: absolute;
      inset: 0;
      z-index: 2;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }

    .cable-bed {
      fill: none;
      stroke: #000;
      stroke-width: 10;
      stroke-linecap: square;
      stroke-linejoin: bevel;
      filter: drop-shadow(2px 2px 0 rgba(0,0,0,.9));
    }

    .cable-sheath {
      fill: none;
      stroke: #153c29;
      stroke-width: 6;
      stroke-linecap: square;
      stroke-linejoin: bevel;
    }

    .cable-nerve {
      fill: none;
      stroke: var(--energy);
      stroke-width: 2;
      stroke-linecap: square;
      stroke-dasharray: 3 5;
      filter: drop-shadow(0 0 3px rgba(61,255,143,.8));
      animation: cable-flow 900ms steps(8, end) infinite;
    }

    .cable-stitch {
      fill: none;
      stroke: rgba(200,255,212,.72);
      stroke-width: 1;
      stroke-linecap: square;
      stroke-dasharray: 1 15;
      animation: cable-flow 1.8s steps(12, end) reverse infinite;
    }

    .pulse { fill: var(--energy-hot); filter: drop-shadow(0 0 4px var(--energy)); }

    .footer {
      flex: 0 0 50px;
      height: 50px;
      display: flex;
      align-items: center;
      gap: 4px;
      border-top: 1px solid rgba(61,255,143,.14);
      background: linear-gradient(180deg, rgba(0,0,0,.16), rgba(3,15,8,.84));
    }

    .settings {
      min-width: 0;
      flex: 1 1 auto;
      height: 42px;
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 4px 0 4px -2px;
      padding: 0 10px 0 8px;
      overflow: hidden;
      color: #83ad8e;
      border: 0;
      background: transparent;
      font-size: 14px;
      line-height: 22px;
      cursor: pointer;
    }

    .settings svg { width: 16px; height: 16px; }
    .settings:hover,
    .settings:focus-visible {
      color: var(--energy-hot);
      outline: 1px solid rgba(61,255,143,.28);
      outline-offset: -3px;
      background: rgba(61,255,143,.05);
    }

    .settings small {
      color: #315b40;
      font-size: 7px;
      letter-spacing: 1.4px;
    }

    .style-toggle {
      position: relative;
      flex: 0 0 96px;
      height: 34px;
      display: grid;
      grid-template-columns: 9px minmax(0, 1fr);
      align-items: center;
      gap: 5px;
      padding: 8px 6px 3px;
      overflow: hidden;
      color: var(--energy-hot);
      border: 1px solid rgba(61,255,143,.36);
      background:
        linear-gradient(90deg, rgba(11,54,29,.84), rgba(1,12,6,.94)),
        repeating-linear-gradient(90deg, transparent 0 5px, rgba(61,255,143,.06) 5px 6px);
      box-shadow: inset 0 0 0 1px #000, 2px 2px 0 #000;
      font-family: var(--pixel-font);
      font-size: 8px;
      letter-spacing: .8px;
      cursor: pointer;
    }

    .style-toggle::before {
      content: "STYLE";
      position: absolute;
      left: 5px;
      top: 2px;
      color: #3b7650;
      font-size: 5px;
      line-height: 5px;
      letter-spacing: 1.2px;
    }

    .style-toggle:hover,
    .style-toggle:focus-visible {
      outline: 1px solid var(--energy-hot);
      outline-offset: 1px;
      filter: brightness(1.18);
    }

    .style-led {
      width: 7px;
      height: 7px;
      background: var(--energy);
      box-shadow: 0 0 0 1px #082413, 0 0 6px rgba(61,255,143,.72);
    }

    .sidebar[data-style="legacy"] .style-led {
      background: var(--amber);
      box-shadow: 0 0 0 1px #3b160e, 0 0 5px rgba(233,123,76,.62);
    }

    .measure-tag {
      position: absolute;
      right: 13px;
      bottom: 52px;
      z-index: 5;
      color: rgba(61,255,143,.26);
      font-size: 6px;
      letter-spacing: 1.2px;
      pointer-events: none;
    }

    @keyframes cable-flow { to { stroke-dashoffset: -16; } }
    @keyframes drive-led { 50% { opacity: .42; } }

    @media (prefers-reduced-motion: reduce) {
      .cable-nerve,
      .cable-stitch,
      .active .slot::before { animation: none; }
      .pulse { display: none; }
    }
  </style>
</head>
<body>
  <aside class="sidebar" id="sidebar" data-style="hybrid" aria-label="ZION 工作区会话侧边栏">
    <canvas class="matrix-rain" id="matrixRain" aria-hidden="true"></canvas>

    <header class="brand-row">
      <a class="brand-lockup" href="#" aria-label="DeepSeek ZION 首页">
        <span class="brand-line">DEEPSEEK</span>
        <span class="brand-line">ZION</span>
        <span class="brand-caption">NEURAL DRIVE CONTROL</span>
      </a>
      <span class="neo-frame" id="neoFrame" aria-hidden="true">
        <img
          class="neo-avatar"
          id="neoAvatar"
          src="../src/renderer/src/assets/neo-avatar/neo-side-profile-neural-port-v5.png"
          alt=""
        />
      </span>
      <button class="icon-button" type="button" aria-label="收起侧边栏" title="收起侧边栏（仅图标）">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" aria-hidden="true">
          <rect x="1.5" y="2" width="13" height="12" rx="1" />
          <path d="M6 2v12M9 6l-2 2 2 2" />
        </svg>
      </button>
    </header>

    <div class="workspace-toolbar" aria-label="工作区工具栏">
      <span class="toolbar-label">工作区</span>
      <span class="toolbar-spacer"></span>
      <button class="icon-button" type="button" aria-label="搜索会话" title="搜索会话（仅图标）">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" aria-hidden="true">
          <circle cx="7" cy="7" r="4.5" /><path d="m10.5 10.5 3 3" />
        </svg>
      </button>
      <button class="icon-button" type="button" aria-label="视图选项" title="视图选项（仅图标）">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" aria-hidden="true">
          <path d="M2 4h12M2 8h12M2 12h12" /><path d="M5 2v4M11 6v4M7 10v4" />
        </svg>
      </button>
      <button class="icon-button" type="button" aria-label="添加工作区" title="添加工作区（仅图标）">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" aria-hidden="true">
          <path d="M2 4.5h4l1.3 1.5H14v7.5H2z" /><path d="M11 1.5v5M8.5 4H13.5" />
        </svg>
      </button>
      <button class="icon-button new-session-icon" type="button" aria-label="新建会话" title="新建会话（已移入工作区栏，仅图标）">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" aria-hidden="true">
          <circle cx="8" cy="8" r="5.5" /><path d="M8 5v6M5 8h6" />
        </svg>
      </button>
    </div>

    <section class="workspace-deck" aria-label="工作区和会话">
      <div class="workspace-scroll" id="workspaceScroll" role="tree" aria-label="会话"></div>
    </section>

    <svg class="cable-layer" id="cableLayer" aria-hidden="true">
      <path class="cable-bed" id="cableBed" />
      <path class="cable-sheath" id="cableSheath" />
      <path class="cable-nerve" id="cableNerve" />
      <path class="cable-stitch" id="cableStitch" />
      <circle class="pulse" r="3">
        <animateMotion id="pulseMotion" dur="2.2s" repeatCount="indefinite" rotate="auto">
          <mpath href="#cableNerve" />
        </animateMotion>
      </circle>
    </svg>

    <span class="measure-tag" aria-hidden="true">330W // 34U STEP // LIVE LINK</span>

    <footer class="footer">
      <button class="settings" type="button">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" aria-hidden="true">
          <path d="M6.6 1.8h2.8l.6 1.6 1.5.6 1.5-.7 1.4 2.4-1.2 1.1.2 1.6 1.3 1-1.4 2.4-1.7-.5-1.3 1-.3 1.7H7.2l-.3-1.7-1.3-1-1.7.5-1.4-2.4 1.3-1 .2-1.6-1.2-1.1 1.4-2.4 1.5.7 1.5-.6z" />
          <circle cx="8" cy="8" r="2.2" />
        </svg>
        <span>设置</span>
        <small>SYSTEM</small>
      </button>
      <button class="style-toggle" id="styleToggle" type="button" aria-label="切换机柜视觉风格" aria-pressed="true">
        <span class="style-led" aria-hidden="true"></span>
        <span id="styleToggleLabel">HYBRID</span>
      </button>
    </footer>
  </aside>

  <script>
    const WORKSPACES = [
      {
        id: 'deepseek-zion',
        name: 'deepseek-zion',
        sessions: [
          { id: 'wsl-check', title: 'WSL环境检测确认', time: '21小时' },
          { id: 'read-project', title: '阅读项目说明文件', time: '21小时' },
          { id: 'new-session', title: '新会话', time: '' },
        ],
      },
      {
        id: 'claude-code-toolkit',
        name: 'claude-code-toolkit',
        sessions: [{ id: 'github-latest', title: '更新到GitHub最新提交', time: '3天' }],
      },
      {
        id: 'skills-guide',
        name: 'skills-guide',
        sessions: [
          { id: 'two', title: '2', time: '2天' },
          { id: 'single-number', title: 'Single number input', time: '2天' },
          { id: 'dsh-error', title: '安装dsh命令未找到报错', time: '1天' },
          { id: 'hello-skill', title: '你好', time: '3天' },
        ],
      },
      {
        id: 'ungrouped',
        name: '未分组',
        sessions: [
          { id: 'hello', title: '你好', time: '1天' },
          { id: 'autumn-1', title: '秋天的夜晚', time: '1天' },
          { id: 'autumn-2', title: '秋天的夜晚', time: '1天' },
        ],
      },
    ]

    const sidebar = document.querySelector('#sidebar')
    const scroll = document.querySelector('#workspaceScroll')
    const neoAvatar = document.querySelector('#neoAvatar')
    const cableLayer = document.querySelector('#cableLayer')
    const cablePaths = [...document.querySelectorAll('#cableBed, #cableSheath, #cableNerve, #cableStitch')]
    const styleToggle = document.querySelector('#styleToggle')
    const styleToggleLabel = document.querySelector('#styleToggleLabel')
    let activeSessionId = 'read-project'
    let rackStyle = 'hybrid'

    function escapeHtml(value) {
      return String(value).replace(/[&<>"]/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[character])
    }

    function applyRackStyle(nextStyle, persist = true) {
      rackStyle = nextStyle === 'legacy' ? 'legacy' : 'hybrid'
      const hybrid = rackStyle === 'hybrid'
      sidebar.dataset.style = rackStyle
      styleToggleLabel.textContent = hybrid ? 'HYBRID' : 'LEGACY'
      styleToggle.setAttribute('aria-pressed', String(hybrid))
      styleToggle.title = hybrid ? '当前：CSS + SVG + 生成纹理' : '当前：旧版完整 PNG 素材'
      if (persist) {
        try { localStorage.setItem('zion-sidebar-rack-style', rackStyle) } catch {}
      }
      requestAnimationFrame(routeCable)
    }

    function renderWorkspaces() {
      scroll.innerHTML = WORKSPACES.map((workspace) => `
        <section class="workspace-group" aria-label="${escapeHtml(workspace.name)}">
          <div class="workspace-cap" role="treeitem" aria-expanded="true">
            <span class="generated-texture texture-top" aria-hidden="true"></span>
            <svg class="hardware-svg cap-hardware" viewBox="0 0 303 34" preserveAspectRatio="none" aria-hidden="true">
              <path d="M2 6H32V3H271V6H301M5 29V11H9V26H294V11H298V29" fill="none" stroke="#6f3524" stroke-width="2" />
              <path d="M12 7H69M234 7H291M19 28H57M246 28H284" fill="none" stroke="#e97b4c" stroke-width="1" />
              <rect x="4" y="15" width="3" height="3" fill="#d28a63" /><rect x="296" y="15" width="3" height="3" fill="#d28a63" />
            </svg>
            <span class="folder-icon" aria-hidden="true"></span>
            <span class="workspace-name">${escapeHtml(workspace.name)}</span>
            <span class="workspace-count">${String(workspace.sessions.length).padStart(2, '0')}</span>
          </div>
          ${workspace.sessions.map((session) => `
            <div class="rack-bay">
              <span class="generated-texture texture-bay" aria-hidden="true"></span>
              <svg class="hardware-svg bay-hardware" viewBox="0 0 303 34" preserveAspectRatio="none" aria-hidden="true">
                <path d="M3 1H13V33H3M300 1H290V33H300" fill="none" stroke="#26564d" stroke-width="2" />
                <path d="M6 6H11M6 17H11M6 28H11M297 6H292M297 17H292M297 28H292" stroke="#67d7cf" stroke-width="1" />
                <path d="M15 2H288M15 32H288" stroke="#0d2922" stroke-width="2" />
              </svg>
              <button
                class="session-drive${session.id === activeSessionId ? ' active' : ''}"
                type="button"
                role="treeitem"
                data-session-id="${session.id}"
                aria-current="${session.id === activeSessionId ? 'true' : 'false'}"
              >
                <span class="generated-texture texture-drive" aria-hidden="true"></span>
                <svg class="hardware-svg drive-hardware" viewBox="0 0 289 28" preserveAspectRatio="none" aria-hidden="true">
                  <path d="M2 5L6 1H283L287 5V23L283 27H6L2 23Z" fill="none" stroke="#245c3b" stroke-width="1" />
                  <path d="M25 5H95M194 5H264M25 23H95M194 23H264" stroke="#2c8b56" stroke-width="1" />
                  <path d="M255 9H273M255 13H273M255 17H273" stroke="#163b28" stroke-width="2" />
                </svg>
                <span class="slot" aria-hidden="true"></span>
                <span class="session-title">${escapeHtml(session.title)}</span>
                <span class="session-time">${escapeHtml(session.time)}</span>
                <span class="receiver" aria-hidden="true"></span>
              </button>
            </div>
          `).join('')}
        </section>
      `).join('')

      scroll.querySelectorAll('.session-drive').forEach((button) => {
        button.addEventListener('click', () => {
          activeSessionId = button.dataset.sessionId
          scroll.querySelectorAll('.session-drive').forEach((item) => {
            const active = item.dataset.sessionId === activeSessionId
            item.classList.toggle('active', active)
            item.setAttribute('aria-current', String(active))
          })
          requestAnimationFrame(routeCable)
        })
      })
    }

    function routeCable() {
      const receiver = scroll.querySelector('.session-drive.active .receiver')
      if (!receiver || !neoAvatar.complete) return

      const rootRect = sidebar.getBoundingClientRect()
      const neoRect = neoAvatar.getBoundingClientRect()
      const targetRect = receiver.getBoundingClientRect()

      // 用户参考图蓝圈中的裸露线头，约位于 256px 原图的 (46, 144)。
      const sourceX = neoRect.left - rootRect.left + neoRect.width * (46 / 256)
      const sourceY = neoRect.top - rootRect.top + neoRect.height * (144 / 256)
      const targetX = targetRect.left - rootRect.left + targetRect.width / 2
      const targetY = targetRect.top - rootRect.top + targetRect.height / 2
      const busX = rootRect.width - 12
      const exitX = sourceX - 17
      const exitY = sourceY + 10
      const shoulderY = Math.max(sourceY + 34, 78)

      const d = [
        `M ${sourceX.toFixed(1)} ${sourceY.toFixed(1)}`,
        `L ${exitX.toFixed(1)} ${exitY.toFixed(1)}`,
        `C ${(exitX - 7).toFixed(1)} ${(exitY + 18).toFixed(1)}, ${(busX - 24).toFixed(1)} ${(shoulderY - 10).toFixed(1)}, ${busX.toFixed(1)} ${shoulderY.toFixed(1)}`,
        `L ${busX.toFixed(1)} ${(targetY - 13).toFixed(1)}`,
        `Q ${busX.toFixed(1)} ${targetY.toFixed(1)} ${(busX - 13).toFixed(1)} ${targetY.toFixed(1)}`,
        `L ${targetX.toFixed(1)} ${targetY.toFixed(1)}`,
      ].join(' ')

      cableLayer.setAttribute('viewBox', `0 0 ${rootRect.width} ${rootRect.height}`)
      cablePaths.forEach((path) => path.setAttribute('d', d))
    }

    function startMatrixRain() {
      const canvas = document.querySelector('#matrixRain')
      const context = canvas.getContext('2d')
      const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches
      const glyphs = 'ｱｲｳｴｵｶｷｸｹｺ012345789*+<>:|'
      let columns = []
      let frame = 0

      function resize() {
        const rect = sidebar.getBoundingClientRect()
        const dpr = Math.min(devicePixelRatio || 1, 2)
        canvas.width = Math.round(rect.width * dpr)
        canvas.height = Math.round(rect.height * dpr)
        canvas.style.width = `${rect.width}px`
        canvas.style.height = `${rect.height}px`
        context.setTransform(dpr, 0, 0, dpr, 0, 0)
        columns = Array.from({ length: Math.ceil(rect.width / 13) }, (_, index) => ({
          y: (index * 47) % Math.max(rect.height, 1),
          speed: 0.35 + (index % 4) * 0.18,
          phase: index * 11,
        }))
      }

      function draw() {
        const rect = sidebar.getBoundingClientRect()
        context.fillStyle = 'rgba(0, 6, 3, .1)'
        context.fillRect(0, 0, rect.width, rect.height)
        context.font = '11px "Lucida Console", monospace'
        columns.forEach((column, index) => {
          const x = index * 13
          for (let tail = 0; tail < 7; tail += 1) {
            const y = (column.y - tail * 13 + rect.height) % rect.height
            const glyph = glyphs[(index * 17 + tail * 7 + Math.floor(frame / 18)) % glyphs.length]
            context.fillStyle = tail === 0 ? 'rgba(200,255,212,.68)' : `rgba(35,196,104,${Math.max(.02, .22 - tail * .028)})`
            context.fillText(glyph, x, y)
          }
          if (!reduced) column.y = (column.y + column.speed) % rect.height
        })
        frame += 1
        if (!reduced) requestAnimationFrame(draw)
      }

      resize()
      draw()
      addEventListener('resize', resize)
    }

    renderWorkspaces()
    try { rackStyle = localStorage.getItem('zion-sidebar-rack-style') || 'hybrid' } catch {}
    applyRackStyle(rackStyle, false)
    styleToggle.addEventListener('click', () => applyRackStyle(rackStyle === 'hybrid' ? 'legacy' : 'hybrid'))
    startMatrixRain()
    neoAvatar.addEventListener('load', routeCable)
    scroll.addEventListener('scroll', routeCable, { passive: true })
    new ResizeObserver(routeCable).observe(sidebar)
    requestAnimationFrame(routeCable)
  </script>
</body>
</html>
