<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CITY INDEX — Matrix DVD Menu Variants</title>
  <!--
    PROTOTYPE / THROWAWAY UI
    Question: 以 Matrix DVD 菜单屏（114514.JPG）为原型，city-map 可以长成什么样？
    V0 = 1:1 复刻截图设计；V1-V3 = 变体。
    Run: npx vite ui-demo --host 127.0.0.1 --port 4178
    Open: http://127.0.0.1:4178/city-map-dvd-menu-proto.html  (?v=0..3)
  -->
  <style>
    @font-face {
      font-family: "Matrix Code";
      src: url("./font/Matrix-Code.ttf") format("truetype");
      font-display: block;
    }
    @font-face {
      font-family: "Sarasa Term SC";
      src: url("./assets/sidebar-spatial-layout/SarasaTermSC-Regular.subset.woff2") format("woff2");
      font-display: swap;
    }
    @font-face {
      font-family: "Share Tech Mono";
      src: url("./assets/sidebar-spatial-layout/ShareTechMono-Regular.woff2") format("woff2");
      font-display: swap;
    }

    :root {
      --w: 280px;
      --void: #010402;
      --dvd-green: #46e572;      /* 截图菜单文字绿（亮、微磷光） */
      --dvd-dim: #1d5c33;
      --rain-mid: #4e9e57;
      --body: "Sarasa Term SC", monospace;
      --display: "Share Tech Mono", "Sarasa Term SC", monospace;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #000; }
    body { display: flex; font-family: var(--body); }

    /* ── 共用面板骨架：280px 侧栏位 + 密雨背景 ── */
    .panel {
      position: relative;
      width: var(--w);
      height: 100vh;
      min-height: 560px;
      overflow: hidden;
      background: var(--void);
      border-right: 1px solid rgba(70, 229, 114, 0.3);
    }
    .rain {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .menu {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      scrollbar-width: none;
    }
    .menu::-webkit-scrollbar { display: none; }

    .item {
      display: block;
      width: 100%;
      border: 0;
      background: none;
      text-align: left;
      cursor: pointer;
      color: var(--dvd-green);
      font-family: var(--display);
      text-shadow: 0 0 7px rgba(70, 229, 114, 0.55), 0 0 22px rgba(70, 229, 114, 0.25);
    }

    /* ═══ V0 · 1:1 复刻 DVD 菜单屏 ═══ */
    .v0 .menu { padding: 26px 0 26px 34px; gap: 0; justify-content: flex-start; }
    .v0 .item {
      position: relative;
      padding: 9px 8px 9px 0;
      font-size: 15px;
      line-height: 1;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }
    .v0 .item .cur { display: none; }
    /* 截图选中态：> 前缀 + 文字后深色半透明盒 */
    .v0 .item.is-current {
      color: #c9ffd8;
      text-shadow: 0 0 9px rgba(140, 255, 170, 0.8), 0 0 26px rgba(70, 229, 114, 0.4);
    }
    .v0 .item.is-current .cur { display: inline; }
    .v0 .item.is-current::before {
      content: "";
      position: absolute;
      left: -10px;
      top: 5px;
      bottom: 5px;
      width: 88%;
      background: rgba(2, 20, 9, 0.72);
      z-index: -1;
    }
    .v0 .item .meta { display: none; }
    .v0 .gap { height: 18px; }

    /* ═══ V1 · 章节选单（DVD Scene Selections 两层结构） ═══ */
    .v1 .menu {
      padding: 22px 0 26px 0;
      /* 文字区暗色衬底：左强右弱，压雨保读，右侧雨幕仍透出 */
      background: linear-gradient(90deg, rgba(1, 6, 3, 0.82) 0%, rgba(1, 6, 3, 0.62) 68%, rgba(1, 6, 3, 0.3) 100%);
    }
    .v1 .chapter {
      padding: 14px 10px 6px 22px;
      color: #2f8a4d;
      font: 9px/1 var(--display);
      letter-spacing: 0.34em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .v1 .chapter::after {
      content: "";
      flex: 1;
      height: 1px;
      margin-right: 14px;
      background: linear-gradient(90deg, rgba(70, 229, 114, 0.45), transparent);
    }
    .v1 .item {
      padding: 8px 8px 8px 30px;
      font-size: 13px;
      line-height: 1.15;
      letter-spacing: 0.05em;
      text-shadow: 0 0 7px rgba(70, 229, 114, 0.6), 0 1px 3px rgba(0, 0, 0, 0.9);
    }
    .v1 .item .cur { color: #c9ffd8; margin-right: 6px; opacity: 0; }
    .v1 .item.is-current { color: #d8ffe2; }
    .v1 .item.is-current .cur { opacity: 1; }
    .v1 .item .meta {
      float: right;
      margin-right: 16px;
      color: rgba(70, 229, 114, 0.5);
      font-size: 10px;
      letter-spacing: 0.12em;
      text-shadow: none;
    }

    /* ═══ V2 · CRT 监控选单（扫描线 + 编号 + 括号选中框） ═══ */
    .v2 .panel::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background: repeating-linear-gradient(0deg, transparent 0 2px, rgba(0, 0, 0, 0.28) 2px 3px);
    }
    .v2 .menu {
      padding: 20px 0 24px;
      /* 文字区暗色衬底：左强右弱压雨保读，扫描线叠层不受影响 */
      background: linear-gradient(90deg, rgba(1, 6, 3, 0.82) 0%, rgba(1, 6, 3, 0.62) 68%, rgba(1, 6, 3, 0.3) 100%);
    }
    .v2 .crt-head {
      padding: 0 20px 12px;
      color: rgba(70, 229, 114, 0.75);
      font: 9px/1.7 var(--display);
      letter-spacing: 0.3em;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
    }
    .v2 .item {
      display: flex;
      align-items: baseline;
      padding: 7px 18px;
      font-size: 12.5px;
      letter-spacing: 0.04em;
      text-shadow: 0 0 6px rgba(70, 229, 114, 0.55), 0 1px 3px rgba(0, 0, 0, 0.9);
    }
    .v2 .item .idx {
      flex: 0 0 30px;
      color: rgba(70, 229, 114, 0.45);
      font-size: 10px;
      text-shadow: none;
    }
    .v2 .item .meta { margin-left: auto; color: rgba(70, 229, 114, 0.4); font-size: 9px; text-shadow: none; }
    .v2 .item.is-current {
      color: #eafff0;
      background: rgba(70, 229, 114, 0.08);
      box-shadow: inset 2px 0 var(--dvd-green), inset -2px 0 var(--dvd-green);
      animation: crt-flicker 3.2s steps(1) infinite;
    }
    .v2 .item.is-current .cur { color: #eafff0; margin-right: 4px; }
    .v2 .item:not(.is-current) .cur { display: none; }
    @keyframes crt-flicker {
      0%, 93% { opacity: 1; }
      94% { opacity: 0.72; }
      95%, 100% { opacity: 1; }
    }

    /* ═══ V3 · 信号清单（DVD 字体 + 状态数据列 + 反白选中条） ═══ */
    .v3 .menu { padding: 24px 0 26px; }
    .v3 .sig-head {
      padding: 0 22px 10px;
      color: var(--dvd-dim);
      font: 9px/1 var(--display);
      letter-spacing: 0.4em;
    }
    .v3 .item {
      display: grid;
      grid-template-columns: 14px 1fr auto;
      align-items: center;
      gap: 6px;
      padding: 8px 16px 8px 20px;
      font-size: 12.5px;
      letter-spacing: 0.04em;
    }
    .v3 .item .meta {
      color: var(--status-color, var(--dvd-dim));
      font-size: 9px;
      letter-spacing: 0.14em;
      text-shadow: none;
    }
    .v3 .item.is-current {
      background: var(--dvd-green);
      color: #021007;
      text-shadow: none;
    }
    .v3 .item.is-current .meta { color: rgba(2, 16, 7, 0.72); }
    .v3 .item:not(.is-current) .cur { visibility: hidden; }

    /* ── 变体切换条 ── */
    .switcher {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      z-index: 50;
      display: flex;
      gap: 6px;
      font: 10px/1 var(--display);
      letter-spacing: 0.1em;
    }
    .switcher button {
      padding: 7px 12px;
      border: 1px solid rgba(70, 229, 114, 0.35);
      background: rgba(1, 8, 4, 0.9);
      color: rgba(70, 229, 114, 0.65);
      cursor: pointer;
    }
    .switcher button.on {
      background: var(--dvd-green);
      color: #021007;
      border-color: var(--dvd-green);
    }
    .host-note {
      flex: 1;
      display: grid;
      place-items: center;
      color: rgba(70, 229, 114, 0.25);
      font: 11px/1.8 var(--display);
      letter-spacing: 0.3em;
      text-align: center;
      user-select: none;
    }
  </style>
</head>
<body>
  <aside class="panel v0" id="panel">
    <canvas class="rain" id="rain"></canvas>
    <nav class="menu" id="menu" aria-label="会话索引"></nav>
  </aside>

  <main class="host-note">CITY INDEX VARIANTS<br />V0 REPLICA · V1 CHAPTERS · V2 CRT · V3 SIGNAL</main>

  <div class="switcher" id="switcher">
    <button data-v="0">V0 复刻</button>
    <button data-v="1">V1 章节</button>
    <button data-v="2">V2 CRT</button>
    <button data-v="3">V3 信号</button>
  </div>

  <script>
    // 与 ascii-cyberpunk-sidebar-prototype 相同的 mock 结构
    const WORKSPACES = [
      { code: "Z-01", name: "deepseek-zion", sessions: [
        { id: "s1", title: "重新设计多工作区会话栏", time: "现在", status: "streaming" },
        { id: "s2", title: "阅读项目说明文件", time: "21小时", status: "ready" },
        { id: "s3", title: "接入会话脑机链路与动态锚点", time: "1天", status: "tool" },
        { id: "s4", title: "修复侧栏滚动定位漂移", time: "2天", status: "error" }
      ]},
      { code: "C-07", name: "claude-code-toolkit", sessions: [
        { id: "s5", title: "更新到 GitHub 最新提交", time: "3天", status: "ready" },
        { id: "s6", title: "Hook 启动配置与官方文档核验", time: "5天", status: "thinking" },
        { id: "s7", title: "重构 Claude Launcher 启动协议", time: "6天", status: "ready" }
      ]},
      { code: "S-12", name: "skills-guide", sessions: [
        { id: "s8", title: "安装 dsh 命令未找到报错", time: "2小时", status: "error" },
        { id: "s9", title: "Single number input", time: "1天", status: "ready" },
        { id: "s10", title: "重写 Agent Skills 中文索引", time: "1天", status: "tool" }
      ]},
      { code: "M-23", name: "matrix-lab", sessions: [
        { id: "s11", title: "协议透视墙中文可读性压力测试", time: "12分", status: "thinking" },
        { id: "s12", title: "神经轨道二十三节点碰撞实验", time: "37分", status: "tool" },
        { id: "s13", title: "记忆总线横向滚动与键盘路径", time: "1小时", status: "streaming" }
      ]}
    ];
    const STATUS = {
      ready: { label: "READY", color: "#42ff85" },
      thinking: { label: "THINKING", color: "#ffcf4a" },
      streaming: { label: "STREAMING", color: "#68e9dd" },
      tool: { label: "TOOL", color: "#a7ff4a" },
      error: { label: "ERROR", color: "#ff5364" }
    };
    const CURRENT = "s1"; // 当前会话（选中态演示）

    const panel = document.getElementById("panel");
    const menu = document.getElementById("menu");

    // ── 密集代码雨背景（DVD 菜单屏氛围：中密、中速、暗绿主体）──
    const GLYPHS = "アウエオカキケコサシスセソタツテナニヌネハヒホマミムメモヤヨラリワー012345789*+<>:|";
    const cv = document.getElementById("rain"), cx = cv.getContext("2d");
    const FS = 14;
    let cols = [];
    function rs() {
      cv.width = cv.clientWidth; cv.height = cv.clientHeight;
      cols = Array.from({ length: Math.ceil(cv.width / (FS * 0.62)) }, (_, i) => ({
        x: i * FS * 0.62,
        y: Math.random() * -80 * FS,
        spd: 0.55 + Math.random() * 0.5
      }));
      cx.font = `${FS}px "Matrix Code"`;
      cx.textAlign = "center";
    }
    new ResizeObserver(rs).observe(cv);
    let last = 0;
    function tick(ts) {
      requestAnimationFrame(tick);
      if (ts - last < 95) return;
      last = ts;
      cx.fillStyle = "rgba(1,4,2,0.09)";
      cx.fillRect(0, 0, cv.width, cv.height);
      for (const c of cols) {
        const ch = GLYPHS[(Math.random() * GLYPHS.length) | 0];
        if (Math.random() < 0.1) {
          cx.shadowColor = "rgba(120,220,150,0.8)"; cx.shadowBlur = 6;
          cx.fillStyle = "#bfeed0";
        } else {
          cx.shadowBlur = 0;
          cx.fillStyle = "#4e9e57";
        }
        cx.save();
        cx.translate(c.x + FS / 2, c.y);
        cx.scale(0.55, 1);
        cx.fillText(ch, 0, 0);
        cx.restore();
        cx.shadowBlur = 0;
        c.y += FS * c.spd;
        if (c.y > cv.height && Math.random() > 0.955) c.y = Math.random() * -30 * FS;
      }
    }
    document.fonts.load('14px "Matrix Code"').finally(() => requestAnimationFrame(tick));

    // ── 四个变体的菜单渲染 ──
    let itemNo = 0;
    function makeItem(session, variant) {
      itemNo += 1;
      const b = document.createElement("button");
      b.type = "button";
      b.className = "item" + (session.id === CURRENT ? " is-current" : "");
      b.style.setProperty("--status-color", STATUS[session.status].color);
      const cur = '<span class="cur">&gt;</span>';
      const meta = `<span class="meta">${variant === 3 ? STATUS[session.status].label : session.time}</span>`;
      const idx = `<span class="idx">${String(itemNo).padStart(2, "0")}</span>`;
      if (variant === 2) b.innerHTML = `${idx}${cur}<span class="title">${session.title}</span>${meta}`;
      else if (variant === 3) b.innerHTML = `${cur}<span class="title">${session.title}</span>${meta}`;
      else b.innerHTML = `${cur}<span class="title">${session.title}</span>${variant === 1 ? meta : ""}`;
      return b;
    }

    function render(variant) {
      itemNo = 0;
      menu.replaceChildren();
      if (variant === 2) {
        const h = document.createElement("div");
        h.className = "crt-head";
        h.textContent = "SESSION PORTALS // ALL DISTRICTS";
        menu.append(h);
      }
      if (variant === 3) {
        const h = document.createElement("div");
        h.className = "sig-head";
        h.textContent = "SIGNAL MANIFEST";
        menu.append(h);
      }
      WORKSPACES.forEach((ws, wi) => {
        if (variant === 0) {
          // 1:1 复刻：工作区头也是一条大写菜单项，会话项紧跟，组间空隙
          const head = document.createElement("button");
          head.type = "button";
          head.className = "item";
          head.innerHTML = `<span class="cur">&gt;</span><span class="title">${ws.name.replace(/-/g, " ")}</span>`;
          menu.append(head);
          ws.sessions.forEach((s) => menu.append(makeItem(s, 0)));
          const gap = document.createElement("div");
          gap.className = "gap";
          menu.append(gap);
        } else {
          const ch = document.createElement("div");
          ch.className = "chapter";
          ch.textContent = `BAY ${String(wi + 1).padStart(2, "0")} · ${ws.name}`;
          if (variant === 1) menu.append(ch);
          ws.sessions.forEach((s) => menu.append(makeItem(s, variant)));
        }
      });
    }

    // ── 变体切换 ──
    const params = new URLSearchParams(location.search);
    let v = Math.min(3, Math.max(0, parseInt(params.get("v") || "0", 10) || 0));
    const switcher = document.getElementById("switcher");
    function apply() {
      panel.className = `panel v${v}`;
      switcher.querySelectorAll("button").forEach((b) => b.classList.toggle("on", Number(b.dataset.v) === v));
      render(v);
    }
    switcher.addEventListener("click", (e) => {
      const b = e.target.closest("button");
      if (!b) return;
      v = Number(b.dataset.v);
      apply();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key >= "0" && e.key <= "3") { v = Number(e.key); apply(); }
    });
    apply();
  </script>
</body>
</html>
