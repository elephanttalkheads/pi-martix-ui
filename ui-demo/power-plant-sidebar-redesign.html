<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=280, initial-scale=1, maximum-scale=1">
  <link rel="icon" href="data:,">
  <title>ZION · Power Plant 会话侧边栏重设计</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: oklch(0.105 0.018 150);
      --surface: oklch(0.165 0.026 153);
      --fg: oklch(0.9 0.055 145);
      --muted: oklch(0.64 0.035 151);
      --border: oklch(0.34 0.048 151);
      --accent: oklch(0.78 0.19 145);
      --warn: oklch(0.78 0.16 76);
      --danger: oklch(0.67 0.21 26);
      --fluid: oklch(0.51 0.18 26);
      --font-display: "Bahnschrift SemiCondensed", "DIN Condensed", sans-serif;
      --font-body: "Microsoft YaHei UI", "Noto Sans CJK SC", sans-serif;
      --font-mono: "Cascadia Mono", "IBM Plex Mono", Consolas, monospace;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 280px;
      min-width: 280px;
      max-width: 280px;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
    }

    body {
      position: relative;
      isolation: isolate;
    }

    button { font: inherit; }

    .power-sidebar {
      position: relative;
      width: 280px;
      height: 100dvh;
      min-height: 560px;
      overflow: hidden;
      background: var(--bg);
      outline: none;
    }

    .power-sidebar::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 8;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 3px,
        oklch(0.05 0.01 150 / 0.24) 4px
      );
      mix-blend-mode: multiply;
    }

    .power-sidebar::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 9;
      pointer-events: none;
      box-shadow: inset 0 0 58px oklch(0.01 0.01 150 / 0.92), inset -1px 0 var(--border);
    }

    .topbar {
      position: absolute;
      inset: 0 0 auto 0;
      z-index: 12;
      height: 48px;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 8px;
      padding: 7px 9px 6px 11px;
      border-bottom: 1px solid var(--border);
      background: oklch(0.11 0.019 151 / 0.9);
      backdrop-filter: blur(9px);
    }

    .brand {
      min-width: 0;
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .brand small {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.08em;
    }

    .depth-readout {
      display: grid;
      justify-items: end;
      gap: 2px;
      color: var(--accent);
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.08em;
    }

    .depth-readout span:last-child {
      color: var(--muted);
      font-size: 8px;
    }

    #plantCanvas {
      position: absolute;
      inset: 0;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    .edge-scale {
      position: absolute;
      top: 56px;
      right: 5px;
      bottom: 116px;
      z-index: 11;
      width: 8px;
      pointer-events: none;
      opacity: 0.54;
      background:
        linear-gradient(to left, var(--border), transparent 1px) right / 1px 100% no-repeat,
        repeating-linear-gradient(to bottom, var(--muted) 0 1px, transparent 1px 22px) right / 5px 100% no-repeat;
    }

    .observation-brackets {
      position: absolute;
      inset: 58px 8px 120px 40px;
      z-index: 11;
      pointer-events: none;
      border-top: 1px solid oklch(0.63 0.06 148 / 0.22);
      border-bottom: 1px solid oklch(0.63 0.06 148 / 0.14);
      clip-path: polygon(0 0, 22px 0, 22px 1px, 1px 1px, 1px 24px, 0 24px, 0 0,
        100% 0, calc(100% - 22px) 0, calc(100% - 22px) 1px, calc(100% - 1px) 1px,
        calc(100% - 1px) 24px, 100% 24px, 100% 0,
        0 100%, 22px 100%, 22px calc(100% - 1px), 1px calc(100% - 1px),
        1px calc(100% - 24px), 0 calc(100% - 24px),
        100% 100%, calc(100% - 22px) 100%, calc(100% - 22px) calc(100% - 1px),
        calc(100% - 1px) calc(100% - 1px), calc(100% - 1px) calc(100% - 24px),
        100% calc(100% - 24px));
    }

    .readout {
      position: absolute;
      right: 8px;
      bottom: 54px;
      left: 8px;
      z-index: 12;
      min-height: 58px;
      padding: 7px 9px 6px 10px;
      border: 1px solid var(--border);
      border-radius: 2px;
      background: oklch(0.105 0.018 150 / 0.91);
      box-shadow: 0 -8px 24px oklch(0.02 0.01 150 / 0.54);
      backdrop-filter: blur(8px);
    }

    .readout::before {
      content: "";
      position: absolute;
      top: -1px;
      left: 0;
      width: 34%;
      height: 1px;
      background: var(--accent);
    }

    .readout-head,
    .readout-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
      font-family: var(--font-mono);
    }

    .workspace-name {
      overflow: hidden;
      color: var(--muted);
      font-size: 9px;
      letter-spacing: 0.04em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .session-count {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 9px;
    }

    .session-name {
      margin: 3px 0 4px;
      overflow: hidden;
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 590;
      line-height: 1.2;
      letter-spacing: 0;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .state {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 9px;
      letter-spacing: 0.05em;
    }

    .state::before {
      content: "";
      width: 6px;
      height: 6px;
      border: 1px solid currentColor;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 8px currentColor;
    }

    .state[data-state="busy"] { color: var(--warn); }
    .state[data-state="error"] { color: var(--danger); }
    .state[data-state="done"],
    .state[data-state="ready"] { color: var(--accent); }

    .motion-state {
      color: var(--muted);
      font-size: 9px;
    }

    .controls {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 12;
      height: 46px;
      display: grid;
      grid-template-columns: 44px 44px 1fr 44px 44px;
      align-items: stretch;
      border-top: 1px solid var(--border);
      background: oklch(0.095 0.016 150 / 0.96);
    }

    .control-button,
    .motion-toggle {
      min-width: 44px;
      min-height: 44px;
      border: 0;
      border-right: 1px solid var(--border);
      border-radius: 0;
      background: transparent;
      color: var(--fg);
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: 16px;
      letter-spacing: 0.02em;
    }

    .control-button:last-child { border-right: 0; }

    .control-button:hover,
    .motion-toggle:hover {
      background: oklch(0.21 0.04 151);
      color: var(--fg);
    }

    .control-button:active,
    .motion-toggle:active {
      transform: translateY(1px);
      background: oklch(0.16 0.035 151);
      color: var(--fg);
    }

    .control-button:focus-visible,
    .motion-toggle:focus-visible,
    .power-sidebar:focus-visible {
      position: relative;
      outline: 2px solid var(--accent);
      outline-offset: -3px;
      z-index: 2;
    }

    .motion-toggle {
      display: grid;
      place-items: center;
      border-right: 1px solid var(--border);
      color: var(--muted);
      font-size: 9px;
      line-height: 1.25;
      text-align: center;
    }

    .motion-toggle b {
      display: block;
      color: var(--fg);
      font-size: 8px;
      font-weight: 550;
      letter-spacing: 0.08em;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>
<body>
  <aside class="power-sidebar" id="powerSidebar" tabindex="0" data-od-id="power-plant-sidebar" aria-label="Power Plant 工作区会话侧边栏">
    <header class="topbar" data-od-id="power-plant-header">
      <div class="brand">POWER PLANT<small>会话层观察窗</small></div>
      <div class="depth-readout" aria-hidden="true"><span id="depthCode">L-01</span><span id="depthText">下潜 000m</span></div>
    </header>

    <canvas id="plantCanvas" data-od-id="power-plant-canvas" aria-hidden="true"></canvas>
    <div class="edge-scale" aria-hidden="true"></div>
    <div class="observation-brackets" aria-hidden="true"></div>

    <section class="readout" data-od-id="session-observation-readout" aria-live="polite">
      <div class="readout-head">
        <span class="workspace-name" id="workspaceName">工作区</span>
        <span class="session-count" id="sessionCount">01 / 01</span>
      </div>
      <h1 class="session-name" id="sessionName" data-od-id="current-session-heading">会话</h1>
      <div class="readout-foot">
        <span class="state" id="sessionState" data-state="ready">待命</span>
        <span class="motion-state" id="motionState">机械锁止</span>
      </div>
    </section>

    <nav class="controls" data-od-id="power-plant-controls" aria-label="Power Plant 导航控制">
      <button class="control-button" id="previousWorkspace" data-od-id="previous-workspace" type="button" aria-label="上一个工作区" title="上一个工作区（W / ↑）">↑</button>
      <button class="control-button" id="nextWorkspace" data-od-id="next-workspace" type="button" aria-label="下一个工作区" title="下一个工作区（S / ↓）">↓</button>
      <button class="motion-toggle" id="motionToggle" data-od-id="motion-toggle" type="button" aria-pressed="false" title="切换完整或精简动效"><span><b>动效</b><span id="motionModeLabel">完整</span></span></button>
      <button class="control-button" id="previousSession" data-od-id="previous-session" type="button" aria-label="上一个会话" title="上一个会话（A / ←）">←</button>
      <button class="control-button" id="nextSession" data-od-id="next-session" type="button" aria-label="下一个会话" title="下一个会话（D / →）">→</button>
    </nav>

    <p class="sr-only" id="keyboardHelp">W、S、上下方向键或滚轮浏览工作区；A、D 或左右方向键切换当前层会话；可点击前后仓体。</p>
    <div class="sr-only" id="liveStatus" aria-live="assertive"></div>
  </aside>

  <script src="./assets/power-plant-sidebar-redesign/power-plant-renderer.js?v=20260827d" defer></script>
</body>
</html>
