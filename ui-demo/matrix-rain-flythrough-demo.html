<!doctype html>
<meta charset="utf-8">
<title>matrix rain flythrough — code canyon</title>
<!--
  PROTOTYPE / THROWAWAY
  滚动 = 镜头前飞穿越代码峡谷；每注雨持续下落循环。
  依据 research/matrix-inspiration-digest.md §1（Rezmason 结论）：
  字形固定光波移动 / 先发光后上色 / 高亮处字形轮转更快 / volumetric + forwardSpeed。
  Run: npx vite ui-demo --host 127.0.0.1 --port 4178
  Open: http://127.0.0.1:4178/matrix-rain-flythrough-demo.html  (?p=0..1 定格调试)
-->
<style>
  @font-face {
    font-family: "Matrix Code";
    src: url("./font/Matrix-Code.ttf") format("truetype");
    font-display: block;
  }
  html, body { margin: 0; background: #010402; }
  body { height: 500vh; }
  canvas { position: fixed; inset: 0; display: block; }
  .hud {
    position: fixed; left: 4vw; bottom: 6vh; pointer-events: none; user-select: none;
    font: 600 10px/1.8 "Matrix Code", monospace; letter-spacing: .4em; color: #4e9e57;
    text-shadow: 0 0 12px rgba(78, 158, 87, .6);
  }
  .hud .dim { color: #1d4a2a; letter-spacing: .2em; }
</style>
<canvas id="c"></canvas>
<div class="hud">
  CODE CANYON // FLYTHROUGH<br>
  <span class="dim">SCROLL — 前飞穿越 · 滚快则冲刺 · 雨随势急</span>
</div>
<script>
const cv = document.getElementById('c'), cx = cv.getContext('2d');
let W, H;
function rs() {
  const d = Math.min(devicePixelRatio || 1, 1.6);
  W = innerWidth; H = innerHeight;
  cv.width = W * d; cv.height = H * d;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  cx.setTransform(d, 0, 0, d, 0, 0);
}
addEventListener('resize', rs); rs();

const GLYPHS = "アウエオカキケコサシスセソタツテナニヌネハヒホマミムメモヤヨラリワー012345789*+<>:|";
function hash(n) { const v = Math.abs(Math.sin(n * 12.9898 + 78.233) * 43758.5453); return v % 1; }
function glyphAt(seed) { return GLYPHS[Math.floor(hash(seed) * GLYPHS.length)]; }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ── 亮度 → 绿色调色板 LUT（先发光后上色；拖尾主体 #4e9e57，亮头保持亮绿）──
const LUT = [];
for (let i = 0; i < 24; i++) {
  const b = i / 23;
  let r, g, bl;
  if (b < 0.85) {      // 暗部 #0e2f1a → 拖尾主体 #4e9e57（截图亮串绿）
    const k = b / 0.85;
    r = 14 + (78 - 14) * k; g = 47 + (158 - 47) * k; bl = 26 + (87 - 26) * k;
  } else {              // 顶端 15% → 亮头 #a7e6b0（保持亮绿）
    const k = (b - 0.85) / 0.15;
    r = 78 + (167 - 78) * k; g = 158 + (230 - 158) * k; bl = 87 + (176 - 87) * k;
  }
  LUT.push(`rgb(${r | 0},${g | 0},${bl | 0})`);
}
const colorAt = b => LUT[Math.min(23, Math.max(0, Math.round(b * 23)))];

// ── 峡谷布局：走廊 |x|<70 留空，两侧墙近密远疏 ──
const ZRANGE = 460, CELL_H = 9, GLYPH_SX = 0.55; // GLYPH_SX 对齐生产：横向压缩恢复雨丝纤细感
const cols = [];
(function build() {
  const rand = mulberry32(20260828);
  [-1, 1].forEach(side => {
    for (let i = 0; i < 90; i++) {
      const ax = 75 + rand() * 215;
      const zone = ax < 130 ? 0 : ax < 200 ? 1 : 2;
      const cells = zone === 0 ? 36 : zone === 1 ? 28 : 20;
      const height = cells * CELL_H;
      const drops = [];
      const dropCount = 2 + Math.floor(rand() * 3);
      for (let d = 0; d < dropCount; d++) {
        // 基准落速再降 50%：5 格/秒（生产 10 格/秒的一半）
        drops.push({ y: rand() * height, speed: CELL_H * 5, trail: 70 + rand() * 70 });
      }
      cols.push({
        x: side * ax,
        z: rand() * ZRANGE,
        cells, height, drops,
        speedK: 0.85 + rand() * 0.3, // 柱间微差，主体保持生产的均匀下坠感
        seed: rand() * 1000
      });
    }
  });
})();

const qp = new URLSearchParams(location.search).get('p');
let p = qp !== null ? parseFloat(qp) || 0 : 0, pT = p;
let boost = 0, lastPT = pT, t = 0, prevT = performance.now();

function frame(now) {
  const dt = Math.min(0.05, (now - prevT) / 1000); prevT = now;
  if (qp === null) {
    const max = document.body.scrollHeight - innerHeight;
    pT = Math.min(1, Math.max(0, scrollY / max));
    p += (pT - p) * 0.07;
  }
  // 滚动动量：滚快 → 冲刺 + 雨急 + FOV 微推；停则缓行
  const dpt = pT - lastPT; lastPT = pT;
  boost = Math.min(1.6, boost + Math.abs(dpt) * 26);
  boost *= Math.pow(0.94, dt * 60);
  t += dt;

  const camZ = p * ZRANGE * 3;
  const camX = Math.sin(t * 0.25) * 10;
  const camY = 100;
  const focal = H * (0.9 + boost * 0.15);
  const rainK = 1 + boost * 0.8;

  cx.fillStyle = '#010402'; cx.fillRect(0, 0, W, H);
  cx.textAlign = 'center'; cx.textBaseline = 'middle';

  // 远→近 painter 排序
  const visible = [];
  for (const col of cols) {
    const depth = ((col.z - camZ) % ZRANGE + ZRANGE) % ZRANGE + 12;
    const s = focal / depth;
    const sx = W / 2 + (col.x - camX) * s;
    if (sx < -30 || sx > W + 30) continue;
    visible.push({ col, depth, s, sx });
  }
  visible.sort((a, b) => b.depth - a.depth);

  let lastSize = 0;
  for (const { col, depth, s, sx } of visible) {
    // 雨点下落（每帧推进，坠底回顶重生）
    for (const d of col.drops) {
      d.y -= d.speed * col.speedK * rainK * dt;
      if (d.y < 0) { d.y = col.height + Math.random() * 30; d.speed = CELL_H * 5; }
    }
    const size = Math.max(3, Math.min(24, Math.round(s * CELL_H)));
    if (size !== lastSize) { cx.font = `${size}px "Matrix Code"`; lastSize = size; }
    const fade = Math.min(1, Math.max(0.08, 1 - depth / 470));
    const skipOdd = depth > 380;

    // 整柱一次变换：横向 ×0.55 压缩（对齐生产 GLYPH_SX），fillText 的 x 恒为 0
    cx.save();
    cx.translate(sx, 0);
    cx.scale(GLYPH_SX, 1);
    for (let ci = 0; ci < col.cells; ci++) {
      if (skipOdd && (ci & 1)) continue;
      const y = ci * CELL_H;
      // 亮度场 = 环境底光 + 各雨点拖尾包络叠加（拖尾在落点上方）
      let b = 0.08;
      for (const d of col.drops) {
        const dy = y - d.y;
        if (dy >= 0 && dy < d.trail) b = Math.max(b, 1 - dy / d.trail);
      }
      const sy = H / 2 - (y - camY) * s;
      if (sy < -20 || sy > H + 20) continue;
      const bright = b * fade;
      // 高亮格子轮转稍快（整体节奏大幅放缓：0.5~2 次/秒）
      const glyph = glyphAt(col.seed + ci * 7 + Math.floor(t * (0.5 + bright * 1.5)));
      if (b > 0.8) {
        cx.shadowColor = 'rgba(140,230,160,0.8)'; cx.shadowBlur = 8;
        cx.fillStyle = colorAt(Math.max(0.85, bright));
        cx.fillText(glyph, 0, sy);
        cx.shadowBlur = 0;
      } else {
        cx.globalAlpha = Math.min(1, bright * 1.15);
        cx.fillStyle = colorAt(bright);
        cx.fillText(glyph, 0, sy);
        cx.globalAlpha = 1;
      }
    }
    cx.restore();
  }
  requestAnimationFrame(frame);
}
document.fonts.load('12px "Matrix Code"').finally(() => requestAnimationFrame(frame));
</script>
