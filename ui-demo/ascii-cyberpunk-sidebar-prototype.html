<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZION ASCII DISTRICT — 280px Sidebar Prototype</title>
  <!--
    PROTOTYPE / THROWAWAY UI
    Question: Can a 280px sidebar become a walkable ASCII city while preserving
    multiple workspace identities, every session, real DOM controls and readable Chinese?

    Design: ../docs/ascii-cyberpunk-sidebar-design.md
    Run: npx vite ui-demo --host 127.0.0.1 --port 4178
    Open: http://127.0.0.1:4178/ascii-cyberpunk-sidebar-prototype.html
  -->
  <style>
    @font-face {
      font-family: "Matrix Code";
      src: url("./font/Matrix-Code.ttf") format("truetype");
      font-display: block;
    }

    @font-face {
      font-family: "Sarasa Term SC";
      src: url("./assets/sidebar-spatial-layout/SarasaTermSC-Regular.subset.woff2") format("woff2");
      font-display: swap;
    }

    @font-face {
      font-family: "Share Tech Mono";
      src: url("./assets/sidebar-spatial-layout/ShareTechMono-Regular.woff2") format("woff2");
      font-display: swap;
    }

    :root {
      color-scheme: dark;
      --sidebar-width: 280px;
      --void: #010403;
      --surface: #05100b;
      --surface-raised: rgba(7, 20, 14, 0.94);
      --matrix: #37ff79;
      --matrix-hot: #d9ffe4;
      --matrix-dim: #0a7f3d;
      --cyan: #68e9dd;
      --amber: #ffb45e;
      --error: #ff5364;
      --ink: #d7ffe0;
      --muted: #71977c;
      --line: rgba(77, 255, 131, 0.22);
      --display: "Share Tech Mono", "Sarasa Term SC", monospace;
      --body: "Sarasa Term SC", monospace;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #020504;
      color: var(--ink);
      font-family: var(--body);
    }

    button {
      font: inherit;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      background:
        radial-gradient(circle at 18% 44%, rgba(27, 149, 68, 0.08), transparent 36%),
        linear-gradient(90deg, #010403 0 var(--sidebar-width), #050907 var(--sidebar-width));
    }

    .zion-sidebar {
      position: relative;
      isolation: isolate;
      width: min(var(--sidebar-width), 100vw);
      min-width: min(var(--sidebar-width), 100vw);
      height: 100vh;
      min-height: 560px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--void);
      border-right: 1px solid rgba(103, 255, 148, 0.32);
      box-shadow: 16px 0 60px rgba(0, 0, 0, 0.52), inset -1px 0 rgba(196, 255, 215, 0.06);
    }

    .zion-sidebar::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      background:
        repeating-linear-gradient(0deg, transparent 0 2px, rgba(122, 255, 163, 0.028) 2px 3px),
        linear-gradient(90deg, rgba(70, 255, 125, 0.03), transparent 18%, transparent 82%, rgba(70, 255, 125, 0.04));
      mix-blend-mode: screen;
    }

    .zion-sidebar::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 21;
      pointer-events: none;
      box-shadow:
        inset 0 0 36px rgba(0, 0, 0, 0.88),
        inset 0 0 3px rgba(121, 255, 160, 0.28);
    }

    .sidebar-head {
      position: relative;
      z-index: 8;
      height: 58px;
      flex: 0 0 58px;
      padding: 9px 11px 7px 13px;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: start;
      background:
        linear-gradient(180deg, rgba(15, 39, 25, 0.98), rgba(3, 11, 7, 0.94)),
        var(--void);
      border-bottom: 1px solid var(--line);
    }

    .sidebar-head::after {
      content: "";
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: -1px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--matrix), transparent);
      box-shadow: 0 0 12px var(--matrix);
      opacity: 0.6;
    }

    .brand-kicker,
    .brand-name,
    .head-status,
    .frame-label,
    .frame-coordinate,
    .key,
    .map-stylebar-kicker,
    .host-field,
    .map-toggle {
      font-family: var(--display);
      letter-spacing: 0.08em;
    }

    .brand-kicker {
      display: block;
      margin-bottom: 2px;
      color: var(--matrix);
      font-size: 8px;
      line-height: 1;
    }

    .brand-name {
      margin: 0;
      font-size: 17px;
      line-height: 1;
      letter-spacing: 0.045em;
      font-weight: 400;
      color: #ebfff1;
      text-shadow: 0 0 13px rgba(80, 255, 135, 0.42);
    }

    .brand-name em {
      color: var(--matrix);
      font-style: normal;
    }

    .head-status {
      margin-top: 3px;
      padding: 4px 5px 3px;
      border: 1px solid rgba(73, 255, 130, 0.28);
      color: var(--matrix);
      background: rgba(38, 255, 99, 0.055);
      font-size: 7px;
      line-height: 1;
      white-space: nowrap;
    }

    .head-status::before {
      content: "";
      display: inline-block;
      width: 4px;
      height: 4px;
      margin-right: 5px;
      border-radius: 50%;
      background: var(--matrix);
      box-shadow: 0 0 7px var(--matrix);
      vertical-align: 1px;
      animation: breathe 2.4s ease-in-out infinite;
    }

    .city-frame {
      position: relative;
      min-height: 335px;
      flex: 1 1 auto;
      overflow: hidden;
      background: #010403;
      border-bottom: 1px solid rgba(77, 255, 131, 0.2);
      touch-action: none;
    }

    #city-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: ns-resize;
    }

    .frame-chrome,
    .projection-layer,
    .session-layer {
      position: absolute;
      inset: 0;
    }

    .frame-chrome,
    .projection-layer,
    .session-layer {
      pointer-events: none;
    }

    .frame-topline {
      position: absolute;
      top: 8px;
      left: 9px;
      right: 9px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: rgba(190, 255, 207, 0.72);
      text-shadow: 0 0 8px rgba(56, 255, 112, 0.5);
    }

    .frame-label,
    .frame-coordinate {
      font-size: 7px;
      line-height: 1;
    }

    .frame-coordinate {
      color: var(--matrix);
    }

    .crosshair {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 17px;
      height: 17px;
      transform: translate(-50%, -50%);
      opacity: 0.62;
      transition: opacity 160ms ease;
    }

    .crosshair::before,
    .crosshair::after {
      content: "";
      position: absolute;
      background: var(--matrix-hot);
      box-shadow: 0 0 8px var(--matrix);
    }

    .crosshair::before {
      width: 1px;
      height: 17px;
      left: 8px;
      top: 0;
    }

    .crosshair::after {
      width: 17px;
      height: 1px;
      left: 0;
      top: 8px;
    }

    .horizon-tag {
      position: absolute;
      right: 8px;
      top: 50%;
      writing-mode: vertical-rl;
      color: rgba(91, 255, 140, 0.42);
      font: 7px/1 var(--display);
      letter-spacing: 0.14em;
    }

    .district-marker,
    .session-portal {
      position: absolute;
      pointer-events: auto;
      opacity: 0;
      transform-origin: center center;
      will-change: transform, left, top, opacity;
    }

    .district-marker {
      min-width: 86px;
      max-width: 148px;
      padding: 4px 6px 4px 7px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 5px;
      align-items: center;
      color: #a9cdb2;
      background: linear-gradient(90deg, rgba(2, 8, 5, 0.94), rgba(4, 18, 10, 0.78));
      border: 1px solid rgba(77, 255, 131, 0.22);
      border-left-color: var(--workspace-color, var(--matrix));
      clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 5px 100%, 0 calc(100% - 5px));
      text-align: left;
      cursor: pointer;
      font: 8px/1.05 var(--display);
      letter-spacing: 0.035em;
      white-space: nowrap;
      overflow: hidden;
      transition: color 140ms ease, border-color 140ms ease, background 140ms ease;
    }

    .district-marker:hover,
    .district-marker:focus-visible,
    .district-marker.is-active {
      color: #edfff1;
      border-color: color-mix(in srgb, var(--workspace-color) 68%, transparent);
      background: linear-gradient(90deg, rgba(3, 10, 7, 0.98), color-mix(in srgb, var(--workspace-color) 14%, rgba(3, 12, 7, 0.9)));
      outline: none;
      box-shadow: 0 0 14px color-mix(in srgb, var(--workspace-color) 25%, transparent);
    }

    .district-marker .code {
      color: var(--workspace-color);
    }

    .district-marker .name {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .district-marker .count {
      color: rgba(213, 255, 223, 0.58);
      font-size: 7px;
    }

    .session-portal {
      height: 23px;
      padding: 3px 20px 3px 8px;
      overflow: hidden;
      display: block;
      color: #c4e8cd;
      border: 0;
      background:
        linear-gradient(90deg, rgba(0, 6, 3, 0.82), color-mix(in srgb, var(--status-color) 7%, rgba(5, 22, 12, 0.6)) 62%, rgba(5, 24, 13, 0.15));
      cursor: pointer;
      text-align: left;
      white-space: nowrap;
      text-overflow: ellipsis;
      font: 12px/16px var(--body);
      text-shadow: 0 0 6px color-mix(in srgb, var(--status-color) 55%, transparent);
      transition: color 110ms ease, background 110ms ease, text-shadow 110ms ease;
    }

    .session-portal::after {
      content: attr(data-slot);
      position: absolute;
      top: 4px;
      right: 6px;
      color: var(--status-color);
      font: 8px/1 var(--display);
      opacity: 0.64;
    }

    .session-portal:hover,
    .session-portal:focus-visible,
    .session-portal.is-current {
      color: #effff3;
      outline: none;
      background:
        linear-gradient(90deg, rgba(3, 16, 8, 0.75), color-mix(in srgb, var(--status-color) 18%, rgba(3, 18, 9, 0.5)) 72%, transparent);
      text-shadow: 0 0 9px color-mix(in srgb, var(--status-color) 80%, transparent);
    }

    .session-portal.is-current {
      background:
        linear-gradient(90deg, color-mix(in srgb, var(--status-color) 16%, rgba(2, 12, 6, 0.8)), color-mix(in srgb, var(--status-color) 10%, transparent) 78%, transparent);
    }

    .map-toggle {
      position: absolute;
      right: 9px;
      bottom: 9px;
      pointer-events: auto;
      height: 22px;
      padding: 0 6px 0 8px;
      display: flex;
      align-items: center;
      gap: 7px;
      border: 1px solid rgba(104, 233, 221, 0.26);
      border-left: 2px solid var(--cyan);
      color: var(--cyan);
      background: rgba(2, 14, 12, 0.78);
      cursor: pointer;
      font: 8px/1 var(--display);
      letter-spacing: 0.14em;
      text-align: left;
    }

    .map-toggle::before {
      content: ">";
      color: rgba(104, 233, 221, 0.62);
    }

    .map-toggle .key-hint {
      padding: 1px 3px 0;
      border: 1px solid rgba(104, 233, 221, 0.3);
      color: rgba(182, 255, 246, 0.55);
      font-size: 7px;
      letter-spacing: 0.06em;
    }

    .map-toggle:hover,
    .map-toggle:focus-visible {
      outline: none;
      border-color: var(--cyan);
      color: #e7fffc;
      box-shadow: 0 0 10px rgba(104, 233, 221, 0.2);
    }

    .map-toggle:hover .key-hint,
    .map-toggle:focus-visible .key-hint {
      color: var(--cyan);
      border-color: var(--cyan);
    }

    .city-map {
      position: absolute;
      z-index: 30;
      inset: 58px 0 0;
      display: flex;
      flex-direction: column;
      background: var(--void);
      transform: translateX(-102%);
      visibility: hidden;
      transition: transform 240ms cubic-bezier(.2, .75, .2, 1), visibility 240ms;
      border-right: 1px solid var(--matrix-dim);
    }

    /* DVD 菜单屏数字雨背景（垫底层，map 打开时才启动渲染） */
    .map-rain {
      position: absolute;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
    }

    .city-map.is-open {
      transform: translateX(0);
      visibility: visible;
    }

    .map-stylebar {
      position: relative;
      z-index: 1;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px 9px;
      border-bottom: 1px solid rgba(77, 255, 131, 0.21);
      background: rgba(3, 12, 7, 0.92);
    }

    .map-stylebar-kicker {
      color: var(--matrix);
      font-size: 8px;
      line-height: 1;
    }

    .map-style-toggle {
      padding: 5px 9px;
      border: 1px solid rgba(77, 255, 131, 0.3);
      color: var(--matrix);
      background: rgba(5, 22, 11, 0.7);
      cursor: pointer;
      font: 9px/1 var(--body);
      letter-spacing: 0.1em;
    }

    .map-style-toggle:hover,
    .map-style-toggle:focus-visible {
      outline: none;
      border-color: var(--matrix);
      color: #fff;
    }

    .map-body {
      position: relative;
      z-index: 1;
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--matrix-dim) transparent;
      padding: 8px 0 16px;
      /* 文字区暗色衬底：左强右弱压雨保读，右缘雨幕仍透出 */
      background: linear-gradient(90deg, rgba(1, 6, 3, 0.82) 0%, rgba(1, 6, 3, 0.62) 68%, rgba(1, 6, 3, 0.3) 100%);
    }

    .map-session-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    /* ── 分组样式（V1 章节选单）：BAY 章标题 + 缩进会话项 ── */
    /* 明度阶梯（§6）：标题 100% / 章节 55% / 时间与序号 38%，单一绿色相内分层 */
    .map-body.grouped .map-district-head {
      width: 100%;
      padding: 14px 12px 6px;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 0;
      background: none;
      cursor: pointer;
      color: rgba(70, 229, 114, 0.55);
      font: 9px/1 var(--display);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      text-align: left;
    }

    .map-body.grouped .map-district-head::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, rgba(70, 229, 114, 0.38), transparent);
    }

    .map-body.grouped .map-district-head:hover,
    .map-body.grouped .map-district-head:focus-visible {
      outline: none;
      color: #46e572;
    }

    .map-body.grouped .map-session-button {
      position: relative;
      width: 100%;
      padding: 8px 14px 8px 22px;
      display: flex;
      align-items: baseline;
      gap: 6px;
      border: 0;
      background: none;
      cursor: pointer;
      text-align: left;
      color: #46e572;
      font: 13px/1.15 var(--body);
      letter-spacing: 0.05em;
      text-shadow: 0 0 7px rgba(70, 229, 114, 0.6), 0 1px 3px rgba(0, 0, 0, 0.9);
      transition: background 120ms linear, color 120ms linear;
    }

    .map-body.grouped .map-session-button .cur {
      display: none; /* 分组选中态走左缘刻度条（§1），不占中文宽度 */
    }

    .map-body.grouped .map-session-button .age {
      margin-left: auto;
      color: rgba(70, 229, 114, 0.38);
      font: 10px/1 var(--display);
      letter-spacing: 0.12em;
      text-shadow: none;
    }

    /* 终端选中框（按 002 采样）：中绿条 #309858 + 黑横纹 + 亮边，文字深绿近黑 */
    .map-body.grouped .map-session-button.is-current {
      background:
        repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.3) 0 1px, transparent 1px 3px),
        rgb(48, 152, 88);
      color: rgb(2, 24, 4);
      box-shadow: inset 0 0 0 1px rgba(140, 255, 175, 0.8);
      text-shadow: none;
    }

    .map-body.grouped .map-session-button.is-current .age {
      color: rgba(2, 24, 4, 0.7);
      text-shadow: none;
    }

    /* ── 平铺样式（V2）：全局序号 + 终端选中框（仅选中行带 CRT 扫描纹理） ── */
    .map-body.flat .map-session-button {
      width: 100%;
      padding: 7px 16px;
      display: flex;
      align-items: baseline;
      border: 0;
      background: none;
      cursor: pointer;
      text-align: left;
      color: #46e572;
      font: 12.5px/1.2 var(--body);
      letter-spacing: 0.04em;
      text-shadow: 0 0 6px rgba(70, 229, 114, 0.55), 0 1px 3px rgba(0, 0, 0, 0.9);
      transition: background 120ms linear, color 120ms linear;
    }

    .map-body.flat .map-session-button .idx {
      flex: 0 0 30px;
      color: rgba(70, 229, 114, 0.38);
      font: 10px/1 var(--display);
      text-shadow: none;
    }

    .map-body.flat .map-session-button .cur {
      display: none;
      margin-right: 4px;
    }

    .map-body.flat .map-session-button .age {
      margin-left: auto;
      color: rgba(70, 229, 114, 0.38);
      font: 9px/1 var(--display);
      text-shadow: none;
    }

    /* 终端选中框（按 002 采样）：中绿条 #309858 + 黑横纹 + 亮边，文字深绿近黑 */
    .map-body.flat .map-session-button.is-current {
      background:
        repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.3) 0 1px, transparent 1px 3px),
        rgb(48, 152, 88);
      color: rgb(2, 24, 4);
      box-shadow: inset 0 0 0 1px rgba(140, 255, 175, 0.8);
      text-shadow: none;
    }

    .map-body.flat .map-session-button.is-current .cur {
      display: inline;
    }

    .map-body.flat .map-session-button.is-current .idx {
      visibility: visible;
      color: rgba(2, 24, 4, 0.7);
      text-shadow: none;
    }

    .map-body.flat .map-session-button.is-current .age {
      color: rgba(2, 24, 4, 0.7);
      text-shadow: none;
    }

    /* §8 hover 与 selected 分层：hover 只给 4% 浅底，禁边框/字重防行位移 */
    .map-body.grouped .map-session-button:hover,
    .map-body.flat .map-session-button:hover {
      background: rgba(70, 229, 114, 0.05);
    }

    /* 选中行 hover 时保持选中态（不被浅底覆盖） */
    .map-body.grouped .map-session-button.is-current:hover,
    .map-body.flat .map-session-button.is-current:hover {
      background:
        repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.3) 0 1px, transparent 1px 3px),
        rgb(48, 152, 88);
    }

    .map-body.grouped .map-session-button:focus-visible,
    .map-body.flat .map-session-button:focus-visible {
      outline: 1px solid rgba(70, 229, 114, 0.4);
      outline-offset: -1px;
    }

    .map-session-button .title {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .host-field {
      position: relative;
      flex: 1 1 auto;
      min-width: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: rgba(136, 183, 148, 0.2);
      font-size: 10px;
      letter-spacing: 0.13em;
      text-align: center;
    }

    .host-field::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(rgba(95, 255, 142, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(95, 255, 142, 0.025) 1px, transparent 1px);
      background-size: 32px 32px;
      mask-image: radial-gradient(circle at 10% 50%, black, transparent 65%);
    }

    .host-field span {
      position: relative;
      padding: 13px 17px;
      border: 1px solid rgba(105, 255, 149, 0.08);
    }

    .host-field strong {
      display: block;
      margin-bottom: 7px;
      color: rgba(85, 255, 133, 0.27);
      font-weight: 400;
      font-size: 19px;
    }

    [data-experience="focus"] .zion-sidebar::before {
      opacity: 0.35;
    }

    [data-experience="focus"] .crosshair,
    [data-experience="focus"] .horizon-tag {
      opacity: 0.25;
    }

    [data-experience="reduced"] .head-status::before {
      animation: none;
    }

    [data-experience="reduced"] .city-map,
    [data-experience="reduced"] .district-marker,
    [data-experience="reduced"] .session-portal {
      transition-duration: 0ms;
    }

    @keyframes breathe {
      0%, 100% { opacity: 0.42; transform: scale(0.84); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    @media (max-width: 560px) {
      body {
        width: min(var(--sidebar-width), 100vw);
        background: var(--void);
      }

      .host-field {
        display: none;
      }

      .zion-sidebar {
        border-right: 0;
      }
    }

    @media (max-height: 650px) {
      .zion-sidebar {
        min-height: 520px;
      }

      .sidebar-head {
        height: 52px;
        flex-basis: 52px;
        padding-top: 7px;
      }

      .city-map {
        top: 52px;
      }
    }

    .width-handle {
      position: absolute;
      top: 0;
      right: -3px;
      bottom: 0;
      width: 8px;
      z-index: 30;
      cursor: ew-resize;
      touch-action: none;
    }

    .width-handle::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 3px;

    const widthHandle = document.querySelector("#width-handle");

    // 亮度场 → 绿色 LUT（拖尾 #4e9e57，亮头亮绿），行走加速雨势（对齐生产 FX_BUSY）。
    const RAIN_LUT = [];
    for (let i = 0; i < 24; i++) {
      const b = i / 23;
      let r, g, bl;
      if (b < 0.85) {      // 暗部 #0e2f1a → 拖尾主体 #4e9e57
        const k = b / 0.85;
        r = 14 + (78 - 14) * k; g = 47 + (158 - 47) * k; bl = 26 + (87 - 26) * k;
      } else {              // 顶端 15% → 亮头 #a7e6b0
        const k = (b - 0.85) / 0.15;

      RAIN_LUT.push(`rgb(${r | 0},${g | 0},${bl | 0})`);

    function mulberry32(seed) {
      return function () {
        seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    const RAIN_ZRANGE = 1400, RAIN_CELL_H = 9, RAIN_GLYPH_SX = 0.55;
    const rainCols3d = [];

      const rand = mulberry32(20260828);

          const cells = 24 + Math.floor(rand() * 20); // 216~396 世界单位高

            y0: -40 + rand() * 200, // 雨帘基部高度错落，覆盖视线上方区域

            speedK: 0.85 + rand() * 0.3,
            seed: rand() * 1000

    let rainPrev = 0;

    function clamp(value, min, max) {

    function workspaceCameraBounds(index = state.activeWorkspace) {

    function stableGlyph(seed, alphabet = MATRIX_GLYPHS) {
      const value = Math.abs(Math.sin(seed * 12.9898 + 78.233) * 43758.5453);

    function hexToRgb(hex) {

        g: parseInt(clean.slice(2, 4), 16),
        b: parseInt(clean.slice(4, 6), 16)

    function rgba(hex, alpha) {
      const color = hexToRgb(hex);
      return `rgba(${color.r}, ${color.g}, ${color.b}, ${alpha})`;

    function createBuildingPoints(workspace, workspaceIndex) {
      const points = [];
      const width = 100;
      const height = BUILDING_HEIGHT;
      const depth = 74;
      const xSteps = 13;
      const ySteps = 22;

      for (let yi = 0; yi <= ySteps; yi += 1) {
        const y = yi * (height / ySteps);
        for (let xi = 0; xi <= xSteps; xi += 1) {
          const x = -width / 2 + xi * (width / xSteps);
          const edge = xi === 0 || xi === xSteps || yi === 0 || yi === ySteps;
          const windowBand = yi > 2 && yi < ySteps - 2 && yi % 3 !== 0 && xi > 1 && xi < xSteps - 1;
          if (!edge && !windowBand && (xi + yi) % 4 !== 0) continue;
          points.push({
            x: workspace.x + x,
            y,
            z: workspace.z,
            glyph: edge ? stableGlyph(xi + yi * 3 + workspaceIndex, "|<>+") : stableGlyph(xi * 7 + yi * 11 + workspaceIndex),
            energy: edge ? 0.92 : (windowBand ? 0.52 : 0.28),
            workspaceIndex
          });
        }
      }

      for (let zi = 1; zi <= 8; zi += 1) {
        const z = workspace.z + zi * (depth / 8);
        for (let yi = 0; yi <= ySteps; yi += 2) {
          const y = yi * (height / ySteps);
          [-width / 2, width / 2].forEach((side, sideIndex) => {

              x: workspace.x + side,
              y,
              z,
              glyph: stableGlyph(zi * 17 + yi * 5 + sideIndex + workspaceIndex, ARCH_GLYPHS),
              energy: 0.42,

      workspace.sessions.forEach((session, sessionIndex) => {

            y,
            z: workspace.z - 0.5,
            glyph: xi === -5 || xi === 5 ? status.glyph : stableGlyph(sessionIndex * 19 + xi + workspaceIndex),
            energy: 1,
            workspaceIndex,
            sessionIndex,
            statusColor: status.color
          });
        }
      });

      return points;

    function project(x, y, z) {
      const depth = z - state.cameraZ;
      if (depth <= 18) return null;
      const focal = Math.min(232, state.height * 0.49);

      context.fillRect(0, horizon - 100, state.width, 210);

    // 3D 世界锚定代码雨：雨点持续下落，行走（state.motion）加速雨势；
    // 亮度场 → RAIN_LUT，整柱 ×0.55 横向压缩；reduced 冻结、focus 压暗
    function drawRain3D(time) {
      const dt = Math.min(0.05, (time - rainPrev) / 1000);
      rainPrev = time;
      const reduced = state.experience === "reduced";
      const focusFactor = state.experience === "focus" ? 0.3 : 1;
      const rainK = reduced ? 0 : 1 + (state.motion || 0) * 0.8;

      const visible = [];
      for (const col of rainCols3d) {
        if (!reduced) {
          for (const d of col.drops) {
            d.y -= d.speed * col.speedK * rainK * dt;
            if (d.y < 0) { d.y = col.height + Math.random() * 30; d.speed = RAIN_CELL_H * 5; }
          }
        }
        const depth = ((col.z - state.cameraZ) % RAIN_ZRANGE + RAIN_ZRANGE) % RAIN_ZRANGE + 20;
        const point = project(col.x, 0, state.cameraZ + depth);
        if (!point) continue;
        if (point.x < -30 || point.x > state.width + 30) continue;
        visible.push({ col, depth, point });
      }
      visible.sort((a, b) => b.depth - a.depth);

      context.textAlign = "center";
      context.textBaseline = "middle";
      let lastSize = 0;
      for (const { col, depth, point } of visible) {
        const s = point.scale;
        const size = Math.max(3, Math.min(20, Math.round(s * RAIN_CELL_H)));
        if (size !== lastSize) {
          context.font = `${size}px "Matrix Code"`;
          lastSize = size;
        }
        const fade = clamp(1 - depth / 1500, 0.08, 1);
        const camEyeY = BUILDING_HEIGHT / 2;

        context.save();
        context.translate(point.x, 0);
        context.scale(RAIN_GLYPH_SX, 1);
        for (let ci = 0; ci < col.cells; ci++) {
          if (depth > 500 && (ci & 1)) continue;
          const y = ci * RAIN_CELL_H;
          let b = 0.08;
          for (const d of col.drops) {
            const dy = y - d.y;
            if (dy >= 0 && dy < d.trail) b = Math.max(b, 1 - dy / d.trail);
          }
          if (depth > 900 && b < 0.3) continue; // 远处只留亮串，省 fillText
          const sy = state.height / 2 - (col.y0 + y - camEyeY) * s;
          if (sy < -16 || sy > state.height + 16) continue;
          const bright = b * fade * focusFactor;
          const glyph = stableGlyph(col.seed + ci * 7 + Math.floor((reduced ? 0 : time) * 0.001 * (0.15 + bright * 0.45)));
          if (b > 0.8) {
            context.shadowColor = "rgba(140,230,160,0.8)";
            context.shadowBlur = 8;
            context.fillStyle = rainColorAt(Math.max(0.85, bright));
            context.fillText(glyph, 0, sy);
            context.shadowBlur = 0;
          } else {
            context.globalAlpha = Math.min(1, bright * 1.15);
            context.fillStyle = rainColorAt(bright);
            context.fillText(glyph, 0, sy);
            context.globalAlpha = 1;
          }
        }
        context.restore();
      }
    }

    function drawWorldLine(a, b, color, width = 1) {
      const start = project(a.x, a.y, a.z);
      const end = project(b.x, b.y, b.z);
      if (!start || !end) return;
      context.beginPath();
      context.moveTo(start.x, start.y);
      context.lineTo(end.x, end.y);
      context.strokeStyle = color;
      context.lineWidth = width;
      context.stroke();
    }

    function drawStreet(time) {
      context.font = '9px "Matrix Code"';
      context.textAlign = "center";
      context.textBaseline = "middle";

      for (let distance = 42; distance < 1450; distance += 28) {
        const z = state.cameraZ + distance;
        [-34, 0, 34].forEach((x, lane) => {
          const point = project(x, 0, z);
          if (!point || point.y < 0 || point.y > state.height + 16) return;
          const alpha = clamp(0.58 - distance / 2400, 0.06, 0.48);
          context.fillStyle = lane === 1
            ? `rgba(217,255,229,${alpha * 0.52})`
            : `rgba(57,255,115,${alpha})`;
          const glyphSeed = distance + lane * 17 + Math.floor((state.experience === "reduced" ? 0 : time) / 280);
          context.fillText(stableGlyph(glyphSeed, lane === 1 ? ":*" : "|+"), point.x, point.y);
        });
      }

      const farZ = state.cameraZ + 1500;
      [-62, -34, 34, 62].forEach((x, index) => {
        drawWorldLine(
          { x, y: 0, z: state.cameraZ + 24 },
          { x: x * 0.35, y: 0, z: farZ },
          index === 1 || index === 2 ? "rgba(83,255,135,0.22)" : "rgba(83,255,135,0.08)"
        );
      });
    }

    function drawBuildingShell(workspace, workspaceIndex) {
      const active = workspaceIndex === state.activeWorkspace;
      const width = 100;
      const height = BUILDING_HEIGHT;
      const depth = 74;
      const front = [
        project(workspace.x - width / 2, 0, workspace.z),
        project(workspace.x + width / 2, 0, workspace.z),
        project(workspace.x + width / 2, height, workspace.z),
        project(workspace.x - width / 2, height, workspace.z)
      ];
      if (front.some((point) => !point)) return;

      context.beginPath();
      context.moveTo(front[0].x, front[0].y);
      front.slice(1).forEach((point) => context.lineTo(point.x, point.y));
      context.closePath();
      context.fillStyle = active ? rgba(workspace.color, 0.055) : "rgba(3,14,8,0.09)";
      context.fill();
      context.strokeStyle = active ? rgba(workspace.color, 0.36) : "rgba(69,181,100,0.12)";
      context.lineWidth = active ? 1 : 0.6;
      context.stroke();

      const side = workspace.x < 0 ? width / 2 : -width / 2;
      drawWorldLine(
        { x: workspace.x + side, y: 0, z: workspace.z },
        { x: workspace.x + side, y: 0, z: workspace.z + depth },
        rgba(workspace.color, active ? 0.38 : 0.15)
      );
      drawWorldLine(
        { x: workspace.x + side, y: height, z: workspace.z },
        { x: workspace.x + side, y: height, z: workspace.z + depth },
        rgba(workspace.color, active ? 0.3 : 0.12)
      );
    }

    function drawBuildings(time) {
      const drawable = [];

      WORKSPACES.forEach((workspace, workspaceIndex) => {
        drawBuildingShell(workspace, workspaceIndex);
        buildingPoints[workspaceIndex].forEach((point) => {
          const projected = project(point.x, point.y, point.z);
          if (!projected) return;
          if (projected.x < -12 || projected.x > state.width + 12 || projected.y < -12 || projected.y > state.height + 12) return;
          drawable.push({ point, projected, workspace });
        });
      });

      drawable.sort((a, b) => b.projected.depth - a.projected.depth);
      context.textAlign = "center";
      context.textBaseline = "middle";

      drawable.forEach(({ point, projected, workspace }) => {
        const active = point.workspaceIndex === state.activeWorkspace;
        const size = clamp(5.5 + projected.scale * 5.8, 5.8, 13.5);
        const depthFade = clamp(1 - projected.depth / 1700, 0.11, 0.88);
        const pulse = state.experience === "cinematic" && point.sessionIndex !== undefined
          ? 0.78 + Math.sin(time * 0.004 + point.sessionIndex) * 0.22
          : 1;
        const alpha = depthFade * point.energy * (active ? 1 : 0.68) * pulse;
        context.font = `${size}px "Matrix Code"`;
        context.fillStyle = point.statusColor
          ? rgba(point.statusColor, alpha)
          : rgba(workspace.color, alpha);
        context.fillText(point.glyph, projected.x, projected.y);
      });
    }

    // Portal 投射口：建筑立面会话带中心的一小段高亮横线（Portal 全息投影的发射口）
    function drawPortalBeams() {
      const workspace = WORKSPACES[state.activeWorkspace];
      if (!workspace) return;
      const buildingDepth = workspace.z - state.cameraZ;
      if (buildingDepth < 56 || buildingDepth > 510) return;
      const alphaScale = clamp(1.2 - Math.abs(buildingDepth - 225) / 370, 0.22, 1);

      workspace.sessions.forEach((session, sessionIndex) => {
        const y = 127 - sessionIndex * 21;
        const back = project(workspace.x, y, workspace.z);
        if (!back) return;
        const color = STATUS[session.status].color;

        // 立面投射口：一小段高亮横线
        context.strokeStyle = rgba(color, 0.5 * alphaScale);
        context.lineWidth = 1;
        context.beginPath();
        context.moveTo(back.x - 6 * back.scale, back.y);
        context.lineTo(back.x + 6 * back.scale, back.y);
        context.stroke();
      });
    }

    function drawDepthFog() {
      const fog = context.createLinearGradient(0, 0, 0, state.height);
      fog.addColorStop(0, "rgba(0,3,2,0.18)");
      fog.addColorStop(0.38, "rgba(0,0,0,0)");
      fog.addColorStop(1, "rgba(0,3,1,0.36)");
      context.fillStyle = fog;
      context.fillRect(0, 0, state.width, state.height);
    }

    function renderCanvas(time) {
      drawBackground(time);
      drawRain3D(time);
      drawStreet(time);
      drawBuildings(time);
      drawPortalBeams();
      drawDepthFog();
    }

    function createWorkspaceMarkers() {
      workspaceLayer.replaceChildren();
      WORKSPACES.forEach((workspace, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "district-marker";
        button.style.setProperty("--workspace-color", workspace.color);
        button.setAttribute("aria-label", `前往工作区 ${workspace.name}，${workspace.sessions.length} 个会话`);

        const code = document.createElement("span");
        code.className = "code";
        code.textContent = workspace.code;
        const name = document.createElement("span");
        name.className = "name";
        name.textContent = workspace.name;
        const count = document.createElement("span");
        count.className = "count";
        count.textContent = String(workspace.sessions.length).padStart(2, "0");

        button.append(code, name, count);
        button.addEventListener("click", () => navigateToWorkspace(index));
        workspaceLayer.append(button);
        workspaceMarkers.set(workspace.id, button);
      });
    }

    function rebuildSessionPortals() {
      const workspace = WORKSPACES[state.activeWorkspace];
      sessionLayer.replaceChildren();
      sessionButtons = workspace.sessions.map((session, sessionIndex) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "session-portal";
        button.textContent = session.title;
        button.dataset.slot = String(sessionIndex + 1).padStart(2, "0");
        button.style.setProperty("--status-color", STATUS[session.status].color);
        button.title = `${session.title} · ${STATUS[session.status].label} · ${session.time}`;
        button.setAttribute("aria-label", `${session.title}，${STATUS[session.status].label}，${session.time}`);
        if (state.selectedWorkspace === state.activeWorkspace && state.selectedSessionId === session.id) {
          button.classList.add("is-current");
        }
        button.addEventListener("click", () => selectSession(state.activeWorkspace, session.id));
        sessionLayer.append(button);
        return button;
      });
    }

    function updateProjectedDom() {
      WORKSPACES.forEach((workspace, index) => {
        const marker = workspaceMarkers.get(workspace.id);
        const point = project(workspace.x, 203, workspace.z);
        if (!point || point.depth > 1500 || point.x < -100 || point.x > state.width + 100) {
          marker.style.opacity = "0";
          marker.style.pointerEvents = "none";
          return;
        }

        const scale = clamp(point.scale, 0.58, 1.08);
        marker.style.left = `${point.x}px`;
        marker.style.top = `${point.y}px`;
        marker.style.opacity = String(clamp(1 - point.depth / 1750, 0.2, 0.96));
        marker.style.transform = `translate(-50%, -100%) scale(${scale})`;
        marker.style.pointerEvents = "auto";
        marker.classList.toggle("is-active", index === state.activeWorkspace);
      });

      const workspace = WORKSPACES[state.activeWorkspace];
      const buildingDepth = workspace.z - state.cameraZ;
      // 穿越时纵向压缩：投影 scale 越大，Portal 的 y 越向建筑中线收拢，屏幕间距近似恒定
      const centerAnchor = project(workspace.x, BUILDING_HEIGHT / 2, workspace.z - PORTAL_LIFT);
      sessionButtons.forEach((button, sessionIndex) => {
        const y = 127 - sessionIndex * 21;
        const point = project(workspace.x, y, workspace.z - PORTAL_LIFT);
        if (!point || buildingDepth < 56 || buildingDepth > 510) {
          button.style.opacity = "0";
          button.style.pointerEvents = "none";
          return;
        }
        const spread = clamp(1.5 / point.scale, 0.55, 1);
        const screenY = centerAnchor ? centerAnchor.y + (point.y - centerAnchor.y) * spread : point.y;
        if (screenY < 24 || screenY > state.height - 50) {
          button.style.opacity = "0";
          button.style.pointerEvents = "none";
          return;
        }
        const scale = clamp(point.scale, 0.72, 1.04) * (1 + (state.motion || 0) * 0.1);
        const width = clamp(130 * scale + 28, 132, 182);
        button.style.width = `${width}px`;
        button.style.left = `${point.x}px`;
        button.style.top = `${screenY}px`;
        // 运动中：透明度下限抬到 0.85，深度衰减几乎拉平，Portal 保持醒目
        const base = clamp(1.2 - Math.abs(buildingDepth - 225) / 370, 0.22, 1);
        button.style.opacity = String(mix(base, 1, (state.motion || 0) * 0.9));
        button.style.transform = `translate(-50%, -50%) scale(${scale})`;
        button.style.pointerEvents = "auto";
      });

      coordinateLabel.textContent = `Z:${String(Math.round(state.cameraZ + 100)).padStart(4, "0")} X:${Math.round(state.cameraX)}`;
    }

    function closestWorkspaceIndex() {
      let bestIndex = 0;
      let bestDistance = Infinity;
      WORKSPACES.forEach((workspace, index) => {
        const distance = Math.abs(state.cameraZ - (workspace.z - 230));
        if (distance < bestDistance) {
          bestDistance = distance;
          bestIndex = index;
        }
      });
      return bestIndex;
    }

    function syncActiveWorkspaceFromCamera() {
      const next = closestWorkspaceIndex();
      if (next === state.activeWorkspace) return;
      state.activeWorkspace = next;
      centerCameraOnWorkspace(next, state.experience === "reduced");
      rebuildSessionPortals();
    }

    function navigateToWorkspace(index, selectFirst = false) {
      const workspace = WORKSPACES[index];
      state.activeWorkspace = index;
      state.targetZ = workspace.z - 230;
      centerCameraOnWorkspace(index, state.experience === "reduced");
      if (state.experience === "reduced") {
        state.cameraZ = state.targetZ;
      }
      if (selectFirst) selectSession(index, workspace.sessions[0].id);
      rebuildSessionPortals();
    }

    function selectSession(workspaceIndex, sessionId) {
      const workspace = WORKSPACES[workspaceIndex];
      const session = workspace.sessions.find((item) => item.id === sessionId);
      if (!session) return;
      state.selectedWorkspace = workspaceIndex;
      state.selectedSessionId = session.id;
      if (state.activeWorkspace !== workspaceIndex) navigateToWorkspace(workspaceIndex);
      rebuildSessionPortals();
      updateMapSelection();
    }

    function buildMap() {
      mapBody.replaceChildren();
      mapBody.classList.toggle("grouped", state.mapStyle === "grouped");
      mapBody.classList.toggle("flat", state.mapStyle === "flat");
      mapStylebarKicker.textContent = state.mapStyle === "grouped"
        ? "SCENE SELECTIONS // 4 DISTRICTS"
        : "SESSION PORTALS // ALL DISTRICTS";
      mapStyleToggle.textContent = state.mapStyle === "grouped" ? "分组" : "平铺";

      let itemNo = 0;
      WORKSPACES.forEach((workspace, workspaceIndex) => {
        if (state.mapStyle === "grouped") {
          const head = document.createElement("button");
          head.type = "button";
          head.className = "map-district-head";
          head.textContent = `BAY ${String(workspaceIndex + 1).padStart(2, "0")} · ${workspace.name}`;
          head.setAttribute("aria-label", `前往工作区 ${workspace.name}，${workspace.sessions.length} 个会话`);
          head.addEventListener("click", () => {
            navigateToWorkspace(workspaceIndex);
            closeMap();
          });
          mapBody.append(head);
        }

        const list = document.createElement("ul");
        list.className = "map-session-list";
        list.setAttribute("role", "group");
        list.setAttribute("aria-label", workspace.name);
        workspace.sessions.forEach((session) => {
          itemNo += 1;
          const item = document.createElement("li");
          item.setAttribute("role", "none");
          const button = document.createElement("button");
          button.type = "button";
          button.className = "map-session-button";
          button.dataset.workspaceIndex = String(workspaceIndex);
          button.dataset.sessionId = session.id;
          button.style.setProperty("--status-color", STATUS[session.status].color);
          button.setAttribute("role", "treeitem");
          button.setAttribute("aria-label", `${workspace.name}，${session.title}，${STATUS[session.status].label}，${session.time}`);
          button.title = `${session.title} · ${STATUS[session.status].label} · ${session.time}`;
          if (state.mapStyle === "flat") {
            const idx = document.createElement("span");
            idx.className = "idx";
            idx.textContent = String(itemNo).padStart(2, "0");
            button.append(idx);
          }
          const cursor = document.createElement("span");
          cursor.className = "cur";
          cursor.textContent = ">";
          const title = document.createElement("span");
          title.className = "title";
          title.textContent = session.title;
          const age = document.createElement("span");
          age.className = "age";
          age.textContent = session.time;
          button.append(cursor, title, age);
          button.addEventListener("click", () => {
            selectSession(workspaceIndex, session.id);
            navigateToWorkspace(workspaceIndex);
            closeMap();
          });
          item.append(button);
          list.append(item);
        });
        mapBody.append(list);
      });
      updateMapSelection();
    }

    function updateMapSelection() {
      mapBody.querySelectorAll(".map-session-button").forEach((button) => {
        const isCurrent = Number(button.dataset.workspaceIndex) === state.selectedWorkspace
          && button.dataset.sessionId === state.selectedSessionId;
        button.classList.toggle("is-current", isCurrent);
        button.setAttribute("aria-current", isCurrent ? "page" : "false");
      });
    }

    function openMap() {
      state.mapOpen = true;
      mapPanel.classList.add("is-open");
      startMapRain();
      mapPanel.setAttribute("aria-hidden", "false");
      mapToggle.setAttribute("aria-expanded", "true");
      const current = mapBody.querySelector(".map-session-button.is-current");
      if (current) {
        current.scrollIntoView({ block: "center" });
        current.focus({ preventScroll: true });
      } else {
        mapStyleToggle.focus();
      }
    }

    function closeMap() {
      state.mapOpen = false;
      stopMapRain();
      mapPanel.classList.remove("is-open");
      mapPanel.setAttribute("aria-hidden", "true");
      mapToggle.setAttribute("aria-expanded", "false");
      mapToggle.focus({ preventScroll: true });
    }

    function toggleMap() {
      if (state.mapOpen) closeMap();
      else openMap();
    }

    function moveCamera(direction, amount = 76) {
      if (direction === "forward") state.targetZ += amount;
      if (direction === "back") state.targetZ -= amount;
      if (direction === "left") state.targetX -= 13;
      if (direction === "right") state.targetX += 13;
      state.targetZ = clamp(state.targetZ, -15, WORKSPACES.at(-1).z - 128);
      if (direction === "left" || direction === "right") {
        const bounds = workspaceCameraBounds();
        state.targetX = clamp(state.targetX, bounds.min, bounds.max);
      }
      if (state.experience === "reduced") {
        state.cameraZ = state.targetZ;
        state.cameraX = state.targetX;
        syncActiveWorkspaceFromCamera();
      }
    }

    function setExperience(experience) {
      state.experience = experience;
      document.body.dataset.experience = experience;
      if (experience === "reduced") {
        state.cameraZ = state.targetZ;
        state.cameraX = state.targetX;
      }
    }

    function handleKeydown(event) {
      if (event.target.matches("input, textarea, [contenteditable]")) return;
      if (event.key === "Escape" && state.mapOpen) {
        event.preventDefault();
        closeMap();
        return;
      }
      if (event.key.toLowerCase() === "m") {
        event.preventDefault();
        toggleMap();
        return;
      }
      if (state.mapOpen) return;
      const key = event.key.toLowerCase();
      const directions = {
        w: "forward",
        arrowup: "forward",
        s: "back",
        arrowdown: "back",
        a: "left",
        arrowleft: "left",
        d: "right",
        arrowright: "right"
      };
      const direction = directions[key];
      if (!direction) return;
      event.preventDefault();
      moveCamera(direction);
    }

    function animate(time) {
      const delta = Math.min(0.05, (time - previousTime) / 1000);
      previousTime = time;
      const smoothing = state.experience === "reduced" ? 1 : 1 - Math.pow(0.001, delta);
      const prevZ = state.cameraZ;
      const prevX = state.cameraX;
      state.cameraZ = mix(state.cameraZ, state.targetZ, smoothing);
      state.cameraX = mix(state.cameraX, state.targetX, smoothing);
      // 相机运动能量：位移速度 → 0..1 平滑值，驱动 Portal 动态凸显
      const speed = Math.hypot(state.cameraZ - prevZ, state.cameraX - prevX) / Math.max(delta, 0.001);
      const motionTarget = state.experience === "reduced" ? 0 : clamp(speed / 260, 0, 1);
      state.motion = mix(state.motion || 0, motionTarget, 1 - Math.pow(0.01, delta));
      syncActiveWorkspaceFromCamera();
      renderCanvas(time);
      updateProjectedDom();
      requestAnimationFrame(animate);
    }

    frame.addEventListener("wheel", (event) => {
      if (state.mapOpen) return;
      event.preventDefault();
      const amount = clamp(event.deltaY * 0.32, -105, 105);
      state.targetZ = clamp(state.targetZ + amount, -15, WORKSPACES.at(-1).z - 128);
    }, { passive: false });

    frame.addEventListener("pointerdown", (event) => {
      if (event.target.closest("button")) return;
      state.dragging = true;
      state.pointerX = event.clientX;
      state.pointerY = event.clientY;
      frame.setPointerCapture(event.pointerId);
    });

    frame.addEventListener("pointermove", (event) => {
      if (!state.dragging) return;
      const dx = event.clientX - state.pointerX;
      const dy = event.clientY - state.pointerY;
      state.pointerX = event.clientX;
      state.pointerY = event.clientY;
      const bounds = workspaceCameraBounds();
      state.targetX = clamp(state.targetX - dx * 0.23, bounds.min, bounds.max);
      state.targetZ = clamp(state.targetZ + dy * 0.72, -15, WORKSPACES.at(-1).z - 128);
    });

    frame.addEventListener("pointerup", (event) => {
      state.dragging = false;
      if (frame.hasPointerCapture(event.pointerId)) frame.releasePointerCapture(event.pointerId);
    });

    mapToggle.addEventListener("click", toggleMap);
    mapStyleToggle.addEventListener("click", () => {
      state.mapStyle = state.mapStyle === "grouped" ? "flat" : "grouped";
      buildMap();
    });
    document.addEventListener("keydown", handleKeydown);

    const observer = new ResizeObserver(resizeCanvas);
    observer.observe(frame);
    // 拖拽调宽时若 map 打开，同步重铺雨幕
    const mapRainObserver = new ResizeObserver(() => {
      if (state.mapOpen) resizeMapRain();
    });
    mapRainObserver.observe(mapRain);

    createWorkspaceMarkers();
    rebuildSessionPortals();
    // ?mapstyle=flat 调试参数：平铺列表样式截图验证
    if (new URLSearchParams(location.search).get("mapstyle") === "flat") state.mapStyle = "flat";
    buildMap();
    setExperience(state.experience);
    resizeCanvas();
    if (new URLSearchParams(location.search).has("map")) openMap();
    // ?z=<number> 调试参数：定格相机纵深；?w=<280..420> 定格侧栏初始宽度（截图验证用）
    const debugZ = parseFloat(new URLSearchParams(location.search).get("z"));
    if (!Number.isNaN(debugZ)) {
      state.cameraZ = debugZ;
      state.targetZ = debugZ;
    }
    const debugW = parseFloat(new URLSearchParams(location.search).get("w"));
    if (!Number.isNaN(debugW)) setSidebarWidth(debugW);

    document.fonts.load('12px "Matrix Code"').finally(() => {
      requestAnimationFrame(animate);
    });
  </script>
</body>
</html>
