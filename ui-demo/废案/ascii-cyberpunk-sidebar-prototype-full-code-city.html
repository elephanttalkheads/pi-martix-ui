<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZION ASCII DISTRICT — 280px Sidebar Prototype</title>
  <!--
    PROTOTYPE / THROWAWAY UI
    Question: Can a 280px sidebar become a walkable ASCII city while preserving
    multiple workspace identities, every session, real DOM controls and readable Chinese?

    Design: ../docs/ascii-cyberpunk-sidebar-design.md
    Run: npx vite ui-demo --host 127.0.0.1 --port 4178
    Open: http://127.0.0.1:4178/ascii-cyberpunk-sidebar-prototype.html
  -->
  <style>
    @font-face {
      font-family: "Matrix Code";
      src: url("./font/Matrix-Code.ttf") format("truetype");
      font-display: block;
    }

    @font-face {
      font-family: "Sarasa Term SC";
      src: url("./assets/sidebar-spatial-layout/SarasaTermSC-Regular.subset.woff2") format("woff2");
      font-display: swap;
    }

    @font-face {
      font-family: "Share Tech Mono";
      src: url("./assets/sidebar-spatial-layout/ShareTechMono-Regular.woff2") format("woff2");
      font-display: swap;
    }

    :root {
      color-scheme: dark;
      --sidebar-width: 280px;
      --void: #010403;
      --surface: #05100b;
      --surface-raised: rgba(7, 20, 14, 0.94);
      --matrix: #37ff79;
      --matrix-hot: #d9ffe4;
      --matrix-dim: #0a7f3d;
      --cyan: #68e9dd;
      --amber: #ffb45e;
      --error: #ff5364;
      --ink: #d7ffe0;
      --muted: #71977c;
      --line: rgba(77, 255, 131, 0.22);
      --display: "Share Tech Mono", "Sarasa Term SC", monospace;
      --body: "Sarasa Term SC", monospace;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #020504;
      color: var(--ink);
      font-family: var(--body);
    }

    button {
      font: inherit;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      background:
        radial-gradient(circle at 18% 44%, rgba(27, 149, 68, 0.08), transparent 36%),
        linear-gradient(90deg, #010403 0 var(--sidebar-width), #050907 var(--sidebar-width));
    }

    .zion-sidebar {
      position: relative;
      isolation: isolate;
      width: min(var(--sidebar-width), 100vw);
      min-width: min(var(--sidebar-width), 100vw);
      height: 100vh;
      min-height: 560px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--void);
      border-right: 1px solid rgba(103, 255, 148, 0.32);
      box-shadow: 16px 0 60px rgba(0, 0, 0, 0.52), inset -1px 0 rgba(196, 255, 215, 0.06);
    }

    .zion-sidebar::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      background:
        repeating-linear-gradient(0deg, transparent 0 2px, rgba(122, 255, 163, 0.028) 2px 3px),
        linear-gradient(90deg, rgba(70, 255, 125, 0.03), transparent 18%, transparent 82%, rgba(70, 255, 125, 0.04));
      mix-blend-mode: screen;
    }

    .zion-sidebar::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 21;
      pointer-events: none;
      box-shadow:
        inset 0 0 36px rgba(0, 0, 0, 0.88),
        inset 0 0 3px rgba(121, 255, 160, 0.28);
    }

    .sidebar-head {
      position: relative;
      z-index: 8;
      height: 58px;
      flex: 0 0 58px;
      padding: 9px 11px 7px 13px;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: start;
      background:
        linear-gradient(180deg, rgba(15, 39, 25, 0.98), rgba(3, 11, 7, 0.94)),
        var(--void);
      border-bottom: 1px solid var(--line);
    }

    .sidebar-head::after {
      content: "";
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: -1px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--matrix), transparent);
      box-shadow: 0 0 12px var(--matrix);
      opacity: 0.6;
    }

    .brand-kicker,
    .brand-name,
    .head-status,
    .frame-label,
    .frame-coordinate,
    .key,
    .map-kicker,
    .host-field,
    .map-toggle {
      font-family: var(--display);
      letter-spacing: 0.08em;
    }

    .brand-kicker {
      display: block;
      margin-bottom: 2px;
      color: var(--matrix);
      font-size: 8px;
      line-height: 1;
    }

    .brand-name {
      margin: 0;
      font-size: 17px;
      line-height: 1;
      letter-spacing: 0.045em;
      font-weight: 400;
      color: #ebfff1;
      text-shadow: 0 0 13px rgba(80, 255, 135, 0.42);
    }

    .brand-name em {
      color: var(--matrix);
      font-style: normal;
    }

    .head-status {
      margin-top: 3px;
      padding: 4px 5px 3px;
      border: 1px solid rgba(73, 255, 130, 0.28);
      color: var(--matrix);
      background: rgba(38, 255, 99, 0.055);
      font-size: 7px;
      line-height: 1;
      white-space: nowrap;
    }

    .head-status::before {
      content: "";
      display: inline-block;
      width: 4px;
      height: 4px;
      margin-right: 5px;
      border-radius: 50%;
      background: var(--matrix);
      box-shadow: 0 0 7px var(--matrix);
      vertical-align: 1px;
      animation: breathe 2.4s ease-in-out infinite;
    }

    .city-frame {
      position: relative;
      min-height: 335px;
      flex: 1 1 auto;
      overflow: hidden;
      background: #010403;
      border-bottom: 1px solid rgba(77, 255, 131, 0.2);
      touch-action: none;
    }

    #city-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: ns-resize;
    }

    .frame-chrome,
    .projection-layer,
    .session-layer {
      position: absolute;
      inset: 0;
    }

    .frame-chrome,
    .projection-layer,
    .session-layer {
      pointer-events: none;
    }

    .frame-topline {
      position: absolute;
      top: 8px;
      left: 9px;
      right: 9px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: rgba(190, 255, 207, 0.72);
      text-shadow: 0 0 8px rgba(56, 255, 112, 0.5);
    }

    .frame-label,
    .frame-coordinate {
      font-size: 7px;
      line-height: 1;
    }

    .frame-coordinate {
      color: var(--matrix);
    }

    .crosshair {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 17px;
      height: 17px;
      transform: translate(-50%, -50%);
      opacity: 0.62;
      transition: opacity 160ms ease;
    }

    .crosshair::before,
    .crosshair::after {
      content: "";
      position: absolute;
      background: var(--matrix-hot);
      box-shadow: 0 0 8px var(--matrix);
    }

    .crosshair::before {
      width: 1px;
      height: 17px;
      left: 8px;
      top: 0;
    }

    .crosshair::after {
      width: 17px;
      height: 1px;
      left: 0;
      top: 8px;
    }

    .horizon-tag {
      position: absolute;
      right: 8px;
      top: 50%;
      writing-mode: vertical-rl;
      color: rgba(91, 255, 140, 0.42);
      font: 7px/1 var(--display);
      letter-spacing: 0.14em;
    }

    .district-marker,
    .session-portal {
      position: absolute;
      pointer-events: auto;
      opacity: 0;
      transform-origin: center center;
      will-change: transform, left, top, opacity;
    }

    .district-marker {
      min-width: 86px;
      max-width: 148px;
      padding: 4px 6px 4px 7px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 5px;
      align-items: center;
      color: #a9cdb2;
      background: linear-gradient(90deg, rgba(2, 8, 5, 0.94), rgba(4, 18, 10, 0.78));
      border: 1px solid rgba(77, 255, 131, 0.22);
      border-left-color: var(--workspace-color, var(--matrix));
      clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 5px 100%, 0 calc(100% - 5px));
      text-align: left;
      cursor: pointer;
      font: 8px/1.05 var(--display);
      letter-spacing: 0.035em;
      white-space: nowrap;
      overflow: hidden;
      transition: color 140ms ease, border-color 140ms ease, background 140ms ease;
    }

    .district-marker:hover,
    .district-marker:focus-visible,
    .district-marker.is-active {
      color: #edfff1;
      border-color: color-mix(in srgb, var(--workspace-color) 68%, transparent);
      background: linear-gradient(90deg, rgba(3, 10, 7, 0.98), color-mix(in srgb, var(--workspace-color) 14%, rgba(3, 12, 7, 0.9)));
      outline: none;
      box-shadow: 0 0 14px color-mix(in srgb, var(--workspace-color) 25%, transparent);
    }

    .district-marker .code {
      color: var(--workspace-color);
    }

    .district-marker .name {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .district-marker .count {
      color: rgba(213, 255, 223, 0.58);
      font-size: 7px;
    }

    .session-portal {
      height: 23px;
      padding: 3px 20px 3px 8px;
      overflow: hidden;
      display: block;
      color: #c4e8cd;
      border: 0;
      background:
        linear-gradient(90deg, rgba(0, 6, 3, 0.82), color-mix(in srgb, var(--status-color) 7%, rgba(5, 22, 12, 0.6)) 62%, rgba(5, 24, 13, 0.15));
      cursor: pointer;
      text-align: left;
      white-space: nowrap;
      text-overflow: ellipsis;
      font: 12px/16px var(--body);
      text-shadow: 0 0 6px color-mix(in srgb, var(--status-color) 55%, transparent);
      transition: color 110ms ease, background 110ms ease, text-shadow 110ms ease;
    }

    .session-portal::after {
      content: attr(data-slot);
      position: absolute;
      top: 4px;
      right: 6px;
      color: var(--status-color);
      font: 8px/1 var(--display);
      opacity: 0.64;
    }

    .session-portal:hover,
    .session-portal:focus-visible,
    .session-portal.is-current {
      color: #effff3;
      outline: none;
      background:
        linear-gradient(90deg, rgba(3, 16, 8, 0.75), color-mix(in srgb, var(--status-color) 18%, rgba(3, 18, 9, 0.5)) 72%, transparent);
      text-shadow: 0 0 9px color-mix(in srgb, var(--status-color) 80%, transparent);
    }

    .session-portal.is-current {
      background:
        linear-gradient(90deg, color-mix(in srgb, var(--status-color) 16%, rgba(2, 12, 6, 0.8)), color-mix(in srgb, var(--status-color) 10%, transparent) 78%, transparent);
    }

    .map-toggle {
      position: absolute;
      right: 9px;
      bottom: 9px;
      pointer-events: auto;
      height: 22px;
      padding: 0 6px 0 8px;
      display: flex;
      align-items: center;
      gap: 7px;
      border: 1px solid rgba(104, 233, 221, 0.26);
      border-left: 2px solid var(--cyan);
      color: var(--cyan);
      background: rgba(2, 14, 12, 0.78);
      cursor: pointer;
      font: 8px/1 var(--display);
      letter-spacing: 0.14em;
      text-align: left;
    }

    .map-toggle::before {
      content: ">";
      color: rgba(104, 233, 221, 0.62);
    }

    .map-toggle .key-hint {
      padding: 1px 3px 0;
      border: 1px solid rgba(104, 233, 221, 0.3);
      color: rgba(182, 255, 246, 0.55);
      font-size: 7px;
      letter-spacing: 0.06em;
    }

    .map-toggle:hover,
    .map-toggle:focus-visible {
      outline: none;
      border-color: var(--cyan);
      color: #e7fffc;
      box-shadow: 0 0 10px rgba(104, 233, 221, 0.2);
    }

    .map-toggle:hover .key-hint,
    .map-toggle:focus-visible .key-hint {
      color: var(--cyan);
      border-color: var(--cyan);
    }

    .city-map {
      position: absolute;
      z-index: 30;
      inset: 58px 0 0;
      display: flex;
      flex-direction: column;
      background:
        linear-gradient(180deg, rgba(2, 10, 6, 0.985), rgba(1, 5, 3, 0.995)),
        var(--void);
      transform: translateX(-102%);
      visibility: hidden;
      transition: transform 240ms cubic-bezier(.2, .75, .2, 1), visibility 240ms;
      border-right: 1px solid var(--matrix-dim);
    }

    .city-map.is-open {
      transform: translateX(0);
      visibility: visible;
    }

    .map-head {
      flex: 0 0 auto;
      min-height: 55px;
      padding: 10px 12px 8px;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: start;
      border-bottom: 1px solid rgba(77, 255, 131, 0.21);
      background:
        linear-gradient(90deg, rgba(27, 107, 49, 0.16), transparent),
        rgba(3, 12, 7, 0.98);
    }

    .map-kicker {
      display: block;
      color: var(--matrix);
      font-size: 8px;
      line-height: 1;
    }

    .map-head h2 {
      margin: 5px 0 0;
      color: #effff3;
      font: 15px/1 var(--display);
      font-weight: 400;
      letter-spacing: 0.06em;
    }

    .map-close {
      width: 28px;
      height: 28px;
      padding: 0;
      border: 1px solid rgba(77, 255, 131, 0.3);
      color: var(--matrix);
      background: rgba(5, 22, 11, 0.7);
      cursor: pointer;
      font: 14px/1 var(--display);
    }

    .map-close:hover,
    .map-close:focus-visible {
      outline: none;
      border-color: var(--matrix);
      color: #fff;
    }

    .map-body {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--matrix-dim) transparent;
      padding: 8px 10px 16px;
    }

    .map-district {
      margin-top: 10px;
    }

    .map-district-head {
      width: 100%;
      height: 34px;
      padding: 0 4px;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 0;
      background: none;
      color: var(--matrix);
      cursor: pointer;
      text-align: left;
      font: 11px/1 var(--display);
      letter-spacing: 0.14em;
    }

    .map-district-head::before {
      content: "==";
      color: rgba(55, 255, 121, 0.5);
    }

    .map-district-head::after {
      content: "";
      flex: 0 0 auto;
      width: 24px;
      height: 1px;
      background: rgba(77, 255, 131, 0.18);
    }

    .map-district-head .count {
      margin-left: auto;
      color: rgba(215, 255, 224, 0.45);
      font-size: 10px;
      letter-spacing: 0.1em;
    }

    .map-district-head:hover,
    .map-district-head:focus-visible {
      outline: none;
      color: var(--matrix-hot);
      text-shadow: 0 0 8px rgba(55, 255, 121, 0.45);
    }

    .map-session-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .map-session-button {
      width: 100%;
      height: 30px;
      padding: 0 4px;
      display: grid;
      grid-template-columns: 14px 20px 1fr auto;
      align-items: center;
      gap: 6px;
      border: 0;
      border-bottom: 1px dotted rgba(0, 255, 65, 0.12);
      color: #9db8a4;
      background: transparent;
      cursor: pointer;
      text-align: left;
      font: 11px/1 var(--body);
    }

    .map-session-button .cur {
      color: transparent;
      font-size: 12px;
    }

    .map-session-button .sym {
      width: 16px;
      height: 16px;
      color: var(--status-color);
      opacity: 0.85;
    }

    .map-session-button .title {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .map-session-button .age {
      color: #506a57;
      font: 8px/1 var(--display);
      letter-spacing: 0.12em;
    }

    .map-session-button:hover,
    .map-session-button:focus-visible {
      outline: none;
      color: #effff3;
      background: rgba(0, 255, 65, 0.06);
    }

    .map-session-button.is-current {
      color: #effff3;
      background: rgba(0, 255, 65, 0.12);
      box-shadow: inset 2px 0 0 var(--matrix);
    }

    .map-session-button.is-current .cur {
      color: var(--matrix);
    }

    .map-session-button.is-current .title::after {
      content: "▮";
      margin-left: 6px;
      color: var(--matrix);
      animation: blink 1.1s steps(1) infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .host-field {
      position: relative;
      flex: 1 1 auto;
      min-width: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: rgba(136, 183, 148, 0.2);
      font-size: 10px;
      letter-spacing: 0.13em;
      text-align: center;
    }

    .host-field::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(rgba(95, 255, 142, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(95, 255, 142, 0.025) 1px, transparent 1px);
      background-size: 32px 32px;
      mask-image: radial-gradient(circle at 10% 50%, black, transparent 65%);
    }

    .host-field span {
      position: relative;
      padding: 13px 17px;
      border: 1px solid rgba(105, 255, 149, 0.08);
    }

    .host-field strong {
      display: block;
      margin-bottom: 7px;
      color: rgba(85, 255, 133, 0.27);
      font-weight: 400;
      font-size: 19px;
    }

    [data-experience="focus"] .zion-sidebar::before {
      opacity: 0.35;
    }

    [data-experience="focus"] .crosshair,
    [data-experience="focus"] .horizon-tag {
      opacity: 0.25;
    }

    [data-experience="reduced"] .head-status::before {
      animation: none;
    }

    [data-experience="reduced"] .city-map,
    [data-experience="reduced"] .district-marker,
    [data-experience="reduced"] .session-portal {
      transition-duration: 0ms;
    }

    @keyframes breathe {
      0%, 100% { opacity: 0.42; transform: scale(0.84); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    @media (max-width: 560px) {
      body {
        width: min(var(--sidebar-width), 100vw);
        background: var(--void);
      }

      .host-field {
        display: none;
      }

      .zion-sidebar {
        border-right: 0;
      }
    }

    @media (max-height: 650px) {
      .zion-sidebar {
        min-height: 520px;
      }

      .sidebar-head {
        height: 52px;
        flex-basis: 52px;
        padding-top: 7px;
      }

      .city-map {
        top: 52px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body data-experience="cinematic">
  <aside class="zion-sidebar" aria-label="ZION ASCII 多工作区会话栏">
    <header class="sidebar-head">
      <div>
        <span class="brand-kicker">ZION NAVIGATION PROTOCOL</span>
        <h1 class="brand-name">ASCII <em>DISTRICT</em></h1>
      </div>
      <div class="head-status">LINKED</div>
    </header>

    <section class="city-frame" id="city-frame" aria-label="可行走的工作区城市">
      <canvas id="city-canvas" aria-hidden="true"></canvas>

      <div class="frame-chrome" aria-hidden="true">
        <div class="frame-topline">
          <span class="frame-label">W/S WALK · A/D STRAFE</span>
          <span class="frame-coordinate" id="frame-coordinate">Z:0000</span>
        </div>
        <div class="crosshair"></div>
        <div class="horizon-tag">280PX // HARD LIMIT</div>
      </div>

      <div class="projection-layer" id="workspace-layer" aria-label="工作区地标"></div>
      <div class="session-layer" id="session-layer" aria-label="当前工作区会话入口"></div>

      <button class="map-toggle" type="button" id="map-toggle" aria-expanded="false" aria-controls="city-map">
        CITY INDEX
        <span class="key-hint">M · 18</span>
      </button>
    </section>

    <section class="city-map" id="city-map" aria-hidden="true" aria-label="全部工作区与会话索引">
      <header class="map-head">
        <div>
          <span class="map-kicker">SEMANTIC OVERLAY / 4 DISTRICTS</span>
          <h2>ALL SESSION PORTALS</h2>
        </div>
        <button class="map-close" type="button" id="map-close" aria-label="关闭城市索引">×</button>
      </header>
      <div class="map-body" id="map-body" role="tree"></div>
    </section>
  </aside>

  <main class="host-field" aria-hidden="true">
    <span><strong>280 PX</strong>SIDEBAR PROTOTYPE BOUNDARY<br />HOST APPLICATION INTENTIONALLY EMPTY</span>
  </main>

  <script>
    const WORKSPACES = [
      {
        id: "deepseek-zion",
        code: "Z-01",
        name: "deepseek-zion",
        color: "#42ff85",
        x: -52,
        z: 230,
        sessions: [
          { id: "sidebar-redesign", title: "重新设计多工作区会话栏", time: "现在", status: "streaming" },
          { id: "read-project", title: "阅读项目说明文件", time: "21小时", status: "ready" },
          { id: "neural-link", title: "接入会话脑机链路与动态锚点", time: "1天", status: "tool" },
          { id: "scroll-fix", title: "修复侧栏滚动定位漂移", time: "2天", status: "error" }
        ]
      },
      {
        id: "claude-code-toolkit",
        code: "C-07",
        name: "claude-code-toolkit",
        color: "#ff9e42",
        x: 54,
        z: 570,
        sessions: [
          { id: "github-update", title: "更新到 GitHub 最新提交", time: "3天", status: "ready" },
          { id: "hook-audit", title: "Hook 启动配置与官方文档核验", time: "5天", status: "thinking" },
          { id: "launcher", title: "重构 Claude Launcher 启动协议", time: "6天", status: "ready" }
        ]
      },
      {
        id: "skills-guide",
        code: "S-12",

    // hover 字形扰动：片假名自左向右解码回原标题
    const KATAKANA = "ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉ";
    function scrambleOnHover(el) {
      el.addEventListener("mouseenter", () => {

        const original = el.textContent;

        const timer = setInterval(() => {
          el.textContent = original.split("").map((char, index) =>
            index < step ? char : (char !== " " && Math.random() < 0.5 ? KATAKANA[Math.random() * KATAKANA.length | 0] : char)
          ).join("");
          step += 1;
          if (step > original.length) {
            clearInterval(timer);
            el.textContent = original;
          }
        }, 28);

    }

    // Matrix-Code.ttf only maps this deliberate glyph set. Keep canvas text inside it.
    const MATRIX_GLYPHS = "アウエオカキケコサシスセソタツテナニヌネハヒホマミムメモヤヨラリワー012345789*+<>:|";
    const ARCH_GLYPHS = "|<>:+*";
    const BUILDING_HEIGHT = 184;
    const CAMERA_STRAFE_RADIUS = 30;
    // Portal 从建筑立面浮起的世界距离：全息投影光束的锥长
    const PORTAL_LIFT = 26;

    const canvas = document.querySelector("#city-canvas");

    const state = {

    // ── 程序化街区填充建筑（种子确定性，纯视觉，无交互）──
    function mulberry32(seed) {
      return function () {
        seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    // 填充建筑四档绿色，按楼着色（近 matrix 色系，深浅错落）
    const CITY_TINTS = ["63,255,120", "46,232,154", "89,255,94", "52,255,196"];
    const cityPoints = [];
    (function buildCityBlocks() {
      const rand = mulberry32(20260828);
      for (let zBlock = 120; zBlock < 1560; zBlock += 118) {
        [-1, 1].forEach((side) => {
          [0, 1].forEach((row) => {
            if (rand() < 0.1) return; // 留出空隙，避免密不透风
            const w = 40 + rand() * 50;
            const h = 60 + rand() * 170;
            const d = 28 + rand() * 34;
            const x = side * (96 + row * 74 + rand() * 36);
            const z = zBlock + rand() * 40;
            const tint = CITY_TINTS[Math.floor(rand() * CITY_TINTS.length)];
            const cols = Math.max(2, Math.round(w / 11));
            const rows = Math.max(3, Math.round(h / 13));
            for (let yi = 0; yi <= rows; yi += 1) {
              for (let xi = 0; xi <= cols; xi += 1) {
                const edge = xi === 0 || xi === cols || yi === rows;
                if (!edge && rand() < 0.35) continue; // 暗窗留白
                cityPoints.push({
                  x: x - w / 2 + xi * (w / cols),
                  y: yi * (h / rows),
                  z,
                  seed: xi * 13 + yi * 29 + Math.round(x) + Math.round(z),
                  energy: edge ? 0.9 : (rand() < 0.5 ? 0.5 : 0.22),
                  edge,
                  flicker: rand() < 0.18,
                  tint
                });
              }
            }
            // 侧面进深列：给楼体体积感
            const sideX = x + (side > 0 ? w / 2 : -w / 2);
            for (let zi = 1; zi <= 3; zi += 1) {
              for (let yi = 0; yi <= rows; yi += 2) {
                cityPoints.push({
                  x: sideX,
                  y: yi * (h / rows),
                  z: z + zi * (d / 3),
                  seed: zi * 7 + yi * 11 + Math.round(x),
                  energy: 0.3,
                  edge: false,
                  flicker: false,
                  tint
                });
              }
            }
            // 屋顶天线亮点
            const antennas = 1 + Math.floor(rand() * 2.4);
            for (let a = 0; a < antennas; a += 1) {
              cityPoints.push({
                x: x - w / 3 + rand() * (w * 2 / 3),
                y: h + 4 + rand() * 10,
                z,
                seed: a * 31 + Math.round(z),
                energy: 1,
                edge: true,
                flicker: true,
                tint
              });
            }
          });
        });
      }
    })();
    const rainColumns = [];
    const workspaceMarkers = new Map();
    let sessionButtons = [];
    let previousTime = performance.now();
    let lastActiveWorkspace = -1;

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function mix(a, b, amount) {
      return a + (b - a) * amount;
    }

    function workspaceCameraBounds(index = state.activeWorkspace) {
      const center = WORKSPACES[index]?.x ?? 0;
      return {
        min: center - CAMERA_STRAFE_RADIUS,
        max: center + CAMERA_STRAFE_RADIUS
      };
    }

    function centerCameraOnWorkspace(index, snap = false) {
      state.targetX = WORKSPACES[index].x;
      if (snap) state.cameraX = state.targetX;
    }

    function stableGlyph(seed, alphabet = MATRIX_GLYPHS) {
      const value = Math.abs(Math.sin(seed * 12.9898 + 78.233) * 43758.5453);
      return alphabet[Math.floor((value % 1) * alphabet.length)];
    }

    function hexToRgb(hex) {
      const clean = hex.replace("#", "");
      return {
        r: parseInt(clean.slice(0, 2), 16),
        g: parseInt(clean.slice(2, 4), 16),
        b: parseInt(clean.slice(4, 6), 16)
      };
    }

    function rgba(hex, alpha) {
      const color = hexToRgb(hex);
      return `rgba(${color.r}, ${color.g}, ${color.b}, ${alpha})`;
    }

    function createBuildingPoints(workspace, workspaceIndex) {
      const points = [];
      const width = 100;
      const height = BUILDING_HEIGHT;
      const depth = 74;
      const xSteps = 13;
      const ySteps = 22;

      for (let yi = 0; yi <= ySteps; yi += 1) {
        const y = yi * (height / ySteps);
        for (let xi = 0; xi <= xSteps; xi += 1) {
          const x = -width / 2 + xi * (width / xSteps);
          const edge = xi === 0 || xi === xSteps || yi === 0 || yi === ySteps;
          const windowBand = yi > 2 && yi < ySteps - 2 && yi % 3 !== 0 && xi > 1 && xi < xSteps - 1;
          if (!edge && !windowBand && (xi + yi) % 4 !== 0) continue;
          points.push({
            x: workspace.x + x,
            y,
            z: workspace.z,
            glyph: edge ? stableGlyph(xi + yi * 3 + workspaceIndex, "|<>+") : stableGlyph(xi * 7 + yi * 11 + workspaceIndex),
            energy: edge ? 0.92 : (windowBand ? 0.52 : 0.28),
            workspaceIndex
          });
        }
      }

      for (let zi = 1; zi <= 8; zi += 1) {
        const z = workspace.z + zi * (depth / 8);
        for (let yi = 0; yi <= ySteps; yi += 2) {
          const y = yi * (height / ySteps);
          [-width / 2, width / 2].forEach((side, sideIndex) => {
            points.push({
              x: workspace.x + side,
              y,
              z,
              glyph: stableGlyph(zi * 17 + yi * 5 + sideIndex + workspaceIndex, ARCH_GLYPHS),
              energy: 0.42,
              workspaceIndex
            });
          });
        }
      }

      workspace.sessions.forEach((session, sessionIndex) => {
        const y = 127 - sessionIndex * 21;
        const status = STATUS[session.status];
        for (let xi = -5; xi <= 5; xi += 1) {
          points.push({
            x: workspace.x + xi * 7.2,
            y,
            z: workspace.z - 0.5,
            glyph: xi === -5 || xi === 5 ? status.glyph : stableGlyph(sessionIndex * 19 + xi + workspaceIndex),
            energy: 1,
            workspaceIndex,
            sessionIndex,
            statusColor: status.color
          });
        }
      });

      return points;
    }

    function project(x, y, z) {
      const depth = z - state.cameraZ;
      if (depth <= 18) return null;
      const focal = Math.min(232, state.height * 0.49);
      const scale = focal / depth;
      return {
        x: state.width / 2 + (x - state.cameraX) * scale,
        y: state.height / 2 - (y - BUILDING_HEIGHT / 2) * scale,
        depth,
        scale
      };
    }

    function resizeCanvas() {
      const bounds = frame.getBoundingClientRect();
      state.width = Math.round(bounds.width);
      state.height = Math.round(bounds.height);
      state.dpr = Math.min(2, window.devicePixelRatio || 1);
      canvas.width = Math.round(state.width * state.dpr);
      canvas.height = Math.round(state.height * state.dpr);
      canvas.style.width = `${state.width}px`;
      canvas.style.height = `${state.height}px`;
      context.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
      initRain();
    }

    function initRain() {
      rainColumns.length = 0;
      const step = 10;
      for (let x = 4; x < state.width; x += step) {
        rainColumns.push({
          x,
          offset: (x * 19.3) % Math.max(1, state.height),
          speed: 15 + ((x * 7) % 29),
          length: 5 + (x % 7),
          seed: x * 0.31
        });
      }
    }

    function drawBackground(time) {
      const gradient = context.createLinearGradient(0, 0, 0, state.height);
      gradient.addColorStop(0, "#010705");
      gradient.addColorStop(0.48, "#020a06");
      gradient.addColorStop(1, "#010302");
      context.fillStyle = gradient;
      context.fillRect(0, 0, state.width, state.height);

      const focusFactor = state.experience === "focus" ? 0.3 : 1;
      const reducedTime = state.experience === "reduced" ? 0 : time;
      context.font = '10px "Matrix Code"';
      context.textAlign = "center";
      context.textBaseline = "middle";

      rainColumns.forEach((column, columnIndex) => {
        const head = (column.offset + reducedTime * 0.001 * column.speed) % (state.height + 120) - 60;
        for (let trail = 0; trail < column.length; trail += 1) {
          const y = head - trail * 11;
          if (y < -12 || y > state.height + 12) continue;
          const energy = (1 - trail / column.length) * 0.23 * focusFactor;
          const glyph = stableGlyph(column.seed + trail * 13 + Math.floor(reducedTime / 760) + columnIndex);
          context.fillStyle = trail === 0
            ? `rgba(220, 255, 229, ${0.32 * focusFactor})`
            : `rgba(47, 255, 105, ${energy})`;
          context.fillText(glyph, column.x, y);
        }
      });

      const horizon = state.height / 2;
      const haze = context.createRadialGradient(state.width / 2, horizon, 0, state.width / 2, horizon, state.width * 0.72);
      haze.addColorStop(0, "rgba(68,255,123,0.12)");
      haze.addColorStop(0.35, "rgba(30,112,55,0.035)");
      haze.addColorStop(1, "rgba(0,0,0,0)");
      context.fillStyle = haze;
      context.fillRect(0, horizon - 100, state.width, 210);
    }

    function drawWorldLine(a, b, color, width = 1) {
      const start = project(a.x, a.y, a.z);
      const end = project(b.x, b.y, b.z);
      if (!start || !end) return;
      context.beginPath();
      context.moveTo(start.x, start.y);
      context.lineTo(end.x, end.y);
      context.strokeStyle = color;
      context.lineWidth = width;
      context.stroke();
    }

    // 代码街道：6 条车道字形流向相机流动（世界锚定 + 时间相位），
    // 街区边界横向路口带，远端汇聚线维持透视引导
    function drawStreet(time) {
      const flow = state.experience === "reduced" ? 0 : time;
      const flowTick = Math.floor(flow * 0.02);
      context.font = '9px "Matrix Code"';
      context.textAlign = "center";
      context.textBaseline = "middle";

      const lanes = [-44, -26, -10, 10, 26, 44];
      const firstRow = Math.floor((state.cameraZ + 30) / 24);
      const rowCount = Math.ceil(1420 / 24);
      for (let r = rowCount; r >= 0; r--) {
        const wz = (firstRow + r) * 24;
        const depth = wz - state.cameraZ;
        if (depth < 30 || depth > 1450) continue;
        const alpha = clamp(0.62 - depth / 2400, 0.05, 0.5);
        for (let lane = 0; lane < lanes.length; lane++) {
          const point = project(lanes[lane], 0, wz);
          if (!point || point.y < -12 || point.y > state.height + 16) continue;
          const inner = lane === 2 || lane === 3;
          context.fillStyle = inner
            ? `rgba(217,255,229,${alpha * 0.5})`
            : `rgba(57,255,115,${alpha})`;
          context.fillText(stableGlyph(firstRow + r + lane * 17 + flowTick, inner ? ":*" : "|+"), point.x, point.y);
        }
      }

      // 路口横向字形带（世界锚定，与街区同距 118）
      const firstBand = Math.ceil((state.cameraZ + 40) / 118);
      for (let b = firstBand; b * 118 < state.cameraZ + 1450; b++) {
        const wz = b * 118;
        const depth = wz - state.cameraZ;
        const alpha = clamp(0.4 - depth / 2600, 0.04, 0.34);
        for (let x = -90; x <= 90; x += 9) {
          const point = project(x, 0.5, wz);
          if (!point || point.y < 0 || point.y > state.height + 12) continue;
          context.fillStyle = `rgba(83,255,135,${alpha})`;
          context.fillText(stableGlyph(x * 3 + b * 7 + flowTick, "<>+"), point.x, point.y);
        }
      }

      const farZ = state.cameraZ + 1500;
      [-62, -34, 34, 62].forEach((x, index) => {
        drawWorldLine(
          { x, y: 0, z: state.cameraZ + 24 },
          { x: x * 0.35, y: 0, z: farZ },
          index === 1 || index === 2 ? "rgba(83,255,135,0.3)" : "rgba(83,255,135,0.08)"
        );
      });
    }

    // 填充建筑：远→近 painter 排序，深度降密度，字号分桶减少 font 切换
    function drawCityBlocks(time) {
      const tick = Math.floor((state.experience === "reduced" ? 0 : time) / 300);
      const drawable = [];
      for (const p of cityPoints) {
        const depth = p.z - state.cameraZ;
        if (depth <= 18 || depth > 1500) continue;
        if (depth > 1100 && !p.edge) continue;   // 极远只画轮廓
        if (depth > 700 && (p.seed & 1)) continue; // 中远隔点
        const point = project(p.x, p.y, p.z);
        if (!point) continue;
        if (point.x < -10 || point.x > state.width + 10 || point.y < -10 || point.y > state.height + 10) continue;
        drawable.push({ p, point, depth });
      }
      drawable.sort((a, b) => b.depth - a.depth);

      context.textAlign = "center";
      context.textBaseline = "middle";
      let lastSize = 0;
      for (const { p, point, depth } of drawable) {
        const size = depth < 400 ? 8 : depth < 800 ? 6.5 : 5.5;
        if (size !== lastSize) {
          context.font = `${size}px "Matrix Code"`;
          lastSize = size;
        }
        const fade = clamp(1 - depth / 1600, 0.08, 0.85);
        const glyph = stableGlyph(p.seed + (p.flicker ? tick : 0), p.edge ? ARCH_GLYPHS : MATRIX_GLYPHS);
        context.fillStyle = `rgba(${p.tint},${fade * p.energy * 0.85})`;
        context.fillText(glyph, point.x, point.y);
      }
    }

    // 远景天际线：cameraZ+1500 处的暗绿楼群剪影，高低错落慢闪烁
    function drawSkyline(time) {
      const tick = Math.floor((state.experience === "reduced" ? 0 : time) / 800);
      context.font = '7px "Matrix Code"';
      context.textAlign = "center";
      context.textBaseline = "middle";
      const z = state.cameraZ + 1500;
      for (let x = -420; x <= 420; x += 20) {
        const hSeed = Math.abs(Math.sin(x * 12.9898) * 43758.5453) % 1;
        const h = 60 + hSeed * 160;
        for (let y = 0; y < h; y += 20) {
          const point = project(x, y, z);
          if (!point || point.x < -8 || point.x > state.width + 8) continue;
          context.fillStyle = `rgba(47,255,105,${0.07 + hSeed * 0.1})`;
          context.fillText(stableGlyph(x + y * 3 + (hSeed > 0.7 ? tick : 0), "|+:"), point.x, point.y);
        }
      }
    }

    // 天空数据流：高空水平亮绿字形流，周期性快速掠过
    function drawSkyStreams(time) {
      if (state.experience === "reduced") return;
      context.font = '8px "Matrix Code"';
      context.textAlign = "center";
      context.textBaseline = "middle";
      for (let i = 0; i < 4; i++) {
        const period = 9000 + i * 2600;
        const phase = (time + i * 3700) % period;
        if (phase > 2600) continue;
        const progress = phase / 2600;
        const headX = -340 + progress * 680;
        const y = 215 + i * 26;
        const z = state.cameraZ + 520 + i * 180;
        const envelope = Math.sin(progress * Math.PI);
        for (let k = 0; k < 14; k++) {
          const point = project(headX - k * 13, y, z);
          if (!point || point.x < -10 || point.x > state.width + 10 || point.y < -8 || point.y > state.height + 8) continue;
          const alpha = envelope * (1 - k / 14) * 0.5;
          context.fillStyle = k === 0
            ? `rgba(217,255,229,${alpha})`
            : `rgba(104,233,221,${alpha * 0.8})`;
          context.fillText(stableGlyph(k * 7 + i * 13 + Math.floor(time / 120)), point.x, point.y);
        }
      }
    }

    function drawBuildingShell(workspace, workspaceIndex) {
      const active = workspaceIndex === state.activeWorkspace;
      const width = 100;
      const height = BUILDING_HEIGHT;
      const depth = 74;
      const front = [
        project(workspace.x - width / 2, 0, workspace.z),
        project(workspace.x + width / 2, 0, workspace.z),
        project(workspace.x + width / 2, height, workspace.z),
        project(workspace.x - width / 2, height, workspace.z)
      ];
      if (front.some((point) => !point)) return;

      context.beginPath();
      context.moveTo(front[0].x, front[0].y);
      front.slice(1).forEach((point) => context.lineTo(point.x, point.y));
      context.closePath();
      context.fillStyle = active ? rgba(workspace.color, 0.055) : "rgba(3,14,8,0.09)";
      context.fill();
      context.strokeStyle = active ? rgba(workspace.color, 0.36) : "rgba(69,181,100,0.12)";
      context.lineWidth = active ? 1 : 0.6;
      context.stroke();

      const side = workspace.x < 0 ? width / 2 : -width / 2;
      drawWorldLine(
        { x: workspace.x + side, y: 0, z: workspace.z },
        { x: workspace.x + side, y: 0, z: workspace.z + depth },
        rgba(workspace.color, active ? 0.38 : 0.15)
      );
      drawWorldLine(
        { x: workspace.x + side, y: height, z: workspace.z },
        { x: workspace.x + side, y: height, z: workspace.z + depth },
        rgba(workspace.color, active ? 0.3 : 0.12)
      );
    }

    function drawBuildings(time) {
      const drawable = [];

      WORKSPACES.forEach((workspace, workspaceIndex) => {
        drawBuildingShell(workspace, workspaceIndex);
        buildingPoints[workspaceIndex].forEach((point) => {
          const projected = project(point.x, point.y, point.z);
          if (!projected) return;
          if (projected.x < -12 || projected.x > state.width + 12 || projected.y < -12 || projected.y > state.height + 12) return;
          drawable.push({ point, projected, workspace });
        });
      });

      drawable.sort((a, b) => b.projected.depth - a.projected.depth);
      context.textAlign = "center";
      context.textBaseline = "middle";

      drawable.forEach(({ point, projected, workspace }) => {
        const active = point.workspaceIndex === state.activeWorkspace;
        const size = clamp(5.5 + projected.scale * 5.8, 5.8, 13.5);
        const depthFade = clamp(1 - projected.depth / 1700, 0.11, 0.88);
        const pulse = state.experience === "cinematic" && point.sessionIndex !== undefined
          ? 0.78 + Math.sin(time * 0.004 + point.sessionIndex) * 0.22
          : 1;
        const alpha = depthFade * point.energy * (active ? 1 : 0.68) * pulse;
        context.font = `${size}px "Matrix Code"`;
        context.fillStyle = point.statusColor
          ? rgba(point.statusColor, alpha)
          : rgba(workspace.color, alpha);
        context.fillText(point.glyph, projected.x, projected.y);
      });
    }

    // Portal 投射口：建筑立面会话带中心的一小段高亮横线（Portal 全息投影的发射口）
    function drawPortalBeams() {
      const workspace = WORKSPACES[state.activeWorkspace];
      if (!workspace) return;
      const buildingDepth = workspace.z - state.cameraZ;
      if (buildingDepth < 56 || buildingDepth > 510) return;
      const alphaScale = clamp(1.2 - Math.abs(buildingDepth - 225) / 370, 0.22, 1);

      workspace.sessions.forEach((session, sessionIndex) => {
        const y = 127 - sessionIndex * 21;
        const back = project(workspace.x, y, workspace.z);
        if (!back) return;
        const color = STATUS[session.status].color;

        // 立面投射口：一小段高亮横线
        context.strokeStyle = rgba(color, 0.5 * alphaScale);
        context.lineWidth = 1;
        context.beginPath();
        context.moveTo(back.x - 6 * back.scale, back.y);
        context.lineTo(back.x + 6 * back.scale, back.y);
        context.stroke();
      });
    }

    function drawDepthFog() {
      const fog = context.createLinearGradient(0, 0, 0, state.height);
      fog.addColorStop(0, "rgba(0,3,2,0.18)");
      fog.addColorStop(0.38, "rgba(0,0,0,0)");
      fog.addColorStop(1, "rgba(0,3,1,0.36)");
      context.fillStyle = fog;
      context.fillRect(0, 0, state.width, state.height);
    }

    function renderCanvas(time) {
      drawBackground(time);
      drawSkyline(time);
      drawStreet(time);
      drawCityBlocks(time);
      drawBuildings(time);
      drawPortalBeams();
      drawSkyStreams(time);
      drawDepthFog();
    }

    function createWorkspaceMarkers() {
      workspaceLayer.replaceChildren();
      WORKSPACES.forEach((workspace, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "district-marker";
        button.style.setProperty("--workspace-color", workspace.color);
        button.setAttribute("aria-label", `前往工作区 ${workspace.name}，${workspace.sessions.length} 个会话`);

        const code = document.createElement("span");
        code.className = "code";
        code.textContent = workspace.code;
        const name = document.createElement("span");
        name.className = "name";
        name.textContent = workspace.name;
        const count = document.createElement("span");
        count.className = "count";
        count.textContent = String(workspace.sessions.length).padStart(2, "0");

        button.append(code, name, count);
        button.addEventListener("click", () => navigateToWorkspace(index));
        workspaceLayer.append(button);
        workspaceMarkers.set(workspace.id, button);
      });
    }

    function rebuildSessionPortals() {
      const workspace = WORKSPACES[state.activeWorkspace];
      sessionLayer.replaceChildren();
      sessionButtons = workspace.sessions.map((session, sessionIndex) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "session-portal";
        button.textContent = session.title;
        button.dataset.slot = String(sessionIndex + 1).padStart(2, "0");
        button.style.setProperty("--status-color", STATUS[session.status].color);
        button.title = `${session.title} · ${STATUS[session.status].label} · ${session.time}`;
        button.setAttribute("aria-label", `${session.title}，${STATUS[session.status].label}，${session.time}`);
        if (state.selectedWorkspace === state.activeWorkspace && state.selectedSessionId === session.id) {
          button.classList.add("is-current");
        }
        button.addEventListener("click", () => selectSession(state.activeWorkspace, session.id));
        sessionLayer.append(button);
        return button;
      });
    }

    function updateProjectedDom() {
      WORKSPACES.forEach((workspace, index) => {
        const marker = workspaceMarkers.get(workspace.id);
        const point = project(workspace.x, 203, workspace.z);
        if (!point || point.depth > 1500 || point.x < -100 || point.x > state.width + 100) {
          marker.style.opacity = "0";
          marker.style.pointerEvents = "none";
          return;
        }

        const scale = clamp(point.scale, 0.58, 1.08);
        marker.style.left = `${point.x}px`;
        marker.style.top = `${point.y}px`;
        marker.style.opacity = String(clamp(1 - point.depth / 1750, 0.2, 0.96));
        marker.style.transform = `translate(-50%, -100%) scale(${scale})`;
        marker.style.pointerEvents = "auto";
        marker.classList.toggle("is-active", index === state.activeWorkspace);
      });

      const workspace = WORKSPACES[state.activeWorkspace];
      const buildingDepth = workspace.z - state.cameraZ;
      // 穿越时纵向压缩：投影 scale 越大，Portal 的 y 越向建筑中线收拢，屏幕间距近似恒定
      const centerAnchor = project(workspace.x, BUILDING_HEIGHT / 2, workspace.z - PORTAL_LIFT);
      sessionButtons.forEach((button, sessionIndex) => {
        const y = 127 - sessionIndex * 21;
        const point = project(workspace.x, y, workspace.z - PORTAL_LIFT);
        if (!point || buildingDepth < 56 || buildingDepth > 510) {
          button.style.opacity = "0";
          button.style.pointerEvents = "none";
          return;
        }
        const spread = clamp(1.5 / point.scale, 0.55, 1);
        const screenY = centerAnchor ? centerAnchor.y + (point.y - centerAnchor.y) * spread : point.y;
        if (screenY < 24 || screenY > state.height - 50) {
          button.style.opacity = "0";
          button.style.pointerEvents = "none";
          return;
        }
        const scale = clamp(point.scale, 0.72, 1.04) * (1 + (state.motion || 0) * 0.1);
        const width = clamp(130 * scale + 28, 132, 182);
        button.style.width = `${width}px`;
        button.style.left = `${point.x}px`;
        button.style.top = `${screenY}px`;
        // 运动中：透明度下限抬到 0.85，深度衰减几乎拉平，Portal 保持醒目
        const base = clamp(1.2 - Math.abs(buildingDepth - 225) / 370, 0.22, 1);
        button.style.opacity = String(mix(base, 1, (state.motion || 0) * 0.9));
        button.style.transform = `translate(-50%, -50%) scale(${scale})`;
        button.style.pointerEvents = "auto";
      });

      coordinateLabel.textContent = `Z:${String(Math.round(state.cameraZ + 100)).padStart(4, "0")} X:${Math.round(state.cameraX)}`;
    }

    function closestWorkspaceIndex() {
      let bestIndex = 0;
      let bestDistance = Infinity;
      WORKSPACES.forEach((workspace, index) => {
        const distance = Math.abs(state.cameraZ - (workspace.z - 230));
        if (distance < bestDistance) {
          bestDistance = distance;
          bestIndex = index;
        }
      });
      return bestIndex;
    }

    function syncActiveWorkspaceFromCamera() {
      const next = closestWorkspaceIndex();
      if (next === state.activeWorkspace) return;
      state.activeWorkspace = next;
      centerCameraOnWorkspace(next, state.experience === "reduced");
      rebuildSessionPortals();
    }

    function navigateToWorkspace(index, selectFirst = false) {
      const workspace = WORKSPACES[index];
      state.activeWorkspace = index;
      state.targetZ = workspace.z - 230;
      centerCameraOnWorkspace(index, state.experience === "reduced");
      if (state.experience === "reduced") {
        state.cameraZ = state.targetZ;
      }
      if (selectFirst) selectSession(index, workspace.sessions[0].id);
      rebuildSessionPortals();
    }

    function selectSession(workspaceIndex, sessionId) {
      const workspace = WORKSPACES[workspaceIndex];
      const session = workspace.sessions.find((item) => item.id === sessionId);
      if (!session) return;
      state.selectedWorkspace = workspaceIndex;
      state.selectedSessionId = session.id;
      if (state.activeWorkspace !== workspaceIndex) navigateToWorkspace(workspaceIndex);
      rebuildSessionPortals();
      updateMapSelection();
    }

    function buildMap() {
      mapBody.replaceChildren();
      WORKSPACES.forEach((workspace, workspaceIndex) => {
        const district = document.createElement("section");
        district.className = "map-district";
        district.setAttribute("role", "group");
        district.setAttribute("aria-label", workspace.name);

        const head = document.createElement("button");
        head.type = "button";
        head.className = "map-district-head";
        const headLabel = document.createElement("span");
        headLabel.textContent = `BAY ${String(workspaceIndex + 1).padStart(2, "0")} · ${workspace.name}`;
        const headCount = document.createElement("span");
        headCount.className = "count";
        headCount.textContent = String(workspace.sessions.length).padStart(2, "0");
        head.append(headLabel, headCount);
        head.addEventListener("click", () => {
          navigateToWorkspace(workspaceIndex);
          closeMap();
        });

        const list = document.createElement("ul");
        list.className = "map-session-list";
        list.setAttribute("role", "group");
        workspace.sessions.forEach((session) => {
          const item = document.createElement("li");
          item.setAttribute("role", "none");
          const button = document.createElement("button");
          button.type = "button";
          button.className = "map-session-button";
          button.dataset.workspaceIndex = String(workspaceIndex);
          button.dataset.sessionId = session.id;
          button.style.setProperty("--status-color", STATUS[session.status].color);
          button.setAttribute("role", "treeitem");
          button.setAttribute("aria-label", `${workspace.name}，${session.title}，${STATUS[session.status].label}，${session.time}`);
          button.title = `${session.title} · ${STATUS[session.status].label} · ${session.time}`;
          const cursor = document.createElement("span");
          cursor.className = "cur";
          cursor.textContent = ">";
          const title = document.createElement("span");
          title.className = "title";
          title.textContent = session.title;
          const age = document.createElement("span");
          age.className = "age";
          age.textContent = session.time;
          button.append(cursor, document.createRange().createContextualFragment(SYM[session.status]), title, age);
          scrambleOnHover(title);
          button.addEventListener("click", () => {
            selectSession(workspaceIndex, session.id);
            navigateToWorkspace(workspaceIndex);
            closeMap();
          });
          item.append(button);
          list.append(item);
        });

        district.append(head, list);
        mapBody.append(district);
      });
      updateMapSelection();
    }

    function updateMapSelection() {
      mapBody.querySelectorAll(".map-session-button").forEach((button) => {
        const isCurrent = Number(button.dataset.workspaceIndex) === state.selectedWorkspace
          && button.dataset.sessionId === state.selectedSessionId;
        button.classList.toggle("is-current", isCurrent);
        button.setAttribute("aria-current", isCurrent ? "page" : "false");
      });
    }

    function openMap() {
      state.mapOpen = true;
      mapPanel.classList.add("is-open");
      mapPanel.setAttribute("aria-hidden", "false");
      mapToggle.setAttribute("aria-expanded", "true");
      const current = mapBody.querySelector(".map-session-button.is-current");
      if (current) {
        current.scrollIntoView({ block: "center" });
        current.focus({ preventScroll: true });
      } else {
        mapClose.focus();
      }
    }

    function closeMap() {
      state.mapOpen = false;
      mapPanel.classList.remove("is-open");
      mapPanel.setAttribute("aria-hidden", "true");
      mapToggle.setAttribute("aria-expanded", "false");
      mapToggle.focus({ preventScroll: true });
    }

    function toggleMap() {
      if (state.mapOpen) closeMap();
      else openMap();
    }

    function moveCamera(direction, amount = 76) {
      if (direction === "forward") state.targetZ += amount;
      if (direction === "back") state.targetZ -= amount;
      if (direction === "left") state.targetX -= 13;
      if (direction === "right") state.targetX += 13;
      state.targetZ = clamp(state.targetZ, -15, WORKSPACES.at(-1).z - 128);
      if (direction === "left" || direction === "right") {
        const bounds = workspaceCameraBounds();
        state.targetX = clamp(state.targetX, bounds.min, bounds.max);
      }
      if (state.experience === "reduced") {
        state.cameraZ = state.targetZ;
        state.cameraX = state.targetX;
        syncActiveWorkspaceFromCamera();
      }
    }

    function setExperience(experience) {
      state.experience = experience;
      document.body.dataset.experience = experience;
      if (experience === "reduced") {
        state.cameraZ = state.targetZ;
        state.cameraX = state.targetX;
      }
    }

    function handleKeydown(event) {
      if (event.target.matches("input, textarea, [contenteditable]")) return;
      if (event.key === "Escape" && state.mapOpen) {
        event.preventDefault();
        closeMap();
        return;
      }
      if (event.key.toLowerCase() === "m") {
        event.preventDefault();
        toggleMap();
        return;
      }
      if (state.mapOpen) return;
      const key = event.key.toLowerCase();
      const directions = {
        w: "forward",
        arrowup: "forward",
        s: "back",
        arrowdown: "back",
        a: "left",
        arrowleft: "left",
        d: "right",
        arrowright: "right"
      };
      const direction = directions[key];
      if (!direction) return;
      event.preventDefault();
      moveCamera(direction);
    }

    function animate(time) {
      const delta = Math.min(0.05, (time - previousTime) / 1000);
      previousTime = time;
      const smoothing = state.experience === "reduced" ? 1 : 1 - Math.pow(0.001, delta);
      const prevZ = state.cameraZ;
      const prevX = state.cameraX;
      state.cameraZ = mix(state.cameraZ, state.targetZ, smoothing);
      state.cameraX = mix(state.cameraX, state.targetX, smoothing);
      // 相机运动能量：位移速度 → 0..1 平滑值，驱动 Portal 动态凸显
      const speed = Math.hypot(state.cameraZ - prevZ, state.cameraX - prevX) / Math.max(delta, 0.001);
      const motionTarget = state.experience === "reduced" ? 0 : clamp(speed / 260, 0, 1);
      state.motion = mix(state.motion || 0, motionTarget, 1 - Math.pow(0.01, delta));
      syncActiveWorkspaceFromCamera();
      renderCanvas(time);
      updateProjectedDom();
      requestAnimationFrame(animate);
    }

    frame.addEventListener("wheel", (event) => {
      if (state.mapOpen) return;
      event.preventDefault();
      const amount = clamp(event.deltaY * 0.32, -105, 105);
      state.targetZ = clamp(state.targetZ + amount, -15, WORKSPACES.at(-1).z - 128);
    }, { passive: false });

    frame.addEventListener("pointerdown", (event) => {
      if (event.target.closest("button")) return;
      state.dragging = true;
      state.pointerX = event.clientX;
      state.pointerY = event.clientY;
      frame.setPointerCapture(event.pointerId);
    });

    frame.addEventListener("pointermove", (event) => {
      if (!state.dragging) return;
      const dx = event.clientX - state.pointerX;
      const dy = event.clientY - state.pointerY;
      state.pointerX = event.clientX;
      state.pointerY = event.clientY;
      const bounds = workspaceCameraBounds();
      state.targetX = clamp(state.targetX - dx * 0.23, bounds.min, bounds.max);
      state.targetZ = clamp(state.targetZ + dy * 0.72, -15, WORKSPACES.at(-1).z - 128);
    });

    frame.addEventListener("pointerup", (event) => {
      state.dragging = false;
      if (frame.hasPointerCapture(event.pointerId)) frame.releasePointerCapture(event.pointerId);
    });

    mapToggle.addEventListener("click", toggleMap);
    mapClose.addEventListener("click", closeMap);
    document.addEventListener("keydown", handleKeydown);

    const observer = new ResizeObserver(resizeCanvas);
    observer.observe(frame);

    createWorkspaceMarkers();
    rebuildSessionPortals();
    buildMap();
    setExperience(state.experience);
    resizeCanvas();
    if (new URLSearchParams(location.search).has("map")) openMap();
    // ?z=<number> 调试参数：定格相机纵深，用于截图验证
    const debugZ = parseFloat(new URLSearchParams(location.search).get("z"));
    if (!Number.isNaN(debugZ)) {
      state.cameraZ = debugZ;
      state.targetZ = debugZ;
    }

    document.fonts.load('12px "Matrix Code"').finally(() => {
      requestAnimationFrame(animate);
    });
  </script>
</body>
</html>
