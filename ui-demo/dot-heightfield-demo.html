<!doctype html>
<meta charset="utf-8">
<title>dot heightfield — 5 stages</title>
<style>
  html,body{margin:0;background:#f5f6f3}
  body{height:600vh}
  canvas{position:fixed;inset:0;display:block}
  .hud{position:fixed;left:5vw;top:12vh;pointer-events:none;user-select:none;
    font:600 11px/1.7 ui-monospace,monospace;letter-spacing:.35em;color:#1a1d1a}
  .hud .num{font-size:44px;letter-spacing:.06em;display:block;color:#111}
  .hud .name{font-size:15px;letter-spacing:.5em;color:#3b5bdb}
  .hud .hint{margin-top:18px;color:#9aa39b;letter-spacing:.2em}
  .bar{position:fixed;left:5vw;top:calc(12vh + 130px);width:120px;height:2px;background:#dde1dc}
  .bar i{display:block;height:100%;background:#2ec478;width:0}
</style>
<canvas id="c"></canvas>
<div class="hud">
  <span class="num" id="num">01</span>
  <span class="name" id="name">FLATLINE</span>
  <div class="hint">SCROLL — 滚动切换五段波场</div>
</div>
<div class="bar"><i id="bar"></i></div>
<script>
const cv=document.getElementById('c'),cx=cv.getContext('2d');
let W,H;
function rs(){const d=Math.min(devicePixelRatio||1,1.6);W=innerWidth;H=innerHeight;
  cv.width=W*d;cv.height=H*d;cv.style.width=W+'px';cv.style.height=H+'px';cx.setTransform(d,0,0,d,0,0);}
addEventListener('resize',rs);rs();

// ── 五段波场形态 ─────────────────────────────
const FIELDS=[
 {name:'FLATLINE', fn:(x,z,t)=>                                   // 1 平静微浪
    Math.sin(x*.009+t*.24)*8+Math.sin(z*.013-t*.17)*7+Math.sin((x+z)*.005+t*.13)*6},
 {name:'SWELL',    fn:(x,z,t)=>                                   // 2 长波涌浪
    Math.sin(x*.005+t*.28)*27+Math.sin((x+z)*.0035-t*.16)*17+Math.sin(z*.008+t*.18)*7},
 {name:'RIPPLE',   fn:(x,z,t)=>{                                  // 3 同心涟漪
    const d=Math.hypot(x,z-420);return Math.sin(d*.020-t*.55)*17*Math.min(1,d/170);}},
 {name:'RIDGE',    fn:(x,z,t)=>                                   // 4 锋利山脊
    Math.abs(Math.sin(x*.009+t*.11))*25+Math.abs(Math.sin((x-z)*.005-t*.08))*12-15},
 {name:'SINK',     fn:(x,z,t)=>{                                  // 5 中心沉降
    const d2=x*x+(z-430)*(z-430);
    return -Math.exp(-d2/90000)*48+Math.sin(Math.sqrt(d2)*.014-t*.42)*8;}},
];

const COLS=120,ROWS=60,SP=22;
let t=0,p=0,pT=0;
const qp=new URLSearchParams(location.search).get('p');

function palette(wy,a){            // 高度分色带：绿顶 蓝腰 紫谷
  if(wy>7)  return 'rgba(38,186,110,'+a+')';
  if(wy>-4) return 'rgba(64,104,224,'+a+')';
  return 'rgba(146,104,236,'+a+')';
}
const smooth=x=>x*x*(3-2*x);

let lastPT=0,boost=0;
function frame(){
  if(qp!==null){p=parseFloat(qp)||0;}
  else{
    const max=document.body.scrollHeight-innerHeight;
    pT=Math.min(4,Math.max(0,scrollY/max*4));
    p+=(pT-p)*0.07;                                  // 段间阻尼过渡
  }
  // 滚动注入动量：boost 持续供能+衰减，滚则涌、停则息
  const dpt=pT-lastPT; lastPT=pT;
  boost=Math.min(1.6,boost+Math.abs(dpt)*26);
  boost*=0.94;
  t+=0.006+boost*0.5;

  const i=Math.min(3,Math.floor(p)), f=smooth(p-i);
  const A=FIELDS[i],B=FIELDS[i+1];

  cx.fillStyle='#f5f6f3';cx.fillRect(0,0,W,H);
  const horizon=H*0.14,foc=H*1.0,camH=130;           // 高位俯视
  // 相机随段落前推（行间取模防跳变）
  const dol=p*SP*3, off=Math.floor(dol/SP), frac=dol-off*SP;

  for(let r=ROWS-1;r>=0;r--){
    const z=50+r*SP-frac; if(z<20)continue;
    const wz=(r+off)*SP, s=foc/z;
    const depth=1-r/ROWS;
    const a=0.25+depth*0.75;
    const d0=Math.max(0.8,s*4.2);
    for(let c=0;c<COLS;c++){
      const x=(c-COLS/2)*SP;
      const wy=(A.fn(x,wz,t)*(1-f)+B.fn(x,wz,t)*f)*(1+boost*0.9);
      const sx=W/2+x*s, sy=horizon+(camH-wy)*s;
      if(sx<-8||sx>W+8)continue;
      cx.fillStyle=palette(wy,a);
      cx.fillRect(sx-d0/2,sy-d0/2,d0,d0);
    }
  }
  const cur=Math.round(Math.min(4,Math.max(0,p)));
  document.getElementById('num').textContent='0'+(cur+1);
  document.getElementById('name').textContent=FIELDS[cur].name;
  document.getElementById('bar').style.width=(p/4*100)+'%';
  requestAnimationFrame(frame);
}
frame();
</script>
