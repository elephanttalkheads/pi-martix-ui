<!DOCTYPE html>
<!--
  PROTOTYPE(一次性,验证后即弃)—— agent 回复 UI 逐块重构 · 第 4 块:diff 卡 .diff
  依据:ui-demo/agent-reply-ui-handoff.md §3.4 + 根 DESIGN.md(TOOL END=写入冲击、差异显影、校验环闭合)
  主导隐喻:diff 不是对比表格,而是「一次物理写入在文件上留下的痕迹」
  三个结构互异变体(?variant=A|B|C,浮条 ←→ 切换,↻ 重播):
    A「烧录显影」— 无卡片:新行逐行烧录(白热→冷却成绿),删行焦化消散,最后边框自绘=校验环闭合
    B「变异缝」— 删行向左滑出消散、新行自右滑入,两组之间一条锯齿「变异缝」
    C「光刻」— 一道光束自上而下扫过,diff 行只存在于光束扫过之处(逐行裁切揭示)
  保留底线:符号+颜色双编码、+N −M 统计、MODIFIED 语义、行号列、横向滚动、reduced-motion 直出终态
  (revealedEdits 门控是行为语义,原型不可见,落地时保留)
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROTO · diff 卡</title>
<style>
  @font-face { font-family: 'Sarasa Term SC'; src: url('font/SarasaTermSC-Regular.ttf'); font-display: swap; }
  :root {
    --text-primary: #3dff8f;
    --text-secondary: #23c468;
    --text-tertiary: #1da754;
    --accent: #00ff41;
    --accent-muted: #14b850;
    --bright: #c2ffd9;
    --warning: #ffb000;
    --danger: #ff5555;
    --del-text: #e89a9a;
    --border: rgba(61, 255, 143, 0.18);
    --font: 'Share Tech Mono', 'Sarasa Term SC', ui-monospace, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { background: #010a04; color: var(--text-primary); font-family: var(--font); font-size: 15px; overflow: hidden; }
  body::after {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 50;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.16) 0 1px, transparent 1px 3px);
  }
  .stage { max-width: 820px; margin: 0 auto; padding: 44px 28px; }

  /* 共享:行结构(行号/符号/代码) */
  .dl { display: flex; font-size: 13px; line-height: 1.55; white-space: pre; }
  .ln-no { flex: none; width: 44px; text-align: right; padding-right: 10px; color: var(--text-tertiary); user-select: none; }
  .ln-sign { flex: none; width: 14px; text-align: center; user-select: none; }
  .add .ln-sign { color: var(--accent); }
  .del .ln-sign { color: var(--danger); }
  .add { background: rgba(61, 255, 143, 0.07); }
  .add .ln-code { color: var(--text-primary); }
  .del { background: rgba(255, 85, 85, 0.08); }
  .del .ln-code { color: var(--del-text); }
  .ctx .ln-code { color: var(--text-secondary); }
  .ctx .ln-sign { color: transparent; }
  .dhead { display: flex; align-items: baseline; gap: 10px; font-size: 12px; margin-bottom: 8px; }
  .dfile { color: var(--text-primary); }
  .plus { color: var(--accent-muted); }
  .minus { color: var(--danger); }
  .mod { color: var(--warning); letter-spacing: 0.18em; font-size: 11px; margin-left: auto; }

  /* ================ A:烧录显影 ================ */
  .vA .diff { position: relative; padding: 10px 14px; }
  /* 校验环:全部显影后边框自绘一周(viewBox 100×100 + pathLength 归一化,与像素尺寸解耦) */
  .vA .ring { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .vA .ring rect {
    fill: none; stroke: var(--accent-muted); stroke-width: 1;
    vector-effect: non-scaling-stroke;
    stroke-dasharray: 400; stroke-dashoffset: 400;
    animation: draw 1.2s ease-in-out 1.6s forwards;
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  /* 烧录:白热→冷却成绿;删行:焦化(红→灰烬消散) */
  .vA .add { animation: burn 0.9s ease-out both; }
  @keyframes burn {
    0% { background: rgba(194, 255, 217, 0.28); }
    35% { background: rgba(194, 255, 217, 0.28); text-shadow: 0 0 10px rgba(194, 255, 217, 0.8); }
    100% { background: rgba(61, 255, 143, 0.07); text-shadow: none; }
  }
  .vA .add .ln-code { animation: cool 0.9s ease-out both; }
  @keyframes cool { 0% { color: var(--bright); } 100% { color: var(--text-primary); } }
  .vA .del { animation: char 1.1s ease-out both; }
  @keyframes char {
    0% { opacity: 1; background: rgba(255, 85, 85, 0.22); }
    60% { opacity: 1; background: rgba(255, 85, 85, 0.08); }
    100% { opacity: 0.45; background: rgba(255, 85, 85, 0.03); }
  }

  /* ================ B:变异缝 ================ */
  .vB .diff { border: 1px solid var(--border); padding: 10px 0 12px; }
  .vB .dhead { padding: 0 14px; }
  /* 删行向左滑出消散(停在半隐),新行自右滑入 */
  .vB .del { animation: slideout 0.7s cubic-bezier(0.3, 0, 0.6, 1) both; }
  @keyframes slideout {
    0% { transform: translateX(0); opacity: 1; }
    100% { transform: translateX(-16px); opacity: 0.5; }
  }
  .vB .add { animation: slidein 0.6s cubic-bezier(0.2, 0.8, 0.3, 1) both; }
  @keyframes slidein {
    0% { transform: translateX(22px); opacity: 0; }
    100% { transform: translateX(0); opacity: 1; }
  }
  /* 变异缝:删/增两组之间的锯齿分界 */
  .vB .seam {
    height: 7px; margin: 2px 0;
    background: repeating-linear-gradient(135deg, rgba(255, 85, 85, 0.35) 0 6px, transparent 6px 9px, rgba(61, 255, 143, 0.35) 9px 15px, transparent 15px 18px);
    animation: seamflash 0.8s ease-out 0.5s 1 both;
  }
  @keyframes seamflash { 0% { opacity: 0; } 30% { opacity: 1; } 100% { opacity: 0.55; } }

  /* ================ C:光刻 ================ */
  .vC .diff { position: relative; border: 1px solid var(--border); padding: 10px 14px 12px; overflow: hidden; }
  /* 光束:一次自上而下扫过,下缘亮线 */
  .vC .beam {
    position: absolute; left: 0; right: 0; top: 0; height: 34px; z-index: 3; pointer-events: none;
    background: linear-gradient(180deg, transparent, rgba(194, 255, 217, 0.16) 70%, rgba(194, 255, 217, 0.55));
    animation: litho 1.15s cubic-bezier(0.45, 0, 0.55, 1) 0.15s 1 both;
  }
  @keyframes litho { from { top: -34px; } to { top: 100%; } }
  /* 行只在光束扫过后显影(按行序延迟裁切) */
  .vC .dl { clip-path: inset(0 100% 0 0); animation: expose 0.28s ease-out both; }
  @keyframes expose { to { clip-path: inset(0 0 0 0); } }
  .vC .dhead { clip-path: inset(0 100% 0 0); animation: expose 0.3s ease-out both; }

  /* ---------- 浮条(非设计对象) ---------- */
  #switcher {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 99;
    display: flex; align-items: center; gap: 12px;
    background: #101010; border: 1px solid #444; border-radius: 999px;
    color: #eee; padding: 7px 16px; font-family: ui-monospace, monospace; font-size: 12px;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.6);
  }
  #switcher button {
    background: #222; color: #eee; border: 1px solid #555; border-radius: 50%;
    width: 24px; height: 24px; cursor: pointer; font-size: 13px; line-height: 1;
  }
  #switcher button:hover { background: #333; }
  #switcher .vlabel { min-width: 150px; text-align: center; }
  #switcher .tag { color: #777; font-size: 10px; }
  #replay { border-radius: 12px !important; width: auto !important; padding: 0 10px; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
    .vC .dl, .vC .dhead { clip-path: none; }
    .vA .ring rect { stroke-dashoffset: 0; }
    .vA .del { opacity: 0.45; }
    .vB .del { transform: translateX(-16px); opacity: 0.5; }
  }
</style>
</head>
<body>
<div class="stage" id="stage"></div>

<div id="switcher">
  <span class="tag">PROTO · 3.4 diff 卡</span>
  <button id="prev" title="←">‹</button>
  <span class="vlabel" id="vlabel"></span>
  <button id="next" title="→">›</button>
  <button id="replay" title="重播入场">↻</button>
</div>

<script>
  // mock:handoff §3.4 的真实行结构(行号/符号/代码;一个 hunk:1 上下文 + 4 删 + 5 增)
  const FILE = 'backend/src/dto/palette.dto.ts';
  const ROWS = [
    { t: ' ', n: '41', c: '' },
    { t: '-', n: '42', c: 'height: number;' },
    { t: '-', n: '43', c: '' },
    { t: '-', n: '44', c: 'weight: number;' },
    { t: '-', n: '45', c: '' },
    { t: '+', n: '42', c: '@IsInt() @Min(50) @Max(280)' },
    { t: '+', n: '43', c: 'height: number;' },
    { t: '+', n: '44', c: '' },
    { t: '+', n: '45', c: '@IsInt() @Min(10) @Max(500)' },
    { t: '+', n: '46', c: 'weight: number;' },
    { t: ' ', n: '47', c: '' },
  ];
  const VARIANTS = { A: '烧录显影', B: '变异缝', C: '光刻' };
  const KEYS = Object.keys(VARIANTS);

  const rowHtml = (r, i, delay) => `
    <div class="dl ${r.t === '+' ? 'add' : r.t === '-' ? 'del' : 'ctx'}"${delay != null ? ` style="animation-delay:${delay}s"` : ''}>
      <span class="ln-no">${r.n}</span><span class="ln-sign">${r.t === ' ' ? '·' : r.t}</span><span class="ln-code">${r.c || ' '}</span>
    </div>`;

  const head = `<div class="dhead"><span class="dfile">✎ ${FILE}</span><span class="plus">+5</span><span class="minus">−4</span><span class="mod">MODIFIED</span></div>`;

  function render(v) {
    if (v === 'A') {
      return `<div class="diff">
        <svg class="ring" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><rect x="1" y="1" width="98" height="98" pathLength="400"/></svg>
        ${head}
        ${ROWS.map((r, i) => rowHtml(r, i, 0.1 + i * 0.09)).join('')}
      </div>`;
    }
    if (v === 'B') {
      // 删行组 → 变异缝 → 增行组(上下文行贴缝两侧)
      const ctxPre = ROWS.filter(r => r.t === ' ')[0];
      const dels = ROWS.filter(r => r.t === '-');
      const adds = ROWS.filter(r => r.t === '+');
      return `<div class="diff">${head}
        ${rowHtml(ctxPre, 0, 0)}
        ${dels.map((r, i) => rowHtml(r, i, 0.05 + i * 0.06)).join('')}
        <div class="seam"></div>
        ${adds.map((r, i) => rowHtml(r, i, 0.25 + i * 0.06)).join('')}
      </div>`;
    }
    // C:光束扫过,行按文档序延迟显影(≈ 光束到达该行的时刻)
    return `<div class="diff">
      <span class="beam"></span>
      ${head}
      ${ROWS.map((r, i) => rowHtml(r, i, 0.15 + (i + 1) * 0.075)).join('')}
    </div>`;
  }

  const params = new URLSearchParams(location.search);
  let current = KEYS.includes(params.get('variant')) ? params.get('variant') : 'A';

  function go(v) {
    current = v;
    const url = new URL(location.href);
    url.searchParams.set('variant', v);
    history.replaceState(null, '', url);
    document.getElementById('vlabel').textContent = `${v} — ${VARIANTS[v]}`;
    const stage = document.getElementById('stage');
    stage.className = `stage v${v}`;
    stage.innerHTML = RENDER[v]();
  }
  const RENDER = { A: () => render('A'), B: () => render('B'), C: () => render('C') };
  const cycle = (d) => go(KEYS[(KEYS.indexOf(current) + d + KEYS.length) % KEYS.length]);

  document.getElementById('prev').onclick = () => cycle(-1);
  document.getElementById('next').onclick = () => cycle(1);
  document.getElementById('replay').onclick = () => go(current);
  window.addEventListener('keydown', (e) => {
    const tag = document.activeElement?.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    if (e.key === 'ArrowLeft') cycle(-1);
    if (e.key === 'ArrowRight') cycle(1);
  });

  go(current);
</script>
</body>
</html>
